<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- V2-1: Clean stacked papers with serif font -->
  <g>
    <!-- Back papers -->
    <rect x="12" y="16" width="28" height="32" rx="2" fill="#E5E5E5"/>
    <rect x="16" y="12" width="28" height="32" rx="2" fill="#CCCCCC"/>
    <!-- Front paper with lines -->
    <rect x="8" y="8" width="28" height="32" rx="2" fill="#2BBCC0"/>
    <line x1="12" y1="16" x2="32" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="12" y1="20" x2="32" y2="20" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="12" y1="24" x2="28" y2="24" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="12" y1="28" x2="30" y2="28" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="12" y1="32" x2="26" y2="32" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>
  <text x="48" y="38" font-family="Instrument Serif, serif" font-size="32" font-weight="600" fill="#000000">BREVIS</text>
</svg>
