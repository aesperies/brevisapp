<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFE5D4">
    <meta name="apple-mobile-web-app-capable" content="true">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" data-inline-manifest="true">
    <title>BREVIS — AI Newsletter Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* LIGHT MODE */
            --bg-main: #FFE5D4;
            --bg-cream: #FFF6E0;
            --bg-mint: #B5EAD7;
            --bg-pink: #FFCED1;
            --bg-blue: #C5DEFF;
            --bg-yellow: #FFD23F;
            --bg-lilac: #E4D4FC;
            --ink: #1A1A1A;
            --text-muted: #555555;
            --red: #E63946;
            --white: #FFFFFF;
        }

        [data-theme="dark"] {
            --bg-main: #1A1A1A;
            --bg-cream: #2A2A2A;
            --bg-mint: #3D5A4D;
            --bg-pink: #5A3D40;
            --bg-blue: #3D4A5A;
            --bg-yellow: #FFD23F;
            --bg-lilac: #463D5A;
            --ink: #FFF6E0;
            --text-muted: #AAAAAA;
            --red: #E63946;
            --white: #1A1A1A;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-main);
            color: var(--ink);
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-weight: 700;
            line-height: 1.2;
        }

        h1 { font-size: 40px; font-weight: 800; }
        h2 { font-size: 32px; font-weight: 700; }
        h3 { font-size: 24px; font-weight: 700; }
        h4 { font-size: 20px; font-weight: 600; }

        code, pre, .monospace {
            font-family: 'Space Mono', monospace;
            font-weight: 400;
        }

        #app {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* ============ AUTH VIEWS ============ */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background-color: var(--bg-cream);
            border: 3px solid var(--ink);
            border-radius: 20px;
            padding: 48px;
            box-shadow: 4px 4px 0 var(--ink);
            position: relative;
        }

        .auth-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
        }

        .br-logo {
            width: 48px;
            height: 48px;
        }

        .br-wordmark {
            font-family: 'Bricolage Grotesque';
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .auth-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            background-color: transparent;
        }

        .auth-tab {
            flex: 1;
            padding: 12px 16px;
            border: 3px solid var(--ink);
            background-color: transparent;
            font-family: 'Inter';
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .auth-tab:hover {
            transform: translate(-2px, -2px);
            box-shadow: 3px 3px 0 var(--ink);
        }

        .auth-tab.active {
            background-color: var(--bg-yellow);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-family: 'Space Mono';
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 3px solid var(--ink);
            background-color: var(--bg-cream);
            font-family: 'Inter';
            font-size: 14px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            box-shadow: 4px 4px 0 var(--ink);
            transform: translate(-2px, -2px);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            padding: 14px 24px;
            border: 3px solid var(--ink);
            font-family: 'Inter';
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--bg-yellow);
            width: 100%;
            box-shadow: 5px 5px 0 var(--red);
        }

        .btn-primary:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0 var(--red);
        }

        .btn-primary:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 var(--red);
        }

        .forgot-link {
            color: var(--ink);
            font-size: 13px;
            text-decoration: none;
            border-bottom: 2px solid var(--ink);
            cursor: pointer;
        }

        .forgot-link:hover {
            opacity: 0.7;
        }

        .plan-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 24px 0;
        }

        .plan-card {
            padding: 20px;
            border: 3px solid var(--ink);
            border-radius: 12px;
            background-color: var(--bg-cream);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .plan-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .plan-card.selected {
            background-color: var(--bg-yellow);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .plan-name {
            font-family: 'Bricolage Grotesque';
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .plan-price {
            font-family: 'Space Mono';
            font-size: 14px;
            color: var(--text-muted);
        }

        /* ============ SIDEBAR NAVIGATION ============ */
        .sidebar {
            width: 280px;
            background-color: var(--bg-cream);
            border-right: 3px solid var(--ink);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 24px 0;
        }

        .sidebar-logo-section {
            padding: 0 20px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-br {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }

        .sidebar-brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .sidebar-wordmark {
            font-family: 'Bricolage Grotesque';
            font-size: 18px;
            font-weight: 800;
        }

        .plan-badge {
            display: inline-block;
            background-color: var(--bg-yellow);
            border: 2px solid var(--ink);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'Space Mono';
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            width: fit-content;
        }

        .new-newsletter-btn {
            margin: 0 20px 24px 20px;
            width: calc(100% - 40px);
            background-color: var(--bg-yellow);
            box-shadow: 3px 3px 0 var(--ink);
        }

        .nav-section {
            padding: 0 20px;
            margin-bottom: 32px;
        }

        .nav-section-title {
            font-family: 'Space Mono';
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .nav-item {
            padding: 12px 14px;
            margin-bottom: 8px;
            border: 3px solid transparent;
            border-left: 3px solid var(--ink);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 14px;
        }

        .nav-item:hover {
            background-color: var(--bg-mint);
            border-left-color: var(--ink);
        }

        .nav-item.active {
            background-color: var(--bg-mint);
            border: 3px solid var(--ink);
            border-left: 3px solid var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
        }

        .count-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            height: 24px;
            background-color: var(--bg-yellow);
            border: 2px solid var(--ink);
            border-radius: 6px;
            font-family: 'Space Mono';
            font-size: 12px;
            font-weight: 700;
        }

        .tags-section .nav-section-title {
            margin-top: 20px;
        }

        .tag-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background-color: var(--bg-cream);
            border: 2px solid var(--ink);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            margin-right: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .tag-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .sidebar-bottom {
            margin-top: auto;
            padding: 20px;
            border-top: 3px solid var(--ink);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toggle-group {
            display: flex;
            gap: 8px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid var(--ink);
            background-color: var(--bg-cream);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background-color: var(--bg-yellow);
        }

        .sidebar-icons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: 2px solid var(--ink);
            background-color: var(--bg-cream);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 16px;
        }

        .icon-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 2px 2px 0 var(--ink);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--bg-pink), var(--bg-mint));
            border: 2px solid var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--ink);
        }

        /* ============ MAIN CONTENT AREA ============ */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
            overflow: hidden;
        }

        .top-bar {
            padding: 20px 24px;
            display: flex;
            gap: 16px;
            align-items: center;
            border-bottom: 3px solid var(--ink);
            background-color: var(--bg-main);
            flex-shrink: 0;
        }

        .search-container {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 3px solid var(--ink);
            background-color: var(--bg-cream);
            border-radius: 8px;
            font-family: 'Inter';
            font-size: 14px;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 4px 4px 0 var(--ink);
            transform: translate(-2px, -2px);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: var(--text-muted);
        }

        .top-bar-actions {
            display: flex;
            gap: 12px;
        }

        .filter-dropdown, .view-toggle, .selection-mode {
            padding: 12px 16px;
            border: 3px solid var(--ink);
            background-color: var(--bg-cream);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter';
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .filter-dropdown:hover, .view-toggle:hover, .selection-mode:hover {
            transform: translate(-2px, -2px);
            box-shadow: 3px 3px 0 var(--ink);
        }

        .bulk-actions-bar {
            display: none;
            position: fixed;
            top: 80px;
            left: 280px;
            right: 0;
            height: 60px;
            background-color: var(--bg-yellow);
            border: 3px solid var(--ink);
            border-bottom: 3px solid var(--ink);
            padding: 12px 24px;
            gap: 16px;
            align-items: center;
            z-index: 100;
            box-shadow: 6px 6px 0 var(--ink);
        }

        .bulk-actions-bar.active {
            display: flex;
        }

        .bulk-count {
            font-weight: 700;
            margin-right: 16px;
            border-right: 2px solid var(--ink);
            padding-right: 16px;
        }

        /* ============ NEWSLETTER CARDS ============ */
        .newsletter-list {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            align-content: start;
        }

        .newsletter-card {
            background-color: var(--bg-cream);
            border: 3px solid var(--ink);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 5px 5px 0 var(--ink);
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .newsletter-card:nth-child(1),
        .newsletter-card:nth-child(4) {
            background-color: var(--bg-cream);
        }

        .newsletter-card:nth-child(2),
        .newsletter-card:nth-child(5) {
            background-color: var(--bg-blue);
        }

        .newsletter-card:nth-child(3) {
            background-color: var(--bg-pink);
        }

        .newsletter-card:nth-child(6) {
            background-color: var(--bg-lilac);
        }

        .newsletter-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0 var(--ink);
        }

        .newsletter-card.read {
            opacity: 0.65;
        }

        .newsletter-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .newsletter-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .newsletter-sender {
            font-family: 'Space Mono';
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .newsletter-date {
            font-family: 'Space Mono';
            font-size: 12px;
            color: var(--text-muted);
        }

        .newsletter-badges {
            display: flex;
            gap: 8px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            border: 2px solid var(--ink);
            border-radius: 6px;
            font-family: 'Space Mono';
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-new {
            background-color: var(--red);
            color: var(--bg-yellow);
        }

        .newsletter-title {
            font-family: 'Bricolage Grotesque';
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
            word-break: break-word;
        }

        .newsletter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag-pill {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            background-color: rgba(255, 255, 255, 0.3);
            border: 2px solid var(--ink);
            border-radius: 6px;
            font-family: 'Space Mono';
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .ai-summary-box {
            background-color: rgba(255, 255, 255, 0.3);
            border: 2px solid var(--ink);
            padding: 16px;
            border-radius: 10px;
        }

        .ai-summary-label {
            font-family: 'Space Mono';
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ai-summary-text {
            font-size: 13px;
            line-height: 1.5;
            color: var(--ink);
        }

        .newsletter-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border: 2px solid var(--ink);
            background-color: var(--bg-cream);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 2px 2px 0 var(--ink);
        }

        .action-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 0 0 0 var(--ink);
        }

        .action-menu {
            position: relative;
        }

        .action-menu-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background-color: var(--bg-cream);
            border: 3px solid var(--ink);
            border-radius: 8px;
            box-shadow: 4px 4px 0 var(--ink);
            min-width: 180px;
            z-index: 200;
            display: none;
        }

        .action-menu-dropdown.active {
            display: block;
        }

        .action-menu-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 2px solid var(--ink);
            font-size: 13px;
            transition: all 0.2s;
        }

        .action-menu-item:last-child {
            border-bottom: none;
        }

        .action-menu-item:hover {
            background-color: var(--bg-yellow);
        }

        /* ============ READER VIEW ============ */
        .reader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-cream);
            z-index: 300;
            display: none;
            flex-direction: column;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .reader-overlay.active {
            display: flex;
        }

        .reader-top-bar {
            padding: 20px 24px;
            border-bottom: 3px solid var(--ink);
            display: flex;
            gap: 16px;
            align-items: center;
            background-color: var(--bg-cream);
            flex-shrink: 0;
        }

        .reader-back-btn {
            width: 40px;
            height: 40px;
            border: 2px solid var(--ink);
            background-color: var(--bg-cream);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        .reader-back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 3px 3px 0 var(--ink);
        }

        .reader-title {
            flex: 1;
            font-family: 'Bricolage Grotesque';
            font-size: 24px;
            font-weight: 700;
        }

        .reader-actions {
            display: flex;
            gap: 8px;
        }

        .reader-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background-color: var(--red);
            width: 0%;
            transition: width 0.3s;
        }

        .reader-content {
            flex: 1;
            overflow-y: auto;
            padding: 48px 24px;
            display: flex;
            justify-content: center;
        }

        .reader-body {
            max-width: 720px;
            width: 100%;
        }

        .reader-body-title {
            font-family: 'Bricolage Grotesque';
            font-size: 40px;
            font-weight: 800;
            margin-bottom: 24px;
            line-height: 1.2;
        }

        .reader-metadata {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
            font-family: 'Space Mono';
            font-size: 13px;
            color: var(--text-muted);
            padding-bottom: 24px;
            border-bottom: 2px solid var(--ink);
        }

        .reader-summary {
            background-color: var(--bg-mint);
            border: 3px solid var(--ink);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 32px;
            box-shadow: 4px 4px 0 var(--ink);
        }

        .reader-summary-title {
            font-family: 'Space Mono';
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reader-text {
            font-family: 'Inter';
            font-size: 17px;
            line-height: 1.8;
            color: var(--ink);
        }

        .reader-text p {
            margin-bottom: 20px;
        }

        .reader-text h2 {
            margin-top: 32px;
            margin-bottom: 16px;
            font-family: 'Bricolage Grotesque';
            font-size: 28px;
        }

        .reader-text strong {
            font-weight: 600;
        }

        /* ============ MODALS ============ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 400;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background-color: var(--bg-cream);
            border: 3px solid var(--ink);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 8px 8px 0 var(--ink);
            max-height: 90vh;
            overflow-y: auto;
            max-width: 600px;
            width: 90%;
            position: relative;
        }

        .modal-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border: 2px solid var(--ink);
            background-color: var(--bg-cream);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        .modal-close-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 2px 2px 0 var(--ink);
        }

        .modal-title {
            font-family: 'Bricolage Grotesque';
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            margin-top: 12px;
        }

        .modal-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--ink);
        }

        .modal-tab {
            padding: 12px 16px;
            border: 2px solid var(--ink);
            background-color: transparent;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .modal-tab.active {
            background-color: var(--bg-yellow);
            box-shadow: 2px 2px 0 var(--ink);
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ============ KNOWLEDGE GRAPH ============ */
        .graph-container {
            width: 100%;
            height: 600px;
            border: 3px solid var(--ink);
            border-radius: 12px;
            background-color: var(--bg-cream);
            margin-bottom: 24px;
        }

        .graph-filter {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 280px;
        }

        .graph-filter-card {
            border: 3px solid var(--ink);
            padding: 20px;
            border-radius: 12px;
            background-color: var(--bg-cream);
        }

        /* ============ PLAN CARDS ============ */
        .plan-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 24px 0;
        }

        .upgrade-plan-card {
            border: 3px solid var(--ink);
            border-radius: 12px;
            padding: 24px;
            background-color: var(--bg-cream);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upgrade-plan-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .upgrade-plan-card.selected {
            box-shadow: 4px 4px 0 var(--ink);
            background-color: var(--bg-yellow);
        }

        .plan-card-name {
            font-family: 'Bricolage Grotesque';
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .plan-card-price {
            font-family: 'Space Mono';
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .plan-features {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            font-size: 13px;
            margin-top: 16px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feature-check {
            color: var(--red);
            font-weight: 700;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 1024px) {
            .newsletter-list {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        @media (max-width: 768px) {
            #app {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                max-height: 0;
                border-right: none;

            .main-content {

            }

            .top-bar {

            }

            .newsletter-card {

            .modal {

            h1 { font-size: 28px; }

        }

            background: var(--text-muted);

        .hidden {

        }

        .flex-center {

        }

                        <div className="nav-section tags-section">
                            <div className="nav-section-title">{t('tags')}</div>
                            {mockTags.map(tag => (
                                <div key={tag.name} className="tag-item">
                                    <div className="tag-dot" style={{ backgroundColor: tag.color }}></div>
                                    {tag.name}
                                </div>
                            ))}
                        </div>

                        {/* SUBSCRIPTIONS */}
                        <div className="nav-section">
                            <div className="nav-section-title">{t('subscriptions')}</div>
                            <div className="tag-item">
                                🔗 Tech News RSS
                            </div>
                            <div className="tag-item">
                                📰 Legal Updates
                            </div>
                        </div>

                        {/* INTELLIGENCE */}
                        <div className="nav-section">
                            <div className="nav-section-title">{t('intelligence')}</div>
                            <button
                                className="btn"
                                onClick={() => { setActiveModal('graph'); setSidebarOpen(false); }}
                                style={{ width: '100%', marginBottom: '8px' }}
                            >
                                {t('knowledgeGraph')}
                            </button>
                            <button
                                className="btn"
                                onClick={() => { setActiveModal('kb'); setSidebarOpen(false); }}
                                style={{ width: '100%' }}
                            >
                                {t('knowledgeBases')}
                            </button>
                        </div>

                        {/* BOTTOM CONTROLS */}
                        <div className="sidebar-bottom">
                            <div className="toggle-group">
                                <button
                                    className={`toggle-btn ${theme === 'light' ? 'active' : ''}`}
                                    onClick={() => setTheme('light')}
                                    title="Light mode"
                                >
                                    ☀️ {t('lightMode')}
                                </button>
                                <button
                                    className={`toggle-btn ${theme === 'dark' ? 'active' : ''}`}
                                    onClick={() => setTheme('dark')}
                                    title="Dark mode"
                                >
                                    🌙 {t('darkMode')}
                                </button>
                            </div>

                            <div className="toggle-group">
                                <button
                                    className={`toggle-btn ${language === 'en' ? 'active' : ''}`}
                                    onClick={() => setLanguage('en')}
                                >
                                    EN
                                </button>
                                <button
                                    className={`toggle-btn ${language === 'es' ? 'active' : ''}`}
                                    onClick={() => setLanguage('es')}
                                >
                                    ES
                                </button>
                            </div>

                            <div className="sidebar-icons">
                                <button className="icon-btn" onClick={() => setActiveModal('settings')} title="Settings">
                                    ⚙️
                                </button>
                                <div className="user-avatar">AB</div>
                            </div>
                        </div>
                    </aside>

                    {/* MAIN CONTENT */}
                    <div className="main-content">
                        {/* TOP BAR */}
                        <div className="top-bar">
                            <button
                                className="icon-btn"
                                onClick={() => setSidebarOpen(!sidebarOpen)}
                                style={{ display: 'none', '@media (max-width: 768px)': { display: 'block' } }}
                            >
                                ☰
                            </button>

                            <div className="search-container">
                                <span className="search-icon">🔍</span>
                                <input
                                    type="text"
                                    className="search-input"
                                    placeholder={t('search')}
                                />
                            </div>

                            <button className="filter-dropdown" onClick={() => setActiveModal('filter')}>
                                {t('filter')}
                            </button>
                            <button className="view-toggle">📊 {t('viewToggle')}</button>
                            <button className="selection-mode" onClick={() => setSelectedItems([])}>
                                ✓ {t('selectionMode')}
                            </button>
                        </div>

                        {/* BULK ACTIONS */}
                        {selectedItems.length > 0 && (
                            <div className="bulk-actions-bar active">
                                <span className="bulk-count">
                                    {selectedItems.length} selected
                                </span>
                                <button className="btn" style={{ background: 'var(--bg-cream)' }}>
                                    ✓ {t('markRead')}
                                </button>
                                <button className="btn" style={{ background: 'var(--bg-cream)' }}>
                                    📧 {t('sendToKindle')}
                                </button>
                                <button
                                    className="btn"
                                    onClick={() => setSelectedItems([])}
                                    style={{ background: 'var(--red)', color: 'white' }}
                                >
                                    Clear
                                </button>
                            </div>
                        )}

                        {/* NEWSLETTER GRID */}
                        <div className="newsletter-list">
                            {filteredNewsletters.map(newsletter => (
                                <div
                                    key={newsletter.id}
                                    className={`newsletter-card ${newsletter.isRead ? 'read' : ''}`}
                                    onClick={() => {
                                        setSelectedNewsletter(newsletter);
                                        setCurrentView('reader');
                                    }}
                                >
                                    <div className="newsletter-header">
                                        <div className="newsletter-meta">
                                            <div className="newsletter-sender">{newsletter.sender}</div>
                                            <div className="newsletter-date">{newsletter.date}</div>
                                        </div>
                                        <div className="newsletter-badges">
                                            {newsletter.isUnread && (
                                                <div className="badge badge-new">NEW</div>
                                            )}
                                        </div>
                                    </div>

                                    <h3 className="newsletter-title">{newsletter.title}</h3>

                                    <div className="newsletter-tags">
                                        {newsletter.tags.map(tag => (
                                            <span key={tag} className="tag-pill">{tag}</span>
                                        ))}
                                    </div>

                                    <div className="ai-summary-box">
                                        <div className="ai-summary-label">
                                            ✦ {t('aiSummary')}
                                        </div>
                                        <div className="ai-summary-text">
                                            {newsletter.summary}
                                        </div>
                                    </div>

                                    <div className="newsletter-actions">
                                        <button
                                            className="action-btn"
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                setSelectedNewsletter(prev => ({
                                                    ...prev,
                                                    isRead: !prev.isRead,
                                                }));
                                            }}
                                            title={t('markRead')}
                                        >
                                            ✓
                                        </button>
                                        <button
                                            className="action-btn"
                                            onClick={(e) => { e.stopPropagation(); }}
                                            title={t('sendToKindle')}
                                        >
                                            📧
                                        </button>
                                        <div className="action-menu">
                                            <button className="action-btn" onClick={(e) => {
                                                e.stopPropagation();
                                                const menu = e.currentTarget.parentElement.querySelector('.action-menu-dropdown');
                                                menu.classList.toggle('active');
                                            }}>
                                                ⋯
                                            </button>
                                            <div className="action-menu-dropdown">
                                                <div className="action-menu-item">Edit tags</div>
                                                <div className="action-menu-item">Move to folder</div>
                                                <div className="action-menu-item" style={{ color: 'var(--red)' }}>Delete</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* READER VIEW */}
                    {selectedNewsletter && (
                        <div className="reader-overlay active">
                            <div className="reader-top-bar">
                                <button
                                    className="reader-back-btn"
                                    onClick={() => {
                                        setSelectedNewsletter(null);
                                        setCurrentView('newsletters');
                                    }}
                                >
                                    ←
                                </button>
                                <h1 className="reader-title">{selectedNewsletter.title}</h1>
                                <div className="reader-actions">
                                    <button className="btn" style={{ padding: '8px 12px', fontSize: '12px' }}>
                                        {t('markRead')}
                                    </button>
                                    <button className="btn" style={{ padding: '8px 12px', fontSize: '12px' }}>
                                        {t('sendToKindle')}
                                    </button>
                                </div>
                            </div>
                            <div className="reader-progress" style={{ width: '35%' }}></div>

                            <div className="reader-content">
                                <div className="reader-body">
                                    <h1 className="reader-body-title">{selectedNewsletter.title}</h1>

                                    <div className="reader-metadata">
                                        <span><strong>{selectedNewsletter.sender}</strong></span>
                                        <span>•</span>
                                        <span>{selectedNewsletter.date}</span>
                                        <span>•</span>
                                        <span>5 min {t('readingTime')}</span>
                                    </div>

                                    <div className="reader-summary">
                                        <div className="reader-summary-title">
                                            ✦ {t('aiSummary')}
                                        </div>
                                        <div className="reader-text">
                                            {selectedNewsletter.summary}
                                        </div>
                                    </div>

                                    <div
                                        className="reader-text"
                                        dangerouslySetInnerHTML={{
                                            __html: DOMPurify.sanitize(selectedNewsletter.content)
                                        }}
                                    />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* IMPORT MODAL */}
                    {activeModal === 'import' && (
                        <div className="modal-overlay active" onClick={() => setActiveModal(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <button className="modal-close-btn" onClick={() => setActiveModal(null)}>✕</button>
                                <h2 className="modal-title">{t('importNewsletter')}</h2>

                                <div className="modal-tabs">
                                    <button className="modal-tab active">URL</button>
                                    <button className="modal-tab">PDF</button>
                                    <button className="modal-tab">{t('manual')}</button>
                                </div>

                                <form className="modal-form" onSubmit={(e) => { e.preventDefault(); setActiveModal(null); }}>
                                    <div className="form-group">
                                        <label className="form-label">{t('url')}</label>
                                        <input type="url" className="form-input" placeholder="https://..." required />
                                    </div>
                                    <button type="submit" className="btn btn-primary">Import</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* KNOWLEDGE GRAPH MODAL */}
                    {activeModal === 'graph' && (
                        <div className="modal-overlay active" onClick={() => setActiveModal(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '1000px', maxHeight: '90vh' }}>
                                <button className="modal-close-btn" onClick={() => setActiveModal(null)}>✕</button>
                                <h2 className="modal-title">{t('knowledgeGraph')}</h2>

                                <div className="modal-tabs">
                                    <button className="modal-tab active">Browse</button>
                                    <button className="modal-tab">Query</button>
                                </div>

                                <div className="graph-container" style={{ height: '500px', background: 'linear-gradient(135deg, var(--bg-cream), var(--bg-blue))', border: '3px solid var(--ink)' }}>
                                    <div style={{ padding: '40px', textAlign: 'center', color: 'var(--text-muted)' }}>
                                        Knowledge graph visualization will appear here
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* KB MODAL */}
                    {activeModal === 'kb' && (
                        <div className="modal-overlay active" onClick={() => setActiveModal(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '900px' }}>
                                <button className="modal-close-btn" onClick={() => setActiveModal(null)}>✕</button>
                                <h2 className="modal-title">{t('knowledgeBases')}</h2>

                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '20px', marginTop: '24px' }}>
                                    {['Legal Compliance', 'AI Best Practices', 'Vendor Database', 'Case Studies'].map((kb) => (
                                        <div key={kb} className="upgrade-plan-card" style={{ cursor: 'pointer', minHeight: '120px', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
                                            <h4 className="plan-card-name">{kb}</h4>
                                            <p style={{ fontSize: '12px', color: 'var(--text-muted)' }}>32 articles</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* UPGRADE PLAN MODAL */}
                    {activeModal === 'upgrade' && (
                        <div className="modal-overlay active" onClick={() => setActiveModal(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <button className="modal-close-btn" onClick={() => setActiveModal(null)}>✕</button>
                                <h2 className="modal-title">{t('upgradePlan')}</h2>

                                <div className="plan-cards">
                                    {[
                                        { name: 'Free', price: '$0', features: ['5 newsletters', 'Basic summaries'] },
                                        { name: 'Standard', price: '$12/mo', features: ['Unlimited newsletters', 'AI summaries', 'Tags & folders'] },
                                        { name: 'Premium', price: '$29/mo', features: ['Everything in Standard', 'Knowledge Graph', 'Custom AI rules'] },
                                    ].map((plan) => (
                                        <div key={plan.name} className="upgrade-plan-card">
                                            <h4 className="plan-card-name">{plan.name}</h4>
                                            <div className="plan-card-price">{plan.price}</div>
                                            <div className="plan-features">
                                                {plan.features.map((feature) => (
                                                    <div key={feature} className="feature-item">
                                                        <span className="feature-check">✓</span>
                                                        <span>{feature}</span>
                                                    </div>
                                                ))}
                                            </div>
                                            <button className="btn btn-primary" style={{ marginTop: '16px', width: '100%' }}>
                                                {t('upgrade')}
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SETTINGS MODAL */}
                    {activeModal === 'settings' && (
                        <div className="modal-overlay active" onClick={() => setActiveModal(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <button className="modal-close-btn" onClick={() => setActiveModal(null)}>✕</button>
                                <h2 className="modal-title">{t('profileSettings')}</h2>

                                <form className="modal-form" onSubmit={(e) => { e.preventDefault(); setActiveModal(null); }}>
                                    <div className="form-group">
                                        <label className="form-label">{t('name')}</label>
                                        <input type="text" className="form-input" placeholder="Antonio Bitkraft" />
                                    </div>

                                    <div className="form-group">
                                        <label className="form-label">{t('email')}</label>
                                        <input type="email" className="form-input" placeholder="antonio@bitkraft.vc" />
                                    </div>

                                    <div className="form-group">
                                        <label className="form-label">{t('kindleEmail')}</label>
                                        <input type="email" className="form-input" placeholder="email@kindle.com" />
                                    </div>

                                    <div className="form-group">
                                        <label className="form-label">{t('password')}</label>
                                        <button type="button" className="btn" style={{ width: '100%' }}>
                                            Change Password
                                        </button>
                                    </div>

                                    <button type="submit" className="btn btn-primary">
                                        {t('save')}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* FILTER MODAL */}
                    {activeModal === 'filter' && (
                        <div className="modal-overlay active" onClick={() => setActiveModal(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <button className="modal-close-btn" onClick={() => setActiveModal(null)}>✕</button>
                                <h2 className="modal-title">Filter Options</h2>

                                <form className="modal-form">
                                    <div className="form-group">
                                        <label className="form-label">By Tags</label>
                                        {mockTags.map(tag => (
                                            <label key={tag.name} style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '8px', cursor: 'pointer' }}>
                                                <input type="checkbox" />
                                                <div className="tag-dot" style={{ backgroundColor: tag.color, width: '10px', height: '10px' }}></div>
                                                {tag.name}
                                            </label>
                                        ))}
                                    </div>

                                    <button type="button" className="btn btn-primary" onClick={() => setActiveModal(null)}>
                                        Apply Filters
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </>
            );
        }

        // RENDER
        function Root() {
            const [isLoggedIn, setIsLoggedIn] = useState(true);

            return isLoggedIn ? <App /> : <AuthView />;
        }

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<Root />);
    </script>
</body>
</html>
