        // Lucide icon helper
        function LucideIcon({ name, size = 16, style = {} }) {
            const ref = React.useRef(null);
            React.useEffect(() => {
                if (ref.current) {
                    ref.current.innerHTML = '';
                    const icon = lucide.icons[name];
                    if (icon) {
                        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                        svg.setAttribute('width', size);
                        svg.setAttribute('height', size);
                        svg.setAttribute('viewBox', '0 0 24 24');
                        svg.setAttribute('fill', 'none');
                        svg.setAttribute('stroke', 'currentColor');
                        svg.setAttribute('stroke-width', '2');
                        svg.setAttribute('stroke-linecap', 'round');
                        svg.setAttribute('stroke-linejoin', 'round');
                        svg.innerHTML = icon[0];
                        ref.current.appendChild(svg);
                    }
                }
            }, [name, size]);
            return <span ref={ref} style={{display: 'inline-flex', alignItems: 'center', ...style}} />;
        }

        // ============ COMPONENT ============
        function KnowledgeGraphDemo() {
            const { useState, useEffect, useRef, useCallback } = React;
            const containerRef = useRef(null);
            const networkRef = useRef(null);
            const [language, setLanguage] = useState('en');

            const [graphData, setGraphData] = useState(null);
            const [stats, setStats] = useState(MOCK_STATS);
            const [loading, setLoading] = useState(true);
            const [selectedNode, setSelectedNode] = useState(null);
            const [nodeDetail, setNodeDetail] = useState(null);
            const [nlQuery, setNlQuery] = useState('');
            const [nlResult, setNlResult] = useState('');
            const [querying, setQuerying] = useState(false);

            const [filterTypes, setFilterTypes] = useState([]);
            const [filterSearch, setFilterSearch] = useState('');
            const [filterMinMentions, setFilterMinMentions] = useState(1);
            const [showFilters, setShowFilters] = useState(false);

            const t = language === 'es' ? {
                title: 'Knowledge Graph',
                loading: 'Cargando grafo...',
                noData: 'Sin datos aún.',
                entities: 'Entidades',
                relationships: 'Relaciones',
                communities: 'Comunidades',
                filters: 'Filtros',
                search: 'Buscar entidades...',
                minMentions: 'Menciones mínimas',
                close: 'Cerrar',
                mentions: 'menciones',
                firstSeen: 'Primera vez',
                lastSeen: 'Última vez',
                connections: 'Conexiones',
                newsletters: 'Newsletters',
                backfill: 'Analizar newsletters existentes',
                askPlaceholder: '¿Quién ha invertido en empresas de gaming?',
                ask: 'Preguntar',
                deleteNode: 'Eliminar',
            } : {
                title: 'Knowledge Graph',
                loading: 'Loading graph...',
                noData: 'No data yet.',
                entities: 'Entities',
                relationships: 'Relationships',
                communities: 'Communities',
                filters: 'Filters',
                search: 'Search entities...',
                minMentions: 'Min mentions',
                close: 'Close',
                mentions: 'mentions',
                firstSeen: 'First seen',
                lastSeen: 'Last seen',
                connections: 'Connections',
                newsletters: 'Newsletters',
                backfill: 'Analyze existing newsletters',
                askPlaceholder: 'Who has invested in gaming companies?',
                ask: 'Ask',
                deleteNode: 'Delete',
            };

            const NODE_COLORS = {
                person: '#00b894', company: '#74b9ff', fund: '#a29bfe', deal: '#fdcb6e',
                technology: '#e17055', regulation: '#d63031', topic: '#636e72', event: '#e84393',
                location: '#00cec9', token: '#f39c12', protocol: '#6c5ce7', dao: '#fd79a8',
                chain: '#00b894', organization: '#0984e3', product: '#e17055'
            };
            const NODE_SHAPES = {
                person: 'dot', company: 'diamond', fund: 'triangle', deal: 'star',
                technology: 'square', regulation: 'triangleDown', topic: 'hexagon',
                token: 'diamond', protocol: 'square', dao: 'triangle',
            };

            // Filter mock data
            const getFilteredData = useCallback(() => {
                let nodes = [...MOCK_NODES];
                if (filterTypes.length) nodes = nodes.filter(n => filterTypes.includes(n.node_type));
                if (filterSearch) nodes = nodes.filter(n => n.name.toLowerCase().includes(filterSearch.toLowerCase()));
                if (filterMinMentions > 1) nodes = nodes.filter(n => n.mention_count >= filterMinMentions);
                const nodeIds = new Set(nodes.map(n => n.id));
                const edges = MOCK_EDGES.filter(e => nodeIds.has(e.source_id) && nodeIds.has(e.target_id));
                return { nodes, edges };
            }, [filterTypes, filterSearch, filterMinMentions]);

            useEffect(() => {
                setTimeout(() => {
                    setGraphData(getFilteredData());
                    setLoading(false);
                }, 800);
            }, []);

            useEffect(() => {
                if (!loading) setGraphData(getFilteredData());
            }, [filterTypes, filterSearch, filterMinMentions]);

            // vis.js network
            useEffect(() => {
                if (!graphData || !containerRef.current || !graphData.nodes.length) return;

                const nodes = new vis.DataSet(graphData.nodes.map(n => ({
                    id: n.id,
                    label: n.name,
                    color: { background: NODE_COLORS[n.node_type] || '#636e72', border: 'transparent',
                             highlight: { background: NODE_COLORS[n.node_type] || '#636e72', border: '#2BBCC0' } },
                    shape: NODE_SHAPES[n.node_type] || 'dot',
                    size: Math.min(10 + n.mention_count * 3, 40),
                    font: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-primary').trim() || '#000', size: 12, face: 'Instrument Sans' },
                    title: `${n.name} (${n.node_type}) — ${n.mention_count} ${t.mentions}`,
                    borderWidth: 0, borderWidthSelected: 2,
                })));

                const edges = new vis.DataSet(graphData.edges.map(e => ({
                    id: e.id, from: e.source_id, to: e.target_id,
                    label: e.relationship || '',
                    color: { color: 'rgba(150,150,150,0.4)', highlight: '#2BBCC0' },
                    font: { size: 9, color: getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#767676', strokeWidth: 0 },
                    arrows: { to: { enabled: true, scaleFactor: 0.5 } },
                    smooth: { type: 'continuous' },
                    dashes: e.is_inferred ? [5, 5] : false,
                    width: Math.min(1 + (e.weight || 1) * 0.5, 4),
                })));

                const options = {
                    physics: {
                        solver: 'forceAtlas2Based',
                        forceAtlas2Based: { gravitationalConstant: -50, centralGravity: 0.005, springLength: 140, springConstant: 0.04, damping: 0.4 },
                        stabilization: { iterations: 200, fit: true },
                        maxVelocity: 30,
                    },
                    interaction: { hover: true, tooltipDelay: 200, zoomView: true, dragView: true, keyboard: { enabled: true } },
                    layout: { improvedLayout: true },
                };

                if (networkRef.current) networkRef.current.destroy();
                const network = new vis.Network(containerRef.current, { nodes, edges }, options);
                networkRef.current = network;

                network.on('click', (params) => {
                    if (params.nodes.length > 0) {
                        const nodeId = params.nodes[0];
                        const node = MOCK_NODES.find(n => n.id === nodeId);
                        setSelectedNode(nodeId);
                        setNodeDetail({
                            node: { ...node, first_seen: '2026-01-15T10:00:00Z', last_seen: '2026-04-05T14:30:00Z' },
                            connections: MOCK_CONNECTIONS[nodeId] || [],
                            newsletters: MOCK_NEWSLETTERS[nodeId] || [],
                        });
                    } else {
                        setSelectedNode(null);
                        setNodeDetail(null);
                    }
                });

                network.once('stabilizationIterationsDone', () => {
                    network.setOptions({ physics: { enabled: false } });
                });

                return () => { if (networkRef.current) networkRef.current.destroy(); };
            }, [graphData]);

            const focusNode = (nodeId) => {
                if (networkRef.current) {
                    networkRef.current.focus(nodeId, { scale: 1.5, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
                    networkRef.current.selectNodes([nodeId]);
                    // Also load detail
                    const node = MOCK_NODES.find(n => n.id === nodeId);
                    if (node) {
                        setSelectedNode(nodeId);
                        setNodeDetail({
                            node: { ...node, first_seen: '2026-01-15T10:00:00Z', last_seen: '2026-04-05T14:30:00Z' },
                            connections: MOCK_CONNECTIONS[nodeId] || [],
                            newsletters: MOCK_NEWSLETTERS[nodeId] || [],
                        });
                    }
                }
            };

            const handleNlQuery = () => {
                if (!nlQuery.trim()) return;
                setQuerying(true);
                setNlResult('');
                setTimeout(() => {
                    if (nlQuery.toLowerCase().includes('gaming') || nlQuery.toLowerCase().includes('invest')) {
                        setNlResult('Based on your knowledge graph, BITKRAFT Ventures has invested in Immutable, Sky Mavis, and Animoca Brands — all Web3 gaming companies. a16z Crypto also invested in Animoca Brands, while Paradigm backed Immutable\'s $200M Series C alongside a16z Crypto. The Web3 Gaming topic connects 6 entities in your graph, making it the densest cluster.');
                    } else if (nlQuery.toLowerCase().includes('ethereum') || nlQuery.toLowerCase().includes('eth')) {
                        setNlResult('Vitalik Buterin co-created ETH, which is governed by the SEC Token Framework. zkSync operates as an L2 on Ethereum. The MiCA Regulation may affect the IMX token issued by Immutable. Your graph shows 3 tokens (ETH, IMX, RON) with 25 total mentions.');
                    } else {
                        setNlResult('Your knowledge graph contains 31 entities across 8 types, with 34 relationships. The densest clusters are around BITKRAFT Ventures (7 connections), Web3 Gaming (6 connections), and the Microsoft-Activision deal (4 connections). Try asking about specific companies, people, or topics for deeper insights.');
                    }
                    setQuerying(false);
                }, 1500);
            };

            const entityTypes = MOCK_STATS.typeDistribution.map(td => td.node_type);
            const toggleTypeFilter = (type) => {
                setFilterTypes(prev => prev.includes(type) ? prev.filter(t => t !== type) : [...prev, type]);
            };

            return (
                <div style={{width: '100vw', height: 'calc(100vh - 40px)', display: 'flex', flexDirection: 'column', background: 'var(--bg-primary)'}}>
                    {/* Header */}
                    <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 16px', borderBottom: '1px solid var(--border)', flexShrink: 0, background: 'var(--bg-secondary)'}}>
                        <div style={{display: 'flex', alignItems: 'center', gap: 12}}>
                            <LucideIcon name="network" size={20} />
                            <h2 style={{margin: 0, fontSize: 18, fontWeight: 600}}>{t.title}</h2>
                            <div style={{display: 'flex', gap: 12, marginLeft: 16, fontSize: 12, color: 'var(--text-secondary)'}}>
                                <span>{stats.total_nodes} {t.entities}</span>
                                <span>{stats.total_edges} {t.relationships}</span>
                                <span>{stats.total_communities} {t.communities}</span>
                            </div>
                        </div>
                        <div style={{display: 'flex', alignItems: 'center', gap: 8}}>
                            <button className="btn btn-small" onClick={() => setShowFilters(!showFilters)} style={{background: showFilters ? 'var(--accent-bg)' : undefined}}>
                                <LucideIcon name="sliders-horizontal" size={14} />
                                <span style={{marginLeft: 4}}>{t.filters}</span>
                            </button>
                            <button className="btn btn-small" onClick={() => setLanguage(language === 'en' ? 'es' : 'en')}>
                                {language === 'en' ? 'ES' : 'EN'}
                            </button>
                        </div>
                    </div>

                    {/* Filters bar */}
                    {showFilters && (
                        <div style={{padding: '10px 16px', borderBottom: '1px solid var(--border)', background: 'var(--bg-secondary)', display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap', flexShrink: 0}}>
                            <input type="text" className="form-input" placeholder={t.search} value={filterSearch}
                                onChange={e => setFilterSearch(e.target.value)}
                                style={{width: 200, padding: '6px 10px', fontSize: 13}} />
                            <div style={{display: 'flex', gap: 4, flexWrap: 'wrap'}}>
                                {entityTypes.map(type => (
                                    <button key={type} className={`btn btn-small ${filterTypes.includes(type) ? 'btn-primary' : ''}`}
                                        onClick={() => toggleTypeFilter(type)}
                                        style={{fontSize: 11, padding: '3px 8px', display: 'flex', alignItems: 'center', gap: 4}}>
                                        <span style={{width: 8, height: 8, borderRadius: '50%', background: NODE_COLORS[type] || '#636e72', display: 'inline-block'}} />
                                        {type}
                                    </button>
                                ))}
                            </div>
                            <div style={{display: 'flex', alignItems: 'center', gap: 4, fontSize: 12, color: 'var(--text-secondary)'}}>
                                <span>{t.minMentions}:</span>
                                <input type="range" min="1" max="20" value={filterMinMentions}
                                    onChange={e => setFilterMinMentions(parseInt(e.target.value))} style={{width: 80}} />
                                <span style={{minWidth: 16, fontWeight: 600}}>{filterMinMentions}</span>
                            </div>
                            {(filterTypes.length > 0 || filterSearch || filterMinMentions > 1) && (
                                <button className="btn btn-small" onClick={() => { setFilterTypes([]); setFilterSearch(''); setFilterMinMentions(1); }}
                                    style={{color: '#d63031', borderColor: '#d63031'}}>
                                    Clear filters
                                </button>
                            )}
                        </div>
                    )}

                    {/* Main content */}
                    <div style={{flex: 1, display: 'flex', overflow: 'hidden', minHeight: 0}}>
                        {/* Graph canvas */}
                        <div style={{flex: 1, position: 'relative', background: 'var(--bg-primary)'}}>
                            {loading ? (
                                <div style={{display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', color: 'var(--text-secondary)'}}>
                                    <LucideIcon name="loader" size={24} /> <span style={{marginLeft: 8}}>{t.loading}</span>
                                </div>
                            ) : (
                                <div ref={containerRef} style={{width: '100%', height: '100%'}} />
                            )}

                            {/* Legend */}
                            {!loading && (
                                <div style={{position: 'absolute', bottom: 12, left: 12, background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 8, padding: '8px 12px', fontSize: 11, display: 'flex', gap: 8, flexWrap: 'wrap', maxWidth: 450, boxShadow: '0 2px 8px var(--shadow)'}}>
                                    {entityTypes.map(type => (
                                        <span key={type} style={{display: 'flex', alignItems: 'center', gap: 3, cursor: 'pointer', opacity: filterTypes.length && !filterTypes.includes(type) ? 0.4 : 1}}
                                            onClick={() => toggleTypeFilter(type)}>
                                            <span style={{width: 8, height: 8, borderRadius: '50%', background: NODE_COLORS[type] || '#636e72'}} />
                                            {type}
                                        </span>
                                    ))}
                                </div>
                            )}

                            {/* Hint */}
                            {!loading && !selectedNode && (
                                <div style={{position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)', background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 8, padding: '6px 14px', fontSize: 12, color: 'var(--text-muted)', boxShadow: '0 2px 8px var(--shadow)', pointerEvents: 'none'}}>
                                    {language === 'es' ? 'Haz clic en un nodo para ver detalles' : 'Click a node to see details'}
                                </div>
                            )}
                        </div>

                        {/* Detail panel */}
                        {nodeDetail && (
                            <div style={{width: 320, borderLeft: '1px solid var(--border)', overflowY: 'auto', padding: 16, flexShrink: 0, background: 'var(--bg-secondary)'}}>
                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12}}>
                                    <div>
                                        <h3 style={{margin: 0, fontSize: 16, wordBreak: 'break-word'}}>{nodeDetail.node?.name}</h3>
                                        <div style={{display: 'flex', alignItems: 'center', gap: 6, marginTop: 4}}>
                                            <span style={{width: 10, height: 10, borderRadius: '50%', background: NODE_COLORS[nodeDetail.node?.node_type] || '#636e72'}} />
                                            <span style={{fontSize: 12, color: 'var(--text-secondary)', textTransform: 'capitalize'}}>{nodeDetail.node?.node_type}</span>
                                        </div>
                                    </div>
                                    <button className="btn btn-small" onClick={() => { setSelectedNode(null); setNodeDetail(null); }} style={{padding: '4px 6px'}}>
                                        <LucideIcon name="x" size={14} />
                                    </button>
                                </div>

                                <div style={{fontSize: 12, color: 'var(--text-secondary)', marginBottom: 16}}>
                                    <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: 4}}>
                                        <span>{t.mentions}</span>
                                        <span style={{fontWeight: 600}}>{nodeDetail.node?.mention_count}</span>
                                    </div>
                                    <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: 4}}>
                                        <span>{t.firstSeen}</span>
                                        <span>{new Date(nodeDetail.node.first_seen).toLocaleDateString()}</span>
                                    </div>
                                    <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: 4}}>
                                        <span>{t.lastSeen}</span>
                                        <span>{new Date(nodeDetail.node.last_seen).toLocaleDateString()}</span>
                                    </div>
                                </div>

                                {nodeDetail.connections?.length > 0 && (
                                    <div style={{marginBottom: 16}}>
                                        <h4 style={{fontSize: 13, marginBottom: 8}}>{t.connections} ({nodeDetail.connections.length})</h4>
                                        <div style={{display: 'flex', flexDirection: 'column', gap: 4}}>
                                            {nodeDetail.connections.map((conn, i) => (
                                                <div key={i} style={{display: 'flex', alignItems: 'center', gap: 6, padding: '6px 8px', background: 'var(--bg-card)', borderRadius: 6, fontSize: 12, cursor: 'pointer'}}
                                                    onClick={() => focusNode(conn.id)}>
                                                    <span style={{width: 8, height: 8, borderRadius: '50%', background: NODE_COLORS[conn.node_type] || '#636e72'}} />
                                                    <span style={{flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>{conn.name}</span>
                                                    <span style={{color: 'var(--text-muted)', fontSize: 10, flexShrink: 0}}>{conn.relationship}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {nodeDetail.newsletters?.length > 0 && (
                                    <div style={{marginBottom: 16}}>
                                        <h4 style={{fontSize: 13, marginBottom: 8}}>{t.newsletters} ({nodeDetail.newsletters.length})</h4>
                                        <div style={{display: 'flex', flexDirection: 'column', gap: 4}}>
                                            {nodeDetail.newsletters.map((nl, i) => (
                                                <div key={i} style={{padding: '6px 8px', background: 'var(--bg-card)', borderRadius: 6, fontSize: 12}}>
                                                    <div style={{fontWeight: 500}}>{nl.title}</div>
                                                    <div style={{color: 'var(--text-muted)', marginTop: 2, fontSize: 11}}>{nl.excerpt}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div style={{display: 'flex', gap: 6, marginTop: 8}}>
                                    <button className="btn btn-small" style={{flex: 1, color: '#d63031', borderColor: '#d63031', opacity: 0.6}} disabled>
                                        <LucideIcon name="trash-2" size={12} />
                                        <span style={{marginLeft: 4}}>{t.deleteNode}</span>
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* NL Query bar */}
                    <div style={{padding: '10px 16px', borderTop: '1px solid var(--border)', background: 'var(--bg-secondary)', flexShrink: 0}}>
                        <div style={{display: 'flex', gap: 8, alignItems: 'center'}}>
                            <LucideIcon name="sparkles" size={16} style={{color: '#2BBCC0', flexShrink: 0}} />
                            <input type="text" className="form-input" placeholder={t.askPlaceholder} value={nlQuery}
                                onChange={e => setNlQuery(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && handleNlQuery()}
                                style={{flex: 1, padding: '6px 10px', fontSize: 13}} />
                            <button className="btn btn-primary btn-small" onClick={handleNlQuery} disabled={querying || !nlQuery.trim()}>
                                {querying ? '...' : t.ask}
                            </button>
                        </div>
                        {nlResult && (
                            <div style={{marginTop: 8, padding: '10px 12px', background: 'var(--bg-card)', borderRadius: 8, fontSize: 13, lineHeight: 1.5, color: 'var(--text-body)', maxHeight: 120, overflowY: 'auto'}}>
                                {nlResult}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<KnowledgeGraphDemo />, document.getElementById('root'));
    </script>
</body>
</html>
