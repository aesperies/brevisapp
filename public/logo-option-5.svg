<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Option 5: Lines contracting (representing summarizing) -->
  <g>
    <!-- Long lines -->
    <line x1="10" y1="15" x2="40" y2="15" stroke="#000000" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="10" y1="22" x2="38" y2="22" stroke="#000000" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="10" y1="29" x2="40" y2="29" stroke="#000000" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <!-- Arrow -->
    <path d="M 42 22 L 48 22" stroke="#2BBCC0" stroke-width="2" stroke-linecap="round"/>
    <path d="M 46 20 L 48 22 L 46 24" stroke="#2BBCC0" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Short lines (summary) -->
    <line x1="52" y1="18" x2="68" y2="18" stroke="#2BBCC0" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="24" x2="66" y2="24" stroke="#2BBCC0" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="78" y="26" font-family="Instrument Sans, sans-serif" font-size="22" font-weight="700" fill="#000000">BREVIS</text>
</svg>
