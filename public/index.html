        function ReaderView({ newsletter, onClose, translations, onToggleRead, onGenerateSummary, generatingSummary, user, collapsedSummaries, toggleSummaryCollapse, language }) {
            const [scrollProgress, setScrollProgress] = useState(0);
            const overlayRef = useRef(null);

            useEffect(() => {
                const el = overlayRef.current;
                if (!el) return;
                const handleScroll = () => {
                    const { scrollTop, scrollHeight, clientHeight } = el;
                    const progress = scrollHeight <= clientHeight ? 100 : (scrollTop / (scrollHeight - clientHeight)) * 100;
                    setScrollProgress(progress);
                };
                el.addEventListener('scroll', handleScroll);
                return () => el.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                const handleEsc = (e) => { if (e.key === 'Escape') onClose(); };
                document.addEventListener('keydown', handleEsc);
                return () => document.removeEventListener('keydown', handleEsc);
            }, [onClose]);

            const iframeStyles = `
                body { font-family: Georgia, 'Times New Roman', serif; line-height: 1.8; color: ${document.documentElement.getAttribute('data-theme') === 'dark' ? '#C4CCD5' : '#333'}; padding: 0; margin: 0; background: transparent; font-size: 18px; }
                img { max-width: 100%; height: auto; border-radius: 4px; }
                a { color: #2BBCC0; }
                h1, h2, h3, h4 { font-family: 'Inter', sans-serif; }
            `;

            return (
                <div className="reader-overlay" ref={overlayRef}>
                    <div className="reader-progress" style={{width: scrollProgress + '%'}} />
                    <div className="reader-header">
                        <div className="reader-header-title">{cleanTitle(newsletter.title)}</div>
                        <div className="reader-header-actions">
                            {!newsletter.summary && (user.plan === 'pro' || user.plan === 'premium') && (
                                <button className="btn btn-small" onClick={onGenerateSummary} disabled={generatingSummary}>
                                    <LucideIcon name="sparkles" size={14} /> {generatingSummary ? '...' : translations.newsletter.summary}
                                </button>
                            )}
                            <button className="btn btn-small" onClick={onToggleRead}>
                                <LucideIcon name={newsletter.is_read ? 'eye-off' : 'eye'} size={14} />
                                {' '}{newsletter.is_read ? translations.newsletter.markUnread : translations.newsletter.markRead}
                            </button>
                            {newsletter.url && (
                                <a href={newsletter.url} target="_blank" rel="noopener noreferrer" className="btn btn-small">
                                    <LucideIcon name="external-link" size={14} /> {translations.newsletter.original}
                                </a>
                            )}
                            <button className="btn btn-small" onClick={onClose}>
                                <LucideIcon name="x" size={16} />
                            </button>
                        </div>
                    </div>
                    <div className="reader-content">
                        <div className="reader-meta">
                            <h1>{cleanTitle(newsletter.title)}</h1>
                            <div><strong>{newsletter.sender}</strong> — {new Date(newsletter.date_added).toLocaleDateString()}</div>
                        </div>
                        {newsletter.summary && (
                            <div className="reader-summary">
                                <div className="summary-header" onClick={() => toggleSummaryCollapse('reader-' + newsletter.id)}>
                                    <span className="summary-label">{translations.newsletter.summary}</span>
                                    <button className="summary-toggle">
                                        {collapsedSummaries['reader-' + newsletter.id] ? '▼' : '▲'}
                                    </button>
                                </div>
                                <div className={`summary-content ${collapsedSummaries['reader-' + newsletter.id] ? 'collapsed' : ''}`}
                                    style={{fontSize: '15px', lineHeight: 1.6}}>
                                    {formatSummary(newsletter.summary)}
                                </div>
                            </div>
                        )}
                        <div className="reader-body">
                            {newsletter.content ? (
                                newsletter.content.includes('<') ? (
                                    <iframe
                                        className="newsletter-iframe"
                                        srcDoc={`<!DOCTYPE html><html><head><meta charset="utf-8"><base target="_blank"><style>${iframeStyles}</style></head><body>${newsletter.content}</body></html>`}
                                        sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"
                                        title="Newsletter content"
                                        style={{minHeight: '500px'}}
                                        onLoad={(e) => {
                                            const iframe = e.target;
                                            const resizeIframe = () => {
                                                const h = iframe.contentDocument?.body?.scrollHeight;
                                                if (h) iframe.style.height = h + 40 + 'px';
                                            };
                                            resizeIframe();
                                            const imgs = iframe.contentDocument?.querySelectorAll('img');
                                            if (imgs) imgs.forEach(img => img.addEventListener('load', resizeIframe));
                                            if (iframe.contentDocument?.body) {
                                                const ro = new ResizeObserver(resizeIframe);
                                                ro.observe(iframe.contentDocument.body);
                                            }
                                        }}
                                    />
                                ) : (
                                    <div style={{whiteSpace: 'pre-wrap'}}>{newsletter.content}</div>
                                )
                            ) : (
                                <div style={{color: 'var(--text-muted)', textAlign: 'center', padding: '40px'}}>
                                    {language === 'es' ? 'Sin contenido disponible' : 'No content available'}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function TagManager({ tags, onClose, onUpdate, translations, language }) {
            const [newTag, setNewTag] = useState({ name: '', color: '#2C3544' });
            const colors = ['#2C3544', '#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899', '#6B7280'];

            const t = {
                es: { name: 'Nombre', color: 'Color', create: 'Crear Etiqueta', existing: 'Etiquetas existentes', delete: 'Eliminar', confirmDelete: '¿Eliminar etiqueta?' },
                en: { name: 'Name', color: 'Color', create: 'Create Tag', existing: 'Existing tags', delete: 'Delete', confirmDelete: 'Delete tag?' }
            };
            const txt = t[language] || t.es;

            const createTag = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch(`${API_URL}/tags`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(newTag)
                    });
                    if (res.ok) {
                        setNewTag({ name: '', color: '#2C3544' });
                        onUpdate();
                    }
                } catch (e) { console.error('Error:', e); }
            };
            const deleteTag = async (id) => {
                if (!confirm(txt.confirmDelete)) return;
                try {
                    const res = await fetch(`${API_URL}/tags/${id}`, { method: 'DELETE', credentials: 'include' });
                    if (res.ok) onUpdate();
                } catch (e) { console.error('Error:', e); }
            };
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>

                            <h2 className="modal-title">{translations.nav.tags}</h2>

                            <form onSubmit={createTag} style={{marginBottom: '24px'}}>
                                <div className="form-group">
                                    <label className="form-label">{txt.name}</label>
                                    <input type="text" className="form-input" value={newTag.name}
                                        onChange={(e) => setNewTag({...newTag, name: e.target.value})} required />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">{txt.color}</label>
                                    <div style={{display: 'flex', gap: '8px', flexWrap: 'wrap'}}>
                                        {colors.map(color => (
                                            <button key={color} type="button" onClick={() => setNewTag({...newTag, color})}
                                                style={{
                                                    width: '40px', height: '40px', borderRadius: '50%', background: color,
                                                    border: newTag.color === color ? '3px solid #2C3544' : '1px solid #E8ECF0',
                                                    cursor: 'pointer'
                                                }} />
                                        ))}
                                    </div>
                                </div>
                                <button type="submit" className="btn btn-primary btn-full">{txt.create}</button>
                            </form>
                            {tags.length > 0 && (
                                <div>
                                    <h3 style={{marginBottom: '12px', fontSize: '14px', fontWeight: '600'}}>
                                        {txt.existing}
                                    </h3>
                                    <div style={{display: 'flex', flexDirection: 'column', gap: '8px'}}>
                                        {tags.map(tag => (
                                            <div key={tag.id} style={{display: 'flex', alignItems: 'center', gap: '12px', padding: '12px', background: '#F8FAFB', borderRadius: '6px'}}>
                                                <span style={{width: '24px', height: '24px', borderRadius: '50%', background: tag.color}} />
                                                <span style={{flex: 1, fontWeight: '500'}}>{tag.name}</span>
                                                <button className="btn btn-small" onClick={() => deleteTag(tag.id)}>{txt.delete}</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
