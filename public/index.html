<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREVIS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FFF;
            color: #2C3544;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .app-layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 260px;
            background: #F8FAFB;
            border-right: 1px solid #E8ECF0;
            padding: 20px 0;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
        }
        .sidebar-logo {
            padding: 0 20px 20px;
            border-bottom: 1px solid #E8ECF0;
            margin-bottom: 20px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-mark {
            width: 32px;
            height: 32px;
            background: #2C3544;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #FFF;
            letter-spacing: -0.5px;
        }
        .logo-text { font-size: 20px; font-weight: 600; color: #2C3544; letter-spacing: 0.08em; }
        .sidebar-section { margin-bottom: 24px; }
        .sidebar-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #7A8599;
            margin-bottom: 8px;
            padding: 0 20px;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            color: #4A5568;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            border-left: 3px solid transparent;
            font-family: inherit;
            transition: all 0.2s;
        }
        .sidebar-item:hover { background: #F0F4F7; }
        .sidebar-item.active {
            background: rgba(43, 188, 192, 0.08);
            color: #2C3544;
            border-left-color: #2BBCC0;
            font-weight: 500;
        }
        .sidebar-item-icon { font-size: 16px; width: 20px; text-align: center; }
        .sidebar-item-label { flex: 1; }
        .sidebar-item-count {
            font-size: 12px;
            color: #7A8599;
            background: #E8ECF0;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }
        .sidebar-item.active .sidebar-item-count { background: #2C3544; color: #FFF; }
        .sidebar-tag-item { padding-left: 52px; }
        .sidebar-report-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 13px;
            color: #4A5568;
        }
        .sidebar-report-item:hover { background: #F0F4F7; }
        .main-content {
            flex: 1;
            margin-left: 260px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .header {
            padding: 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #E8ECF0;
            margin-bottom: 24px;
        }
        .tagline { font-size: 14px; color: #7A8599; }
        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }
        .plan-badge {
            padding: 4px 12px;
            background: #2C3544;
            color: #FFF;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .plan-badge.pro { background: #2BBCC0; }
        .user-name-button {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid #E8ECF0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            color: #2C3544;
        }
        .user-name-button:hover { background: #F0F4F7; }
        .user-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: #FFF;
            border: 1px solid #E8ECF0;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(44,53,68,0.1);
            min-width: 220px;
            z-index: 1000;
        }
        .user-dropdown-info {
            padding: 12px 16px;
            border-bottom: 1px solid #E8ECF0;
            font-size: 13px;
        }
        .user-dropdown-email { font-size: 12px; color: #7A8599; margin-top: 2px; }
        .user-dropdown-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #F0F4F7;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .user-dropdown-item:last-child { border-bottom: none; border-top: 1px solid #E8ECF0; }
        .user-dropdown-item:hover { background: #F0F4F7; }
        .lang-toggle {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid #E8ECF0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            color: #2C3544;
        }
        .btn {
            padding: 10px 20px;
            border: 1px solid #E8ECF0;
            border-radius: 6px;
            background: #FFF;
            color: #2C3544;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: #F0F4F7; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #2C3544; color: #FFF; border-color: #2C3544; }
        .btn-primary:hover { background: #3D4D5C; }
        .btn-small { padding: 8px 16px; font-size: 13px; }
        .btn-full { width: 100%; }
        .email-display {
            background: #F8FAFB;
            border: 1px solid #E8ECF0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .email-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #7A8599;
            margin-bottom: 6px;
        }
        .email-code { font-size: 16px; font-weight: 600; font-family: 'Monaco', monospace; color: #2C3544; }
        .nav {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }
        .search-box { flex: 1; }
        .search-input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #E8ECF0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        .search-input:focus { outline: none; border-color: #2BBCC0; }
        .selection-bar {
            background: #F8FAFB;
            border: 1px solid #E8ECF0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .selection-info { font-weight: 500; }
        .selection-actions { display: flex; gap: 8px; }
        .newsletter-card {
            background: #FFF;
            border: 1px solid #E8ECF0;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 12px;
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }
        .newsletter-card:hover { box-shadow: 0 2px 8px rgba(44,53,68,0.08); }
        .newsletter-card.read .newsletter-title { color: #A0AEC0; }
        .newsletter-card-content { flex: 1; min-width: 0; }
        .newsletter-card-actions {
            display: flex;
            flex-direction: row;
            gap: 6px;
            flex-shrink: 0;
            align-items: flex-start;
        }
        .newsletter-card.selecting { padding-left: 60px; }
        .newsletter-checkbox {
            position: absolute;
            left: 20px;
            top: 24px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .newsletter-title { font-size: 16px; font-weight: 600; margin-bottom: 2px; cursor: pointer; color: #2C3544; }
        .newsletter-title:hover { color: #2BBCC0; text-decoration: none; }
        .newsletter-meta { font-size: 12px; color: #7A8599; }
        .newsletter-tag {
            padding: 2px 8px;
            border: 1px solid;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 500;
        }
        .newsletter-content {
            color: #7A8599;
            font-size: 13px;
            margin-top: 6px;
            line-height: 1.5;
            max-height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .summary-box {
            background: #F8FAFB;
            border-left: 3px solid #2BBCC0;
            padding: 12px 16px;
            margin: 12px 0;
            border-radius: 4px;
        }
        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .summary-label {
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #7A8599;
        }
        .summary-toggle {
            background: none;
            border: none;
            font-size: 12px;
            color: #7A8599;
            cursor: pointer;
            padding: 0;
        }
        .summary-content {
            font-size: 13px;
            line-height: 1.5;
            margin-top: 8px;
        }
        .summary-content.collapsed {
            display: none;
        }
        .badge {
            padding: 2px 6px;
            background: #2BBCC0;
            color: #FFF;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .tag-dropdown {
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 4px;
            background: #FFF;
            border: 1px solid #E8ECF0;
            border-radius: 8px;
            padding: 6px 0;
            min-width: 180px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(44,53,68,0.12);
        }
        .tag-dropdown::-webkit-scrollbar {
            width: 6px;
        }
        .tag-dropdown::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        .tag-dropdown::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }
        .tag-dropdown::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
        .tag-dropdown-item {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            transition: background 0.15s;
        }
        .tag-dropdown-item:hover { background: #F0F4F7; }
        .tag-color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .tag-dropdown-empty {
            padding: 12px 14px;
            font-size: 12px;
            color: #7A8599;
            text-align: center;
        }
        .actions-dropdown {
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 4px;
            background: #FFF;
            border: 1px solid #E8ECF0;
            border-radius: 8px;
            padding: 6px 0;
            min-width: 180px;
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(44,53,68,0.12);
        }
        .actions-dropdown-item {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            transition: background 0.15s;
        }
        .actions-dropdown-item:hover { background: #F0F4F7; }
        .actions-dropdown-item.danger:hover { background: #FEE; color: #C00; }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(44,53,68,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal {
            background: #FFF;
            border-radius: 8px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 24px;
            border-bottom: 1px solid #E8ECF0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-title { font-size: 20px; font-weight: 600; }
        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #7A8599;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .close-btn:hover { background: #F0F4F7; }
        .modal-body { padding: 24px; overflow-y: auto; flex: 1; }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid #E8ECF0;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .modal-meta { font-size: 14px; color: #7A8599; margin-bottom: 16px; }
        .modal-content { line-height: 1.8; white-space: pre-wrap; }
        .newsletter-iframe {
            width: 100%;
            min-height: 400px;
            border: none;
            background: #fff;
        }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #E8ECF0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-input:focus, .form-textarea:focus { outline: none; border-color: #2BBCC0; }
        .form-textarea { resize: vertical; min-height: 100px; }
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .empty-text { color: #7A8599; font-size: 14px; }
        .footer { text-align: center; padding: 40px 20px; color: #A0AEC0; font-size: 13px; }
        .upgrade-banner {
            background: linear-gradient(135deg, #2C3544 0%, #3D5A6E 100%);
            color: #FFF;
            padding: 20px 24px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .upgrade-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
        .upgrade-subtitle { font-size: 13px; opacity: 0.9; }
        .btn-upgrade { background: #2BBCC0; color: #FFF; border: none; font-weight: 600; }
        .plan-indicator {
            background: #F8FAFB;
            border: 1px solid #E8ECF0;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .plan-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .plan-progress { height: 6px; background: #E8ECF0; border-radius: 3px; overflow: hidden; }
        .plan-progress-bar { height: 100%; background: #4CAF50; transition: width 0.3s; }
        .plan-progress-bar.warning { background: #FF9800; }
        .plan-progress-bar.danger { background: #F44336; }
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-box {
            max-width: 400px;
            width: 100%;
            padding: 48px 32px;
            border: 1px solid #E8ECF0;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(44,53,68,0.08);
        }
        /* Landing Page */
        .landing { background: #FFF; color: #2C3544; }
        .landing-hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 24px;
        }
        .landing-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 32px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            z-index: 100;
        }
        .landing-nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .landing-nav-mark {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .landing-hero-logo {
            margin-bottom: 32px;
        }
        .landing-nav-text {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #2C3544;
        }
        .landing-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(43,188,192,0.1);
            color: #2BBCC0;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 24px;
        }
        .landing-headline {
            font-size: 56px;
            font-weight: 800;
            line-height: 1.1;
            color: #2C3544;
            margin-bottom: 20px;
            max-width: 700px;
            letter-spacing: -0.02em;
        }
        .landing-headline span {
            color: #2BBCC0;
        }
        .landing-subtitle {
            font-size: 18px;
            color: #7A8599;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 500px;
        }
        .landing-form {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            max-width: 380px;
            width: 100%;
        }
        .landing-input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #E8ECF0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            text-align: center;
            transition: border-color 0.2s;
        }
        .landing-input:focus {
            outline: none;
            border-color: #2BBCC0;
        }
        .landing-btn {
            padding: 14px 28px;
            background: #2C3544;
            color: #FFF;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        .landing-btn:hover {
            background: #3D4D5C;
        }
        .landing-error {
            color: #EF4444;
            font-size: 13px;
            height: 20px;
        }
        .landing-hint {
            font-size: 13px;
            color: #A0AEC0;
            margin-top: 8px;
        }
        /* Mockup */
        .landing-mockup {
            margin-top: 48px;
            max-width: 560px;
            width: 100%;
            background: #F8FAFB;
            border: 1px solid #E8ECF0;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 40px rgba(44,53,68,0.08);
        }
        .mockup-card {
            background: #FFF;
            border: 1px solid #E8ECF0;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 10px;
            text-align: left;
        }
        .mockup-card:last-child { margin-bottom: 0; }
        .mockup-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .mockup-card-title {
            font-size: 14px;
            font-weight: 600;
            color: #2C3544;
        }
        .mockup-card-badge {
            padding: 1px 6px;
            background: #2BBCC0;
            color: #FFF;
            border-radius: 3px;
            font-size: 8px;
            font-weight: 600;
        }
        .mockup-card-meta {
            font-size: 11px;
            color: #A0AEC0;
            margin-bottom: 8px;
        }
        .mockup-card-summary {
            background: #F8FAFB;
            border-left: 2px solid #2BBCC0;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 11px;
            color: #7A8599;
            line-height: 1.5;
        }
        /* Features */
        .landing-features {
            background: #F8FAFB;
            padding: 80px 24px;
        }
        .landing-features-inner {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
        }
        .landing-feature {
            text-align: center;
            padding: 32px 24px;
        }
        .landing-feature-icon {
            width: 52px;
            height: 52px;
            background: rgba(43,188,192,0.1);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: #2BBCC0;
        }
        .landing-feature-title {
            font-size: 18px;
            font-weight: 700;
            color: #2C3544;
            margin-bottom: 10px;
        }
        .landing-feature-desc {
            font-size: 14px;
            color: #7A8599;
            line-height: 1.6;
        }
        /* Footer */
        .landing-footer {
            text-align: center;
            padding: 40px 24px;
            color: #A0AEC0;
            font-size: 13px;
        }
        @media (max-width: 768px) {
            .landing-headline { font-size: 36px; }
            .landing-subtitle { font-size: 16px; }

        function cleanTitle(title) {
            if (!title) return '';
            return title
                .replace(/^(fwd?|re|rv|fw|aw|wg|tr|r|enc|env):\s*/gi, '')
                .replace(/^\[.*?\]\s*/, '')
                .trim();
        }

        // Strip HTML tags for plain text preview
        function stripHtml(html) {
            if (!html) return '';
            return html
                .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '')
                .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
                .replace(/<[^>]+>/g, ' ')
                .replace(/&nbsp;/g, ' ')
                .replace(/&amp;/g, '&')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/&quot;/g, '"')
                .replace(/\s+/g, ' ')
                .trim()
                .substring(0, 300);
        }

        function App() {
            const [hasAccess, setHasAccess] = useState(localStorage.getItem('brevis_access') === 'true');
            const [language, setLanguage] = useState('es');
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => { if (hasAccess) checkAuth(); else setLoading(false); }, [hasAccess]);

            const checkAuth = async () => {
                try {
                    const res = await fetch(`${API_URL}/auth/me`, { credentials: 'include' });
                    if (res.ok) setUser((await res.json()).user);
                } catch (e) {
                    console.error('Auth error:', e);
                } finally {
                    setLoading(false);
                }
            };

            if (!hasAccess) return <LandingPage onAccess={() => setHasAccess(true)} />;
            if (loading) return <div className="auth-container">Cargando...</div>;
            if (!user) return <Auth onLogin={checkAuth} language={language} setLanguage={setLanguage} />;
            return <Dashboard user={user} setUser={setUser} language={language} setLanguage={setLanguage} />;
        }

        function Dashboard({ user, setUser, language, setLanguage }) {

            const [generatingSummary, setGeneratingSummary] = useState({});

            const [showTagMenuFor, setShowTagMenuFor] = useState(null);

                    },

                    }

            };
            const translations = t[language];

            useEffect(() => {
                fetchNewsletters();
                fetchTags();
                loadSavedReports();
            }, []);

            // Close tag dropdown when clicking outside
            useEffect(() => {
                if (!showTagMenuFor) return;

                const handleClickOutside = (e) => {
                    // Check if click is outside the tag dropdown and its button
                    const tagDropdown = e.target.closest('.tag-dropdown');
                    const tagButton = e.target.closest('button');
                    const isTagButton = tagButton && tagButton.textContent.includes('Etiquetas') || tagButton && tagButton.textContent.includes('Tags');

                    if (!tagDropdown && !isTagButton) {
                        setShowTagMenuFor(null);
                    }
                };

                document.addEventListener('click', handleClickOutside);
                return () => document.removeEventListener('click', handleClickOutside);
            }, [showTagMenuFor]);

            // Close actions dropdown when clicking outside
            useEffect(() => {
                if (!showActionsMenuFor) return;

                const handleClickOutside = (e) => {
                    const actionsDropdown = e.target.closest('.actions-dropdown');
                    const actionsButton = e.target.closest('button');
                    const isActionsButton = actionsButton && actionsButton.textContent.includes('⋯');

                    if (!actionsDropdown && !isActionsButton) {
                        setShowActionsMenuFor(null);
                    }
                };

                document.addEventListener('click', handleClickOutside);
                return () => document.removeEventListener('click', handleClickOutside);
            }, [showActionsMenuFor]);

            const fetchNewsletters = async () => {
                try {
                    const res = await fetch(`${API_URL}/newsletters`, { credentials: 'include' });
                    if (res.ok) setNewsletters(await res.json());
                } catch (e) { console.error('Error:', e); }
            };

            const fetchTags = async () => {
                try {
                    const res = await fetch(`${API_URL}/tags`, { credentials: 'include' });
                    if (res.ok) setTags(await res.json());
                } catch (e) { console.error('Error:', e); }

            const loadSavedReports = () => {
                try {

                } catch (e) { console.error('Error:', e); }
            };

            const saveReport = (report) => {
                const newReport = {
                    id: Date.now(),
                    name: `${report.type === 'brief' ? 'Brief' : 'Reporte'} - ${new Date().toLocaleDateString()}`,
                    type: report.type,
                    content: report.content,
                    date: new Date().toISOString()
                };
                const updated = [...savedReports, newReport];
                setSavedReports(updated);
                localStorage.setItem('brevis_saved_reports', JSON.stringify(updated));
            };

            const deleteReport = (id) => {
                const updated = savedReports.filter(r => r.id !== id);
                setSavedReports(updated);
                localStorage.setItem('brevis_saved_reports', JSON.stringify(updated));
            };

            const renameReport = (id, newName) => {
                const updated = savedReports.map(r => r.id === id ? {...r, name: newName} : r);
                setSavedReports(updated);
                localStorage.setItem('brevis_saved_reports', JSON.stringify(updated));

                try {

                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(formData)

                    const res = await fetch(`${API_URL}/newsletters/${id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ is_read: newsletter.is_read ? 0 : 1 })

                        setNewsletters(newsletters.map(n => n.id === id ? { ...n, is_read: !n.is_read } : n));

                    alert('Error sending to Kindle');

                        method: 'POST',
                        credentials: 'include'
