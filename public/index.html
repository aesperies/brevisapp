<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREVIS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #FFF;
            --bg-secondary: #F8FAFB;
            --bg-card: #FFF;
            --bg-hover: #F0F4F7;
            --text-primary: #2C3544;
            --text-secondary: #7A8599;
            --text-muted: #A0AEC0;
            --text-body: #4A5568;
            --border: #E8ECF0;
            --border-light: #F0F4F7;
            --accent: #2BBCC0;
            --accent-bg: rgba(43,188,192,0.08);
            --accent-bg-light: rgba(43,188,192,0.1);
            --btn-dark: #2C3544;
            --btn-dark-hover: #3D4D5C;
            --shadow: rgba(44,53,68,0.08);
            --shadow-md: rgba(44,53,68,0.1);
            --shadow-lg: rgba(44,53,68,0.12);
            --overlay: rgba(44,53,68,0.5);
            --skeleton-from: #F0F4F7;
            --skeleton-mid: #E8ECF0;
        }
        [data-theme="dark"] {
            --bg-primary: #0F1419;
            --bg-secondary: #1A1F2E;
            --bg-card: #1E2433;
            --bg-hover: #2A3040;
            --text-primary: #E7E9EA;
            --text-secondary: #8B98A5;
            --text-muted: #6B7685;
            --text-body: #C4CCD5;
            --border: #2F3640;
            --border-light: #252D38;
            --accent: #2BBCC0;
            --accent-bg: rgba(43,188,192,0.12);
            --accent-bg-light: rgba(43,188,192,0.15);
            --btn-dark: #E7E9EA;
            --btn-dark-hover: #D1D5DB;
            --shadow: rgba(0,0,0,0.2);
            --shadow-md: rgba(0,0,0,0.3);
            --shadow-lg: rgba(0,0,0,0.4);
            --overlay: rgba(0,0,0,0.6);
            --skeleton-from: #252D38;
            --skeleton-mid: #2F3640;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s, color 0.3s;
        }
        .app-layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 20px 0;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
        }
        .sidebar-logo {
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-mark {
            width: 32px;
            height: 32px;
            background: var(--text-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: var(--bg-primary);
            letter-spacing: -0.5px;
        }
        .logo-text { font-size: 20px; font-weight: 600; color: var(--text-primary); letter-spacing: 0.08em; }
        .sidebar-section { margin-bottom: 24px; }
        .sidebar-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding: 0 20px;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-body);
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            border-left: 3px solid transparent;
            font-family: inherit;
            transition: all 0.2s;
        }
        .sidebar-item:hover { background: var(--bg-hover); }
        .sidebar-item.active {
            background: var(--accent-bg);
            color: var(--text-primary);
            border-left-color: var(--accent);
            font-weight: 500;
        }
        .sidebar-item-icon { font-size: 16px; width: 20px; text-align: center; }
        .sidebar-item-label { flex: 1; }
        .sidebar-item-count {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--border);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }
        .sidebar-item.active .sidebar-item-count { background: var(--text-primary); color: var(--bg-primary); }
        .sidebar-tag-item { padding-left: 52px; }
        .sidebar-report-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-body);
        }
        .sidebar-report-item:hover { background: var(--bg-hover); }
        .main-content {
            flex: 1;
            margin-left: 260px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .header {
            padding: 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .tagline { font-size: 16px; color: var(--text-secondary); }
        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }
        .plan-badge {
            padding: 4px 12px;
            background: var(--text-primary);
            color: var(--bg-primary);
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .plan-badge.pro { background: var(--accent); }
        .user-name-button {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            color: var(--text-primary);
        }
        .user-name-button:hover { background: var(--bg-hover); }
        .user-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--shadow-md);
            min-width: 220px;
            z-index: 1000;
        }
        .user-dropdown-info {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        .user-dropdown-email { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .user-dropdown-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .user-dropdown-item:last-child { border-bottom: none; border-top: 1px solid var(--border); }
        .user-dropdown-item:hover { background: var(--bg-hover); }
        .lang-toggle {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            color: var(--text-primary);
        }
        .btn {
            padding: 10px 20px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: var(--bg-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--btn-dark); color: var(--bg-primary); border-color: var(--btn-dark); }
        .btn-primary:hover { background: var(--btn-dark-hover); }
        .btn-small { padding: 8px 16px; font-size: 13px; }
        .btn-full { width: 100%; }
        .email-display {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        .email-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .email-code { font-size: 16px; font-weight: 600; font-family: 'Monaco', monospace; color: var(--text-primary); }
        .nav {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }
        .search-box { flex: 1; }
        .search-input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .search-input:focus { outline: none; border-color: var(--accent); }
        .selection-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .selection-info { font-weight: 500; }
        .selection-actions { display: flex; gap: 8px; }
        .newsletter-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 12px;
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }
        .newsletter-card:hover { box-shadow: 0 2px 8px var(--shadow); }
        .newsletter-card.read .newsletter-title { color: var(--text-muted); }
        .newsletter-card-content { flex: 1; min-width: 0; }
        .newsletter-card-actions {
            display: flex;
            flex-direction: row;
            gap: 6px;
            flex-shrink: 0;
            align-items: flex-start;
        }
        .newsletter-card.selecting { padding-left: 60px; }
        .newsletter-checkbox {
            position: absolute;
            left: 20px;
            top: 24px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .newsletter-title { font-size: 16px; font-weight: 600; margin-bottom: 2px; cursor: pointer; color: var(--text-primary); }
        .newsletter-title:hover { color: var(--accent); text-decoration: none; }
        .newsletter-meta { font-size: 12px; color: var(--text-secondary); }
        .newsletter-tag {
            padding: 2px 8px;
            border: 1px solid;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 500;
        }
        .newsletter-content {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 6px;
            line-height: 1.5;
            max-height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .summary-box {
            background: var(--bg-secondary);
            border-left: 3px solid var(--accent);
            padding: 12px 16px;
            margin: 12px 0;
            border-radius: 4px;
        }
        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .summary-label {
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }
        .summary-toggle {
            background: none;
            border: none;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0;
        }
        .summary-content {
            font-size: 13px;
            line-height: 1.6;
            margin-top: 8px;
        }
        .summary-content ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .summary-content li {
            position: relative;
            padding-left: 16px;
        }
        .summary-content li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: 700;
        }
        .summary-content.collapsed {
            display: none;
        }
        .badge {
            padding: 2px 6px;
            background: var(--accent);
            color: #FFF;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .tag-dropdown {
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 0;
            min-width: 180px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 -4px 20px var(--shadow-lg);
        }
        .tag-dropdown::-webkit-scrollbar {
            width: 6px;
        }
        .tag-dropdown::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        .tag-dropdown::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }
        .tag-dropdown::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
        .tag-dropdown-item {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            transition: background 0.15s;
        }
        .tag-dropdown-item:hover { background: var(--bg-hover); }
        .tag-color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .tag-dropdown-empty {
            padding: 12px 14px;
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
        }
        .actions-dropdown {
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 0;
            min-width: 180px;
            z-index: 1000;
            box-shadow: 0 -4px 20px var(--shadow-lg);
        }
        .actions-dropdown-item {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            transition: background 0.15s;
        }
        .actions-dropdown-item:hover { background: var(--bg-hover); }
        .actions-dropdown-item.danger:hover { background: #FEE; color: #C00; }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal {
            background: var(--bg-card);
            border-radius: 8px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-title { font-size: 20px; font-weight: 600; }
        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .close-btn:hover { background: var(--bg-hover); }
        .modal-body { padding: 24px; overflow-y: auto; flex: 1; }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .modal-meta { font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; }
        .modal-content { line-height: 1.8; white-space: pre-wrap; }
        .newsletter-iframe {
            width: 100%;
            min-height: 400px;
            border: none;
            background: #fff;
        }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
        .form-textarea { resize: vertical; min-height: 100px; }
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .empty-text { color: var(--text-secondary); font-size: 14px; }
        .footer { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }
        .upgrade-banner {
            background: linear-gradient(135deg, #2C3544 0%, #3D5A6E 100%);
            color: #FFF;
            padding: 20px 24px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .upgrade-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
        .upgrade-subtitle { font-size: 13px; opacity: 0.9; }
        .btn-upgrade { background: var(--accent); color: #FFF; border: none; font-weight: 600; }
        .plan-indicator {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .plan-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .plan-progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .plan-progress-bar { height: 100%; background: #4CAF50; transition: width 0.3s; }
        .plan-progress-bar.warning { background: #FF9800; }
        .plan-progress-bar.danger { background: #F44336; }
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-box {
            max-width: 400px;
            width: 100%;
            padding: 48px 32px;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 24px var(--shadow);
            background: var(--bg-card);
        }
        /* Landing Page */
        .landing { background: var(--bg-primary); color: var(--text-primary); }
        .landing-hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 24px;
        }
        .landing-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 32px;
            background: var(--bg-primary);
            backdrop-filter: blur(12px);
            z-index: 100;
        }
        .landing-nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .landing-nav-mark {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .landing-hero-logo {
            margin-bottom: 32px;
        }
        .landing-nav-text {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--text-primary);
        }
        .landing-badge {
            display: inline-block;
            padding: 6px 16px;
            background: var(--accent-bg-light);
            color: var(--accent);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 24px;
        }
        .landing-headline {
            font-size: 56px;
            font-weight: 800;
            line-height: 1.1;
            color: var(--text-primary);
            margin-bottom: 20px;
            max-width: 700px;
            letter-spacing: -0.02em;
        }
        .landing-headline span {
            color: var(--accent);
        }
        .landing-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 500px;
        }
        .landing-form {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            max-width: 380px;
            width: 100%;
        }
        .landing-input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            text-align: center;
            transition: border-color 0.2s;
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .landing-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .landing-btn {
            padding: 14px 28px;
            background: var(--btn-dark);
            color: var(--bg-primary);
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        .landing-btn:hover {
            background: var(--btn-dark-hover);
        }
        .landing-error {
            color: #EF4444;
            font-size: 13px;
            height: 20px;
        }
        .landing-hint {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
        }
        .landing-divider {
            display: flex;
            align-items: center;

<body>
    <div id="root"></div>
    <script>
        // Theme initialization (runs before React to prevent flash)
        (function() {
            var saved = localStorage.getItem('brevis_theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
        const API_URL = window.location.origin + '/api';

        // Global toast state
        let _toastSetter = null;
        function showToast(message, type = 'success') {
            if (_toastSetter) _toastSetter(prev => [...prev, { id: Date.now(), message, type }]);
        }
        function ToastContainer() {
            const [toasts, setToasts] = useState([]);
            _toastSetter = setToasts;
            useEffect(() => {
                if (toasts.length === 0) return;
                const timer = setTimeout(() => setToasts(t => t.slice(1)), 3000);
                return () => clearTimeout(timer);
            }, [toasts]);
            if (toasts.length === 0) return null;
            return React.createElement('div', { className: 'toast-container' },
                toasts.map(t => React.createElement('div', { key: t.id, className: `toast toast-${t.type}` }, t.message))
            );
        }

        // Clean email subject prefixes (FWD, RE, etc.)
        function cleanTitle(title) {
            if (!title) return '';
            return title
                .replace(/^(fwd?|re|rv|fw|aw|wg|tr|r|enc|env):\s*/gi, '')
                .replace(/^\[.*?\]\s*/, '')
                .trim();
        }

        // Strip HTML tags for plain text preview
        function formatSummary(text) {
            if (!text) return null;
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            const bullets = lines.filter(l => /^[-•–—*]\s/.test(l) || /^\d+[.)]\s/.test(l));
            if (bullets.length >= 2) {
                return React.createElement('ul', null,
                    bullets.map((b, i) => React.createElement('li', { key: i },
                        b.replace(/^[-•–—*]\s+/, '').replace(/^\d+[.)]\s+/, '')
                    ))
                );
            }
            return text;
        }

        function stripHtml(html) {
            if (!html) return '';
            return html
                .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '')
                .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
                .replace(/<[^>]+>/g, ' ')
                .replace(/&nbsp;/g, ' ')
                .replace(/&amp;/g, '&')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/&quot;/g, '"')
                .replace(/\s+/g, ' ')
                .trim()
                .substring(0, 300);
        }

        function LucideIcon({ name, size = 16, color, strokeWidth = 2, style = {} }) {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current && window.lucide) {
                    ref.current.innerHTML = '';
                    const el = document.createElement('i');
                    el.setAttribute('data-lucide', name);
                    el.style.width = size + 'px';
                    el.style.height = size + 'px';
                    ref.current.appendChild(el);
                    lucide.createIcons({ nodes: [el], attrs: { width: size, height: size, 'stroke-width': strokeWidth } });
                    if (color) {
                        const svg = ref.current.querySelector('svg');
                        if (svg) svg.style.stroke = color;
                    }
                }
            }, [name, size, color, strokeWidth]);
            return React.createElement('span', {
                ref,
                style: { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: size, height: size, ...style }
            });
        }

        function useTheme() {
            const [theme, setThemeState] = useState(() => {
                return document.documentElement.getAttribute('data-theme') || 'light';
            });
            const setTheme = useCallback((newTheme) => {
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('brevis_theme', newTheme);
                setThemeState(newTheme);
            }, []);
            const toggleTheme = useCallback(() => {
                setTheme(theme === 'dark' ? 'light' : 'dark');
            }, [theme, setTheme]);
            useEffect(() => {
                const mq = window.matchMedia('(prefers-color-scheme: dark)');
                const handler = (e) => {
                    if (!localStorage.getItem('brevis_theme')) {
                        const t = e.matches ? 'dark' : 'light';
                        document.documentElement.setAttribute('data-theme', t);
                        setThemeState(t);
                    }
                };
                mq.addEventListener('change', handler);
                return () => mq.removeEventListener('change', handler);
            }, []);
            return { theme, toggleTheme };
        }

        function ThemeToggle({ theme, toggleTheme, style = {} }) {
            return (
                <button onClick={toggleTheme} style={{
                    background: 'transparent', border: '1px solid var(--border)', borderRadius: '6px',
                    cursor: 'pointer', padding: '6px 8px', display: 'flex', alignItems: 'center',
                    justifyContent: 'center', color: 'var(--text-secondary)', ...style
                }} title={theme === 'dark' ? 'Light mode' : 'Dark mode'}>
                    <LucideIcon name={theme === 'dark' ? 'sun' : 'moon'} size={16} />
                </button>
            );
        }

        function LandingPage({ onAccess }) {
            const [code, setCode] = useState('');
            const [error, setError] = useState('');
            const [waitlistEmail, setWaitlistEmail] = useState('');
            const [waitlistStatus, setWaitlistStatus] = useState('idle');
            const [waitlistError, setWaitlistError] = useState('');
            const [landingBilling, setLandingBilling] = useState('month');
            const { theme, toggleTheme } = useTheme();

            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        }
                    });
                }, { threshold: 0.1 });
                document.querySelectorAll('.landing-section-animate').forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, []);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (code.trim() === 'trybrevis14') {
                    localStorage.setItem('brevis_access', 'true');
                    onAccess();
                } else {
                    setError('Incorrect code');
                }
            };

            const handleWaitlist = async (e) => {
                e.preventDefault();
                setWaitlistStatus('submitting');
                setWaitlistError('');
                try {
                    const res = await fetch('/api/waitlist', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: waitlistEmail })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setWaitlistStatus('success');
                    } else {
                        setWaitlistError(data.error || 'Something went wrong');
                        setWaitlistStatus('idle');
                    }
                } catch {
                    setWaitlistError('Something went wrong. Please try again.');
                    setWaitlistStatus('idle');
                }
            };

            return (
                <div className="landing">
                    <div className="landing-nav">
                        <div className="landing-nav-logo">
                            <img src="/logo-new.png" alt="brevis" style={{height: '44px'}} />
                        </div>
                        <div style={{display: 'flex', alignItems: 'center', gap: '12px'}}>
                            <a href="#how-it-works" style={{fontSize: '14px', fontWeight: 600, color: 'var(--text-primary)', textDecoration: 'none'}}>
                                How it works
                            </a>
                            <a href="#pricing" style={{fontSize: '14px', fontWeight: 600, color: 'var(--text-primary)', textDecoration: 'none'}}>
                                Pricing
                            </a>
                            <ThemeToggle theme={theme} toggleTheme={toggleTheme} />
                        </div>
                    </div>

                    {/* Hero */}
                    <div className="landing-hero">
                        <div className="landing-hero-content">
                            <div className="landing-hero-logo">
                                <img src="/logo-new.png" alt="brevis" style={{height: '80px'}} />
                            </div>
                            <div className="landing-badge">Early Access</div>
                            <h1 className="landing-headline">
                                Your newsletters,<br/><span>distilled.</span>
                            </h1>
                            <p className="landing-subtitle">
                                Forward your newsletters to BREVIS. Get AI-powered summaries, organize with tags, and generate briefs — all in one place.
                            </p>
                            <form onSubmit={handleSubmit} className="landing-form">
                                <input type="text" className="landing-input" placeholder="Enter access code"
                                    value={code} onChange={(e) => { setCode(e.target.value); setError(''); }} />
                                <button type="submit" className="landing-btn" style={{boxShadow: '0 4px 14px rgba(43,188,192,0.3)'}}>Access</button>
                            </form>
                            <div className="landing-error">{error || '\u00A0'}</div>
                            <div className="landing-hint">Request your code to get early access</div>

                            <div className="landing-divider">or</div>

                            {waitlistStatus === 'success' ? (
                                <div className="landing-success">You're on the list! We'll be in touch.</div>

        function BookmarkletSave() {
            const [status, setStatus] = useState('saving');
            const [message, setMessage] = useState('');

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const dataStr = params.get('data');
                if (!dataStr) { setStatus('error'); setMessage('No data received.'); return; }
                try {
                    const payload = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(dataStr)))));
                    fetch(`${API_URL}/newsletters`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({
                            title: payload.title || 'Saved from web',
                            source: payload.source || 'Web',
                            content: payload.content || '',
                            url: payload.url || ''
                        })
                    }).then(res => {
                        if (res.ok) {
                            setStatus('success');
                            setMessage('Saved!');
                            setTimeout(() => window.close(), 2000);
                        } else {
                            res.json().then(d => { setStatus('error'); setMessage(d.error || 'Failed to save.'); });
                        }
                    }).catch(() => { setStatus('error'); setMessage('Connection error. Are you logged in?'); });
                } catch (e) { setStatus('error'); setMessage('Invalid data.'); }
            }, []);

            return (
                <div style={{display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', fontFamily: 'Inter, sans-serif'}}>
                    <div style={{textAlign: 'center', padding: '40px'}}>
                        <div style={{fontSize: '40px', marginBottom: '16px'}}>
                            {status === 'saving' ? '...' : status === 'success' ? '✓' : '✗'}
                        </div>
                        <div style={{fontSize: '16px', fontWeight: 600, color: '#2C3544', marginBottom: '8px'}}>
                            {status === 'saving' ? 'Saving to BREVIS...' : message}
                        </div>
                        {status === 'success' && (
                            <div style={{fontSize: '13px', color: '#7A8599'}}>This window will close automatically.</div>
                        )}
                        {status === 'error' && (
                            <button onClick={() => window.close()}
                                style={{marginTop: '12px', padding: '8px 20px', border: '1px solid #E8ECF0', borderRadius: '6px', background: '#FFF', cursor: 'pointer', fontFamily: 'inherit'}}>
                                Close
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            const [hasAccess, setHasAccess] = useState(localStorage.getItem('brevis_access') === 'true');
            const [language, setLanguage] = useState('es');
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => { if (hasAccess) checkAuth(); else setLoading(false); }, [hasAccess]);

            const checkAuth = async () => {
                try {
                    const res = await fetch(`${API_URL}/auth/me`, { credentials: 'include' });
                    if (res.ok) setUser((await res.json()).user);
                } catch (e) {
                    console.error('Auth error:', e);
                } finally {
                    setLoading(false);
                }
            };

            if (window.location.pathname === '/bookmarklet-save') return <><ToastContainer /><BookmarkletSave /></>;
            if (window.location.pathname === '/reset-password') return <><ToastContainer /><ResetPassword /></>;
            if (!hasAccess) return <><ToastContainer /><LandingPage onAccess={() => setHasAccess(true)} /></>;
            if (loading) return <><ToastContainer /><div className="auth-container" style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh'}}>
                <div className="skeleton-line long" style={{width:'120px',height:'20px'}}></div>
            </div></>;
            if (!user) return <><ToastContainer /><Auth onLogin={checkAuth} language={language} setLanguage={setLanguage} /></>;
            return <><ToastContainer /><Dashboard user={user} setUser={setUser} language={language} setLanguage={setLanguage} /></>;
        }

        function ResetPassword() {
            const [password, setPassword] = useState('');
            const [confirm, setConfirm] = useState('');
            const [status, setStatus] = useState('idle');
            const [error, setError] = useState('');

            const token = new URLSearchParams(window.location.search).get('token');

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (password !== confirm) { setError('Passwords do not match'); return; }
                setStatus('loading');
                setError('');
                try {
                    const res = await fetch(`${API_URL}/auth/reset-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, password })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setStatus('success');
                    } else {
                        setError(data.error || 'Error');
                        setStatus('idle');
                    }
                } catch (e) { setError('Connection error'); setStatus('idle'); }
            };

            if (!token) return (
                <div className="auth-container">
                    <div className="auth-box" style={{textAlign: 'center'}}>
                        <p>Invalid reset link.</p>
                        <a href="/" style={{color: '#2BBCC0', fontWeight: 600}}>Back to login</a>
                    </div>
                </div>
            );

            if (status === 'success') return (
                <div className="auth-container">
                    <div className="auth-box" style={{textAlign: 'center'}}>
                        <div className="logo-container" style={{justifyContent: 'center', marginBottom: '16px'}}>
                            <img src="/logo-new.png" alt="brevis" style={{height: '36px'}} />
                        </div>
                        <h3 style={{marginBottom: '12px', color: '#2C3544'}}>Password updated</h3>
                        <p style={{color: '#7A8599', marginBottom: '20px'}}>You can now log in with your new password.</p>
                        <a href="/" className="btn btn-primary" style={{textDecoration: 'none'}}>Go to login</a>
                    </div>
                </div>
            );

            return (
                <div className="auth-container">
                    <div className="auth-box">
                        <div className="logo-container" style={{justifyContent: 'center', marginBottom: '16px'}}>
                            <img src="/logo-new.png" alt="brevis" style={{height: '36px'}} />
                        </div>
                        <h3 style={{textAlign: 'center', marginBottom: '24px', color: '#2C3544'}}>Set new password</h3>
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label className="form-label">New password</label>
                                <input type="password" className="form-input" value={password}
                                    onChange={(e) => setPassword(e.target.value)} required minLength="8" />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Confirm password</label>
                                <input type="password" className="form-input" value={confirm}
                                    onChange={(e) => setConfirm(e.target.value)} required minLength="8" />
                            </div>
                            {error && <div style={{color: '#EF4444', fontSize: '13px', marginBottom: '12px'}}>{error}</div>}
                            <button type="submit" className="btn btn-primary btn-full" disabled={status === 'loading'}>
                                {status === 'loading' ? '...' : 'Reset password'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

                                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>

                        </a>
                        <div style={{textAlign: 'center', marginTop: '20px', fontSize: '14px'}}>
                            {isLogin ? translations.auth.noAccount : translations.auth.hasAccount}{' '}
                            <a href="#" onClick={(e) => { e.preventDefault(); setIsLogin(!isLogin); }}
                                style={{color: '#2BBCC0', fontWeight: '600', textDecoration: 'none'}}>
                                {isLogin ? translations.auth.signUp : translations.auth.signIn}
                            </a>
                        </div>
                        <div style={{textAlign: 'center', marginTop: '16px'}}>
                            <button className="lang-toggle" onClick={() => setLanguage(language === 'es' ? 'en' : 'es')}>
                                {language === 'es' ? 'EN' : 'ES'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function Dashboard({ user, setUser, language, setLanguage }) {
            const { theme, toggleTheme } = useTheme();
            const [newsletters, setNewsletters] = useState([]);
            const [tags, setTags] = useState([]);
            const [savedReports, setSavedReports] = useState([]);
            const [sidebarView, setSidebarView] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');
            const [showAddForm, setShowAddForm] = useState(false);
            const [addMode, setAddMode] = useState('url');
            const [importUrl, setImportUrl] = useState('');
            const [importLoading, setImportLoading] = useState(false);
            const [importError, setImportError] = useState('');
            const [pdfFile, setPdfFile] = useState(null);
            const [pdfLoading, setPdfLoading] = useState(false);
            const [pdfError, setPdfError] = useState('');
            const [showBookmarkletModal, setShowBookmarkletModal] = useState(false);
            const [showTagManager, setShowTagManager] = useState(false);
            const [showSubscriptions, setShowSubscriptions] = useState(false);
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [newslettersLoading, setNewslettersLoading] = useState(true);
            const [subscriptions, setSubscriptions] = useState([]);
            const [showUpgradeModal, setShowUpgradeModal] = useState(false);
            const [showProfileModal, setShowProfileModal] = useState(false);
            const [showUserDropdown, setShowUserDropdown] = useState(false);
            const [readingNewsletter, setReadingNewsletter] = useState(null);
            const [selectionMode, setSelectionMode] = useState(false);
            const [selectedNewsletters, setSelectedNewsletters] = useState([]);
            const [generatingSummary, setGeneratingSummary] = useState({});
            const [generatingBatch, setGeneratingBatch] = useState(false);
            const [showBatchResult, setShowBatchResult] = useState(null);
            const [showTagMenuFor, setShowTagMenuFor] = useState(null);
            const [showActionsMenuFor, setShowActionsMenuFor] = useState(null);
            const [formData, setFormData] = useState({ title: '', sender: '', content: '', url: '' });
            const [collapsedSummaries, setCollapsedSummaries] = useState({});

            const toggleSummaryCollapse = (id) => {
                setCollapsedSummaries(prev => ({...prev, [id]: !prev[id]}));
            };

            const [billingInterval, setBillingInterval] = useState('month');

            const handleCheckout = async (plan) => {
                try {
                    const res = await fetch(`${API_URL}/stripe/checkout`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ plan, interval: billingInterval })
                    });
                    const data = await res.json();
                    if (data.url) {
                        window.location.href = data.url;
                    } else {
                        showToast(data.error || 'Error creating checkout', 'error');
                    }
                } catch (e) {
                    console.error('Checkout error:', e);
                    showToast('Error connecting to payment system', 'error');
                }
            };

            const handleManageSubscription = async () => {
                try {
                    const res = await fetch(`${API_URL}/stripe/portal`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include'
                    });
                    const data = await res.json();
                    if (data.url) {
                        window.location.href = data.url;
                    } else {
                        showToast(data.error || 'Error opening portal', 'error');
                    }
                } catch (e) {
                    console.error('Portal error:', e);
                }
            };

            const t = {
                es: {
                    app: { tagline: "Tu lista de lectura. Curada. Resumida." },
                    nav: { search: "Buscar...", add: "+ Añadir", tags: "Etiquetas" },
                    sidebar: {
                        main: "Principal", all: "Todo", unread: "Sin leer", read: "Leídos",
                        tags: "Etiquetas", reports: "Reportes"
                    },
                    newsletter: {
                        title: "Título", from: "De", content: "Contenido", url: "URL (opcional)",
                        add: "Añadir Newsletter", read: "Leer", summary: "Resumen",
                        generating: "Generando...", original: "Ver Original", delete: "Eliminar",
                        markRead: "Marcar como leído", markUnread: "Marcar como no leído", new: "NUEVO",
                        sendKindle: "Enviar a Kindle", readAloud: "Lectura en audio"
                    },
                    email: { label: "Email para enviar tus newsletters" },
                    selection: {
                        selected: "seleccionados", clearSelection: "Limpiar",
                        brief: "Brief", report: "Reporte"
                    },
                    plans: {
                        free: "Gratis", pro: "Pro", premium: "Premium",
                        upgrade: "Mejorar Plan", upgradePrompt: "Llegas al límite de tu plan"
                    },
                    profile: {
                        title: "Mi Perfil", name: "Nombre", email: "Email",
                        newPassword: "Nueva Contraseña", save: "Guardar", cancel: "Cancelar",
                        plan: "Plan", changePlan: "Cambiar Plan"
                    },
                    auth: { logout: "Salir" },
                    import_: {
                        urlTab: "Importar URL", manualTab: "Manual",
                        urlPlaceholder: "Pega un link de Twitter/X...",
                        importing: "Importando...", import_: "Importar",
                        linkedinHint: "Los posts de LinkedIn solo se pueden guardar con el bookmarklet.",
                        bookmarklet: "Web Clipper",
                        bookmarkletDesc: "Arrastra este botón a tu barra de favoritos para guardar contenido de cualquier página.",
                        bookmarkletBtn: "BREVIS",
                        error: "No se pudo importar el contenido."
                    },
                    empty: {
                        title: "No hay newsletters",
                        subtitle: "Envía tu primer newsletter o añádelo manualmente"
                    }
                },
                en: {
                    app: { tagline: "Your reading list. Curated. Summarized." },
                    nav: { search: "Search...", add: "+ Add", tags: "Tags" },
                    sidebar: {
                        main: "Main", all: "All", unread: "Unread", read: "Read",
                        tags: "Tags", reports: "Reports"
                    },
                    newsletter: {
                        title: "Title", from: "From", content: "Content", url: "URL (optional)",
                        add: "Add Newsletter", read: "Read", summary: "Summary",
                        generating: "Generating...", original: "View Original", delete: "Delete",
                        markRead: "Mark as read", markUnread: "Mark as unread", new: "NEW",
                        sendKindle: "Send to Kindle", readAloud: "Read aloud"
                    },
                    email: { label: "Email to send your newsletters" },
                    selection: {
                        selected: "selected", clearSelection: "Clear",
                        brief: "Brief", report: "Report"
                    },
                    plans: {
                        free: "Free", pro: "Pro", premium: "Premium",
                        upgrade: "Upgrade Plan", upgradePrompt: "Reaching your plan limit"
                    },
                    profile: {
                        title: "My Profile", name: "Name", email: "Email",
                        newPassword: "New Password", save: "Save", cancel: "Cancel",
                        plan: "Plan", changePlan: "Change Plan"
                    },
                    auth: { logout: "Logout" },
                    import_: {
                        urlTab: "Import URL", manualTab: "Manual",
                        urlPlaceholder: "Paste a Twitter/X thread link...",
                        importing: "Importing...", import_: "Import",
                        linkedinHint: "LinkedIn posts can only be saved via the bookmarklet.",
                        bookmarklet: "Web Clipper",
                        bookmarkletDesc: "Drag this button to your bookmark bar to save content from any page.",
                        bookmarkletBtn: "BREVIS",
                        error: "Could not import content."
                    },
                    empty: {
                        title: "No newsletters",
                        subtitle: "Send your first newsletter or add it manually"
                    }
                }
            };
            const translations = t[language];

            useEffect(() => {
                fetchNewsletters();
                fetchTags();
                fetchSubscriptions();
                loadSavedReports();
            }, []);

            // Close tag dropdown when clicking outside
            useEffect(() => {
                if (!showTagMenuFor) return;

                const handleClickOutside = (e) => {
                    // Check if click is outside the tag dropdown and its button
                    const tagDropdown = e.target.closest('.tag-dropdown');
                    const tagButton = e.target.closest('button');
                    const isTagButton = tagButton && tagButton.textContent.includes('Etiquetas') || tagButton && tagButton.textContent.includes('Tags');

                    if (!tagDropdown && !isTagButton) {
                        setShowTagMenuFor(null);
                    }
                };

                document.addEventListener('click', handleClickOutside);
                return () => document.removeEventListener('click', handleClickOutside);
            }, [showTagMenuFor]);

            // Close actions dropdown when clicking outside
            useEffect(() => {
                if (!showActionsMenuFor) return;

                const handleClickOutside = (e) => {
                    const actionsDropdown = e.target.closest('.actions-dropdown');
                    const actionsButton = e.target.closest('button');
                    const isActionsButton = actionsButton && actionsButton.textContent.includes('⋯');

                    if (!actionsDropdown && !isActionsButton) {
                        setShowActionsMenuFor(null);
                    }
                };

                document.addEventListener('click', handleClickOutside);
                return () => document.removeEventListener('click', handleClickOutside);
            }, [showActionsMenuFor]);

            const fetchNewsletters = async () => {
                setNewslettersLoading(true);
                try {
                    const res = await fetch(`${API_URL}/newsletters`, { credentials: 'include' });
                    if (res.ok) setNewsletters(await res.json());
                } catch (e) { console.error('Error:', e); }
                finally { setNewslettersLoading(false); }
            };

            const fetchTags = async () => {
                try {
                    const res = await fetch(`${API_URL}/tags`, { credentials: 'include' });
                    if (res.ok) setTags(await res.json());
                } catch (e) { console.error('Error:', e); }
            };

            const fetchSubscriptions = async () => {
                try {
                    const res = await fetch(`${API_URL}/subscriptions`, { credentials: 'include' });
                    if (res.ok) setSubscriptions(await res.json());
                } catch (e) { console.error('Error:', e); }
            };

            const loadSavedReports = () => {
                try {
                    const saved = localStorage.getItem('brevis_saved_reports');
                    if (saved) setSavedReports(JSON.parse(saved));
                } catch (e) { console.error('Error:', e); }
            };

            const saveReport = (report) => {
                const newReport = {
                    id: Date.now(),
                    name: `${report.type === 'brief' ? 'Brief' : 'Reporte'} - ${new Date().toLocaleDateString()}`,
                    type: report.type,
                    content: report.content,
                    date: new Date().toISOString()
                };
                const updated = [...savedReports, newReport];
                setSavedReports(updated);
                localStorage.setItem('brevis_saved_reports', JSON.stringify(updated));
            };

            const deleteReport = (id) => {
                const updated = savedReports.filter(r => r.id !== id);
                setSavedReports(updated);
                localStorage.setItem('brevis_saved_reports', JSON.stringify(updated));
            };

            const renameReport = (id, newName) => {
                const updated = savedReports.map(r => r.id === id ? {...r, name: newName} : r);
                setSavedReports(updated);
                localStorage.setItem('brevis_saved_reports', JSON.stringify(updated));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch(`${API_URL}/newsletters`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(formData)
                    });
                    if (res.ok) {
                        fetchNewsletters();
                        setFormData({ title: '', sender: '', content: '', url: '' });
                        setShowAddForm(false);
                        showToast(language === 'es' ? 'Newsletter añadido' : 'Newsletter added');
                    }
                } catch (e) { console.error('Error:', e); }
            };

            const handleImportUrl = async (e) => {
                e.preventDefault();
                setImportLoading(true);
                setImportError('');
                try {
                    const res = await fetch(`${API_URL}/import/url`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ url: importUrl })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        setImportError(data.error === 'linkedin_not_supported'
                            ? translations.import_.linkedinHint
                            : (data.error || translations.import_.error));
                        return;
                    }
                    fetchNewsletters();
                    setImportUrl('');
                    setShowAddForm(false);
                    showToast(language === 'es' ? 'Importado correctamente' : 'Imported successfully');
                } catch (e) {
                    setImportError(translations.import_.error);
                } finally {
                    setImportLoading(false);
                }
            };

            const handlePdfUpload = async (e) => {
                e.preventDefault();
                if (!pdfFile) return;
                setPdfLoading(true);
                setPdfError('');
                try {
                    const formData = new FormData();
                    formData.append('file', pdfFile);
                    const res = await fetch(`${API_URL}/newsletters/upload-pdf`, {
                        method: 'POST',
                        credentials: 'include',
                        body: formData
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        setPdfError(data.error || (language === 'es' ? 'Error al procesar PDF' : 'Error processing PDF'));
                        return;
                    }
                    fetchNewsletters();
                    setPdfFile(null);
                    setShowAddForm(false);
                    showToast(language === 'es' ? 'PDF importado correctamente' : 'PDF imported successfully');
                } catch (err) {
                    setPdfError(language === 'es' ? 'Error al subir el archivo' : 'Error uploading file');
                } finally {
                    setPdfLoading(false);
                }
            };

            const toggleRead = async (id) => {
                const newsletter = newsletters.find(n => n.id === id);
                try {
                    const res = await fetch(`${API_URL}/newsletters/${id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ is_read: newsletter.is_read ? 0 : 1 })
                    });
                    if (res.ok) {
                        setNewsletters(newsletters.map(n => n.id === id ? { ...n, is_read: !n.is_read } : n));
                        if (readingNewsletter?.id === id) {
                            setReadingNewsletter({...readingNewsletter, is_read: !readingNewsletter.is_read});
                        }
                    }
                } catch (e) { console.error('Error:', e); }
            };

            const deleteNewsletter = async (id) => {
                if (!confirm(language === 'es' ? '¿Eliminar newsletter?' : 'Delete newsletter?')) return;
                try {
                    const res = await fetch(`${API_URL}/newsletters/${id}`, {
                        method: 'DELETE',
                        credentials: 'include'
                    });
                    if (res.ok) {
                        setNewsletters(newsletters.filter(n => n.id !== id));
                        if (readingNewsletter?.id === id) setReadingNewsletter(null);
                        setShowActionsMenuFor(null);
                        // Newsletter deleted successfully
                    }
                } catch (e) { console.error('Error:', e); }
            };

            const sendToKindle = async (id) => {
                try {
                    const res = await fetch(`${API_URL}/newsletters/${id}/kindle`, {
                        method: 'POST',
                        credentials: 'include'
                    });
                    if (res.ok) {
                        showToast(language === 'es' ? '¡Enviado a tu Kindle!' : 'Sent to your Kindle!');
                        setShowActionsMenuFor(null);
                    } else {
                        const error = await res.json();
                        showToast(error.error || 'Error sending to Kindle', 'error');
                    }
                } catch (e) {
                    console.error('Error:', e);
                    showToast('Error sending to Kindle', 'error');
                }
            };

            const readAloud = async (id) => {
                const newsletter = newsletters.find(n => n.id === id);
                if (!newsletter) return;

                try {
                    const res = await fetch(`${API_URL}/newsletters/${id}/audio`, {
                        method: 'POST',
                        credentials: 'include'
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.audioUrl) {
                            window.open(data.audioUrl, '_blank');
                        }
                        setShowActionsMenuFor(null);
                    } else {
                        const error = await res.json();
                        showToast(error.error || 'Error generating audio', 'error');
                    }
                } catch (e) {
                    console.error('Error:', e);
                    showToast('Error generating audio', 'error');
                }
            };

            const generateSummary = async (id) => {
                if (user.plan === 'free') {
                    setShowUpgradeModal(true);
                    return;
                }
                setGeneratingSummary({...generatingSummary, [id]: true});
                try {
                    const res = await fetch(`${API_URL}/newsletters/${id}/summary`, {
                        method: 'POST',
                        credentials: 'include'
                    });
                    if (!res.ok) {
                        const error = await res.json();
                        console.error('Summary error response:', error);
                        if (error.error && error.error.includes('Upgrade')) {
                            setShowUpgradeModal(true);
                            return;
                        }
                        throw new Error(error.error || 'Failed to generate summary');
                    }
                    const data = await res.json();
                    console.log('Summary response:', data);
                    setNewsletters(newsletters.map(n => n.id === id ? { ...n, summary: data.summary } : n));
                    if (readingNewsletter?.id === id) {
                        setReadingNewsletter({...readingNewsletter, summary: data.summary});
                    }
                } catch (e) {
                    console.error('Summary error:', e);
                    showToast(e.message, 'error');
                } finally {
                    setGeneratingSummary({...generatingSummary, [id]: false});
                }
            };

            const generateBrief = async () => {
                if (selectedNewsletters.length === 0) return;
                if (user.plan === 'free') {
                    setShowUpgradeModal(true);
                    return;
                }

                const purpose = prompt(
                    language === 'es'
                        ? '¿Para qué quieres este brief? (ej: preparar una reunión, investigar un tema, tomar una decisión...)'
                        : 'What do you need this brief for? (e.g., prepare a meeting, research a topic, make a decision...)'
                );
                if (purpose === null) return; // User cancelled

                setGeneratingBatch(true);
                try {
                    const res = await fetch(`${API_URL}/newsletters/brief`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ newsletter_ids: selectedNewsletters, purpose })
                    });
                    if (!res.ok) {
                        const error = await res.json();
                        throw new Error(error.error || 'Failed');
                    }
                    const data = await res.json();
                    console.log('Brief response:', data);
                    const result = { type: 'brief', content: data.brief, purpose };
                    setShowBatchResult(result);
                    saveReport(result);
                    setSelectionMode(false);
                    setSelectedNewsletters([]);
                } catch (e) {
                    console.error('Brief error:', e);
                    showToast(e.message, 'error');
                } finally {
                    setGeneratingBatch(false);
                }
            };

            const generateReport = async () => {
                if (selectedNewsletters.length === 0) return;
                if (user.plan !== 'premium') {
                    setShowUpgradeModal(true);
                    return;
                }

                const purpose = prompt(
                    language === 'es'
                        ? '¿Para qué quieres este reporte? (ej: presentar a mi equipo, escribir un artículo, análisis de mercado...)'
                        : 'What do you need this report for? (e.g., present to my team, write an article, market analysis...)'
                );
                if (purpose === null) return; // User cancelled

                setGeneratingBatch(true);
                try {
                    const res = await fetch(`${API_URL}/newsletters/report`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ newsletter_ids: selectedNewsletters, purpose })
                    });
                    if (!res.ok) {
                        const error = await res.json();
                        throw new Error(error.error || 'Failed');
                    }
                    const data = await res.json();
                    console.log('Report response:', data);
                    const result = { type: 'report', content: data.report, purpose };
                    setShowBatchResult(result);
                    saveReport(result);
                    setSelectionMode(false);
                    setSelectedNewsletters([]);
                } catch (e) {
                    console.error('Report error:', e);
                    showToast(e.message, 'error');
                } finally {
                    setGeneratingBatch(false);
                }
            };

            const addTagToNewsletter = async (newsletterId, tagId) => {
                try {
                    const res = await fetch(`${API_URL}/newsletters/${newsletterId}/tags/${tagId}`, {
                        method: 'POST',
                        credentials: 'include'
                    });
                    if (!res.ok) throw new Error('Failed');
                    const updated = await res.json();
                    setNewsletters(newsletters.map(n => n.id === newsletterId ? updated : n));
                    if (readingNewsletter?.id === newsletterId) setReadingNewsletter(updated);
                } catch (e) { console.error('Error:', e); }
            };

            const removeTagFromNewsletter = async (newsletterId, tagId) => {
                try {
                    const res = await fetch(`${API_URL}/newsletters/${newsletterId}/tags/${tagId}`, {
                        method: 'DELETE',
                        credentials: 'include'
                    });
                    if (!res.ok) throw new Error('Failed');
                    const updated = await res.json();
                    setNewsletters(newsletters.map(n => n.id === newsletterId ? updated : n));
                    if (readingNewsletter?.id === newsletterId) setReadingNewsletter(updated);
                } catch (e) { console.error('Error:', e); }
            };

            const logout = async () => {
                try {
                    await fetch(`${API_URL}/auth/logout`, { method: 'POST', credentials: 'include' });
                    setUser(null);
                } catch (e) { console.error('Error:', e); }
            };

            const getFilteredNewsletters = () => {
                let filtered = newsletters;
                if (sidebarView === 'unread') filtered = filtered.filter(n => !n.is_read);
                else if (sidebarView === 'read') filtered = filtered.filter(n => n.is_read);
                else if (sidebarView.startsWith('tag:')) {
                    const tagId = parseInt(sidebarView.split(':')[1]);
                    filtered = filtered.filter(n => n.tags && n.tags.some(t => t.id === tagId));
                }
                if (searchTerm) {
                    filtered = filtered.filter(n =>
                        n.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        n.sender.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }
                return filtered;
            };

            const filteredNewsletters = getFilteredNewsletters();

            return (
                <div className="app-layout">
                    {sidebarOpen && <div className="sidebar-overlay active" onClick={() => setSidebarOpen(false)}></div>}
                    <div className={`sidebar ${sidebarOpen ? 'sidebar-open' : ''}`}>
                        <div className="sidebar-logo">
                            <div className="logo-container">
                                <img src="/logo-new.png" alt="brevis" style={{height: '38px'}} />
                            </div>
                        </div>
                        <div className="sidebar-section">
                            <div className="sidebar-title">{translations.import_.bookmarklet}</div>
                            <button className="sidebar-item" onClick={() => setShowBookmarkletModal(true)}>
                                <span className="sidebar-item-icon">
                                    <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                                </span>
                                <span className="sidebar-item-label">{language === 'es' ? 'Configurar' : 'Setup'}</span>
                            </button>
                        </div>
                        <div className="sidebar-section">
                            <div className="sidebar-title">{translations.sidebar.main}</div>
                            <button className={`sidebar-item ${sidebarView === 'all' ? 'active' : ''}`}
