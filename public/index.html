                        if (error.error && error.error.includes('Upgrade')) {
                            setShowUpgradeModal(true);
                            return;
                        }
                        throw new Error(error.error || 'Failed to generate summary');
                    }
                    const data = await res.json();
                    console.log('Summary response:', data);
                    setNewsletters(newsletters.map(n => n.id === id ? { ...n, summary: data.summary } : n));
                    if (readingNewsletter?.id === id) {
                        setReadingNewsletter({...readingNewsletter, summary: data.summary});
                    }
                } catch (e) {
                    console.error('Summary error:', e);
                    alert('Error: ' + e.message);
                } finally {
                    setGeneratingSummary({...generatingSummary, [id]: false});
                }
            };

            const generateBrief = async () => {
                if (selectedNewsletters.length === 0) return;
                if (user.plan === 'free') {
                    setShowUpgradeModal(true);
                    return;
                }

                const purpose = prompt(
                    language === 'es'
                        ? '¿Para qué quieres este brief? (ej: preparar una reunión, investigar un tema, tomar una decisión...)'
                        : 'What do you need this brief for? (e.g., prepare a meeting, research a topic, make a decision...)'
                );
                if (purpose === null) return; // User cancelled

                setGeneratingBatch(true);
                try {
                    const res = await fetch(`${API_URL}/newsletters/brief`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ newsletter_ids: selectedNewsletters, purpose })
                    });
                    if (!res.ok) {
                        const error = await res.json();
                        throw new Error(error.error || 'Failed');
                    }
                    const data = await res.json();
                    console.log('Brief response:', data);
                    const result = { type: 'brief', content: data.brief, purpose };
                    setShowBatchResult(result);
                    saveReport(result);
                    setSelectionMode(false);
                    setSelectedNewsletters([]);
                } catch (e) {
                    console.error('Brief error:', e);
                    alert('Error generating brief: ' + e.message);
                } finally {
                    setGeneratingBatch(false);
                }
            };

            const generateReport = async () => {
                if (selectedNewsletters.length === 0) return;
                if (user.plan !== 'premium') {
                    setShowUpgradeModal(true);
                    return;
                }

                const purpose = prompt(
                    language === 'es'
                        ? '¿Para qué quieres este reporte? (ej: presentar a mi equipo, escribir un artículo, análisis de mercado...)'
                        : 'What do you need this report for? (e.g., present to my team, write an article, market analysis...)'
                );
                if (purpose === null) return; // User cancelled

                setGeneratingBatch(true);
                try {
                    const res = await fetch(`${API_URL}/newsletters/report`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ newsletter_ids: selectedNewsletters, purpose })
                    });
                    if (!res.ok) {
                        const error = await res.json();
                        throw new Error(error.error || 'Failed');
                    }
                    const data = await res.json();
                    console.log('Report response:', data);
                    const result = { type: 'report', content: data.report, purpose };
                    setShowBatchResult(result);
                    saveReport(result);
                    setSelectionMode(false);
                    setSelectedNewsletters([]);
                } catch (e) {
                    console.error('Report error:', e);
                    alert('Error generating report: ' + e.message);
                } finally {
                    setGeneratingBatch(false);
                }
            };

            const addTagToNewsletter = async (newsletterId, tagId) => {
                try {
                    const res = await fetch(`${API_URL}/newsletters/${newsletterId}/tags/${tagId}`, {
                        method: 'POST',
                        credentials: 'include'
                    });
                    if (!res.ok) throw new Error('Failed');
                    const updated = await res.json();
                    setNewsletters(newsletters.map(n => n.id === newsletterId ? updated : n));
                    if (readingNewsletter?.id === newsletterId) setReadingNewsletter(updated);
                } catch (e) { console.error('Error:', e); }
            };

            const removeTagFromNewsletter = async (newsletterId, tagId) => {
                try {
                    const res = await fetch(`${API_URL}/newsletters/${newsletterId}/tags/${tagId}`, {
                        method: 'DELETE',
                        credentials: 'include'
                    });
                    if (!res.ok) throw new Error('Failed');
                    const updated = await res.json();
                    setNewsletters(newsletters.map(n => n.id === newsletterId ? updated : n));
                    if (readingNewsletter?.id === newsletterId) setReadingNewsletter(updated);
                } catch (e) { console.error('Error:', e); }
            };

            const logout = async () => {
                try {
                    await fetch(`${API_URL}/auth/logout`, { method: 'POST', credentials: 'include' });
                    setUser(null);
                } catch (e) { console.error('Error:', e); }
            };

            const getFilteredNewsletters = () => {
                let filtered = newsletters;
                if (sidebarView === 'unread') filtered = filtered.filter(n => !n.is_read);
                else if (sidebarView === 'read') filtered = filtered.filter(n => n.is_read);
                else if (sidebarView.startsWith('tag:')) {
                    const tagId = parseInt(sidebarView.split(':')[1]);
                    filtered = filtered.filter(n => n.tags && n.tags.some(t => t.id === tagId));
                }
                if (searchTerm) {
                    filtered = filtered.filter(n =>
                        n.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        n.sender.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }
                return filtered;
            };

            const filteredNewsletters = getFilteredNewsletters();

            return (
                <div className="app-layout">
                    <div className="sidebar">
                        <div className="sidebar-logo">
                            <div className="logo-container">
                                <div className="logo-mark">BR</div>
                                <div className="logo-text">BREVIS</div>
                            </div>
                        </div>
                        <div className="sidebar-section">
                            <div className="sidebar-title">{translations.sidebar.main}</div>
                            <button className={`sidebar-item ${sidebarView === 'all' ? 'active' : ''}`}
                                onClick={() => setSidebarView('all')}>
                                <span className="sidebar-item-icon">📧</span>
                                <span className="sidebar-item-label">{translations.sidebar.all}</span>
                                <span className="sidebar-item-count">{newsletters.length}</span>
                            </button>
                            <button className={`sidebar-item ${sidebarView === 'unread' ? 'active' : ''}`}
                                onClick={() => setSidebarView('unread')}>
                                <span className="sidebar-item-icon">●</span>
                                <span className="sidebar-item-label">{translations.sidebar.unread}</span>
                                <span className="sidebar-item-count">{newsletters.filter(n => !n.is_read).length}</span>
                            </button>
                            <button className={`sidebar-item ${sidebarView === 'read' ? 'active' : ''}`}
                                onClick={() => setSidebarView('read')}>
                                <span className="sidebar-item-icon">✓</span>
                                <span className="sidebar-item-label">{translations.sidebar.read}</span>
                                <span className="sidebar-item-count">{newsletters.filter(n => n.is_read).length}</span>
                            </button>
                        </div>
                        {tags.length > 0 && (
                            <div className="sidebar-section">
                                <div className="sidebar-title">{translations.sidebar.tags}</div>
                                {tags.map(tag => (
                                    <button key={tag.id}
                                        className={`sidebar-item sidebar-tag-item ${sidebarView === `tag:${tag.id}` ? 'active' : ''}`}
                                        onClick={() => setSidebarView(`tag:${tag.id}`)}>
                                        <span className="sidebar-item-icon" style={{color: tag.color}}>●</span>
                                        <span className="sidebar-item-label">{tag.name}</span>
                                    </button>
                                ))}
                            </div>
                        )}
                        {savedReports.length > 0 && (
                            <div className="sidebar-section">
                                <div className="sidebar-title">{translations.sidebar.reports}</div>
                                {savedReports.map(report => (
                                    <div key={report.id} className="sidebar-report-item"
                                        onClick={() => setShowBatchResult(report)}>
                                        <span>{report.type === 'brief' ? '📝' : '📊'}</span>
                                        <span style={{flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>
                                            {report.name}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                    <div className="main-content">
                        <div className="container">
                            <div className="header">
                                <div className="tagline">{translations.app.tagline}</div>
                                <div className="user-menu">
                                    <span className="plan-badge">{translations.plans[user.plan]}</span>
                                    <button className="lang-toggle" onClick={() => setLanguage(language === 'es' ? 'en' : 'es')}>
                                        {language === 'es' ? 'EN' : 'ES'}
                                    </button>
                                    <button className="user-name-button" onClick={() => setShowUserDropdown(!showUserDropdown)}>
                                        {user.name} <span>▼</span>
                                    </button>
                                    {showUserDropdown && (
                                        <div className="user-dropdown">
                                            <div className="user-dropdown-info">
                                                <div>{user.name}</div>
                                                <div className="user-dropdown-email">{user.email}</div>
                                            </div>
                                            <div className="user-dropdown-item" onClick={() => {
                                                setShowProfileModal(true);
                                                setShowUserDropdown(false);
                                            }}>
                                                <span>👤</span>
                                                <span>{translations.profile.title}</span>
                                            </div>
                                            <div className="user-dropdown-item" onClick={logout}>
                                                <span>🚪</span>
                                                <span>{translations.auth.logout}</span>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                            <div className="email-display">
                                <div className="email-label">{translations.email.label}</div>
                                <div className="email-code">{user.email_code}@newsletters.brevisapp.com</div>
                                <div style={{marginTop: '8px', fontSize: '12px', color: '#7A8599'}}>
                                    {language === 'es'
                                        ? 'Guárdalo como "BREVIS" en tus contactos para enviarlo más rápidamente'
                                        : 'Save it as "BREVIS" in your contacts for faster forwarding'}
                                </div>
                            </div>
                            <div className="nav">
                                <div className="search-box">
                                    <input type="text" className="search-input" placeholder={translations.nav.search}
                                        value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                                </div>
                                <button className="btn btn-small" onClick={() => setShowTagManager(true)}>
                                    {translations.nav.tags}
                                </button>
                                <button className="btn btn-small" onClick={() => {
                                    setSelectionMode(!selectionMode);
                                    setSelectedNewsletters([]);
                                }}>
                                    {selectionMode ? '✓' : '☐'} Select
                                </button>
                                <button className="btn btn-small btn-primary" onClick={() => setShowAddForm(true)}>
                                    {translations.nav.add}
                                </button>
                            </div>
                            {selectionMode && selectedNewsletters.length > 0 && (
                                <div className="selection-bar">
                                    <div className="selection-info">
                                        {selectedNewsletters.length} {translations.selection.selected}
                                    </div>
                                    <div className="selection-actions">
                                        <button className="btn btn-small" onClick={() => setSelectedNewsletters([])}>
                                            {translations.selection.clearSelection}
                                        </button>
                                        {user.plan !== 'free' && (
                                            <button className="btn btn-small" onClick={generateBrief} disabled={generatingBatch}>
                                                {generatingBatch ? '⏳' : '📝'} {translations.selection.brief}
                                            </button>
                                        )}
                                        {user.plan === 'premium' && (
                                            <button className="btn btn-small btn-primary" onClick={generateReport} disabled={generatingBatch}>
                                                {generatingBatch ? '⏳' : '📊'} {translations.selection.report}
                                            </button>
                                        )}
                                    </div>
                                </div>
                            )}
                            {filteredNewsletters.length === 0 ? (
                                <div className="empty-state">
                                    <div className="empty-title">{translations.empty.title}</div>
                                    <div className="empty-text">{translations.empty.subtitle}</div>
                                </div>
                            ) : (
                                filteredNewsletters.map(newsletter => (
                                    <div key={newsletter.id} className={`newsletter-card ${newsletter.is_read ? 'read' : ''} ${selectionMode ? 'selecting' : ''}`}>
                                        {selectionMode && (
                                            <input type="checkbox" className="newsletter-checkbox"
                                                checked={selectedNewsletters.includes(newsletter.id)}
                                                onChange={() => {
                                                    if (selectedNewsletters.includes(newsletter.id)) {
                                                        setSelectedNewsletters(selectedNewsletters.filter(id => id !== newsletter.id));
                                                    } else {
                                                        setSelectedNewsletters([...selectedNewsletters, newsletter.id]);
                                                    }
                                                }} />
                                        )}
                                        <div className="newsletter-card-content">
                                            <div style={{display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap'}}>
                                                <h2 className="newsletter-title" onClick={() => setReadingNewsletter(newsletter)}>
                                                    {cleanTitle(newsletter.title)}
                                                </h2>
                                                {!newsletter.is_read && <span className="badge">{translations.newsletter.new}</span>}
                                                {newsletter.tags && newsletter.tags.length > 0 && newsletter.tags.map(tag => (
                                                    <span key={tag.id} className="newsletter-tag"
                                                        style={{borderColor: tag.color, color: tag.color}}>
                                                        {tag.name}
                                                    </span>
                                                ))}
                                            </div>
                                            <div className="newsletter-meta">
                                                {newsletter.sender} — {new Date(newsletter.date_added).toLocaleDateString()}
                                            </div>
                                            <div className="newsletter-content">{stripHtml(newsletter.content)}</div>
                                            {newsletter.summary && (
                                                <div className="summary-box" style={{marginTop: '8px'}}>
                                                    <div className="summary-header" onClick={() => toggleSummaryCollapse(newsletter.id)}>
                                                        <span className="summary-label">{translations.newsletter.summary}</span>
                                                        <button className="summary-toggle">
                                                            {collapsedSummaries[newsletter.id] ? '▼' : '▲'}
                                                        </button>
                                                    </div>
                                                    <div className={`summary-content ${collapsedSummaries[newsletter.id] ? 'collapsed' : ''}`}>
                                                        {newsletter.summary}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                        <div className="newsletter-card-actions">
                                            {!newsletter.summary && (user.plan === 'pro' || user.plan === 'premium') && (
                                                <button className="btn btn-small" onClick={() => generateSummary(newsletter.id)}
                                                    disabled={generatingSummary[newsletter.id]}>
                                                    {generatingSummary[newsletter.id] ? '...' : translations.newsletter.summary}
                                                </button>
                                            )}
                                            <div style={{position: 'relative'}} onClick={(e) => e.stopPropagation()}>
                                                <button className="btn btn-small" onClick={(e) => {
                                                    e.stopPropagation();
                                                    setShowTagMenuFor(showTagMenuFor === newsletter.id ? null : newsletter.id);
                                                }}>
                                                    {language === 'es' ? 'Etiquetas' : 'Tags'}
                                                </button>
                                                {showTagMenuFor === newsletter.id && (
                                                    <div className="tag-dropdown" onClick={(e) => e.stopPropagation()}>
                                                        {tags.length > 0 ? tags.map(tag => {
                                                            const hasTag = newsletter.tags && newsletter.tags.some(t => t.id === tag.id);
                                                            return (
                                                                <div key={tag.id} className="tag-dropdown-item"
                                                                    onClick={(e) => {
                                                                        e.stopPropagation();
                                                                        if (hasTag) removeTagFromNewsletter(newsletter.id, tag.id);
                                                                        else addTagToNewsletter(newsletter.id, tag.id);
                                                                    }}>
                                                                    <span style={{width: '16px'}}>{hasTag ? '✓' : ''}</span>
                                                                    <span className="tag-color-dot" style={{background: tag.color}}></span>
                                                                    <span style={{flex: 1}}>{tag.name}</span>
                                                                </div>
                                                            );
                                                        }) : (
                                                            <div className="tag-dropdown-empty">
                                                                {language === 'es' ? 'No hay etiquetas' : 'No tags'}
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                            <div style={{position: 'relative'}} onClick={(e) => e.stopPropagation()}>
                                                <button className="btn btn-small" onClick={(e) => {
                                                    e.stopPropagation();
                                                    setShowActionsMenuFor(showActionsMenuFor === newsletter.id ? null : newsletter.id);
                                                }}>
                                                    ⋯
                                                </button>
                                                {showActionsMenuFor === newsletter.id && (
                                                    <div className="actions-dropdown" onClick={(e) => e.stopPropagation()}>
                                                        <div className="actions-dropdown-item" onClick={(e) => {
                                                            e.stopPropagation();
                                                            sendToKindle(newsletter.id);
                                                        }}>
                                                            <span>📖</span>
                                                            <span>{translations.newsletter.sendKindle}</span>
                                                        </div>
                                                        <div className="actions-dropdown-item" onClick={(e) => {
                                                            e.stopPropagation();
                                                            readAloud(newsletter.id);
                                                        }}>
                                                            <span>🔊</span>
                                                            <span>{translations.newsletter.readAloud}</span>
                                                        </div>
                                                        <div className="actions-dropdown-item danger" onClick={(e) => {
                                                            e.stopPropagation();
                                                            deleteNewsletter(newsletter.id);
                                                        }}>
                                                            <span>🗑️</span>
                                                            <span>{translations.newsletter.delete}</span>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))
                            )}
                            <div className="footer">BREVIS Pro — 2026</div>
                        </div>
                    </div>

                    {showAddForm && (
                        <div className="modal-overlay" onClick={() => setShowAddForm(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h2 className="modal-title">{translations.newsletter.add}</h2>
                                    <button className="close-btn" onClick={() => setShowAddForm(false)}>×</button>
                                </div>
                                <form onSubmit={handleSubmit}>
                                    <div className="modal-body">
                                        <div className="form-group">
                                            <label className="form-label">{translations.newsletter.title} *</label>
                                            <input type="text" className="form-input" value={formData.title}
                                                onChange={(e) => setFormData({...formData, title: e.target.value})} required />
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">{translations.newsletter.from} *</label>
                                            <input type="text" className="form-input" value={formData.sender}
                                                onChange={(e) => setFormData({...formData, sender: e.target.value})} required />
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">{translations.newsletter.content} *</label>
                                            <textarea className="form-textarea" value={formData.content}
                                                onChange={(e) => setFormData({...formData, content: e.target.value})} required rows="10" />
                                        </div>
                                        <div className="form-group" style={{marginBottom: 0}}>
                                            <label className="form-label">{translations.newsletter.url}</label>
                                            <input type="url" className="form-input" value={formData.url}
                                                onChange={(e) => setFormData({...formData, url: e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="modal-footer">
                                        <button type="button" className="btn" onClick={() => setShowAddForm(false)}>
                                            {translations.profile.cancel}
                                        </button>
                                        <button type="submit" className="btn btn-primary">
                                            {translations.newsletter.add}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {readingNewsletter && (
                        <div className="modal-overlay" onClick={() => setReadingNewsletter(null)}>
                            <div className="modal" style={{maxWidth: '800px'}} onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h2 className="modal-title">{cleanTitle(readingNewsletter.title)}</h2>
                                    <button className="close-btn" onClick={() => setReadingNewsletter(null)}>×</button>
                                </div>
                                <div className="modal-body">
                                    <div className="modal-meta">
                                        <strong>{readingNewsletter.sender}</strong><br/>
                                        {new Date(readingNewsletter.date_added).toLocaleDateString()}
                                    </div>
                                    {readingNewsletter.summary && (
                                        <div className="summary-box">
                                            <div className="summary-header" onClick={() => toggleSummaryCollapse('modal-' + readingNewsletter.id)}>
                                                <span className="summary-label">{translations.newsletter.summary}</span>
                                                <button className="summary-toggle">
                                                    {collapsedSummaries['modal-' + readingNewsletter.id] ? '▼' : '▲'}
                                                </button>
                                            </div>
                                            <div className={`summary-content ${collapsedSummaries['modal-' + readingNewsletter.id] ? 'collapsed' : ''}`}>
                                                {readingNewsletter.summary}
                                            </div>
                                        </div>
                                    )}
                                    {readingNewsletter.content ? (
                                        readingNewsletter.content.includes('<') ? (
                                            <iframe
                                                className="newsletter-iframe"
                                                srcDoc={`<!DOCTYPE html><html><head><meta charset="utf-8"><base target="_blank"><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;color:#333;padding:0;margin:0;}img{max-width:100%;height:auto;}a{color:#0066cc;}</style></head><body>${readingNewsletter.content}</body></html>`}
                                                sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"
                                                title="Newsletter content"
                                                onLoad={(e) => {
                                                    const iframe = e.target;
                                                    const height = iframe.contentDocument?.body?.scrollHeight;
                                                    if (height) iframe.style.height = height + 20 + 'px';
                                                }}
                                            />
                                        ) : (
                                            <div className="modal-content" style={{marginTop: '16px', whiteSpace: 'pre-wrap'}}>
                                                {readingNewsletter.content}
                                            </div>
                                        )
                                    ) : (
                                        <div className="modal-content" style={{marginTop: '16px'}}>
                                            Sin contenido disponible
                                        </div>
                                    )}
                                    {readingNewsletter.url && (
                                        <div style={{marginTop: '24px'}}>
                                            <a href={readingNewsletter.url} target="_blank" rel="noopener noreferrer" className="btn">
                                                {translations.newsletter.original}
                                            </a>
                                        </div>
                                    )}
                                </div>
                                <div className="modal-footer">
                                    {!readingNewsletter.summary && (user.plan === 'pro' || user.plan === 'premium') && (
                                        <button className="btn btn-primary" onClick={() => generateSummary(readingNewsletter.id)}
                                            disabled={generatingSummary[readingNewsletter.id]}>
                                            {generatingSummary[readingNewsletter.id] ? translations.newsletter.generating : translations.newsletter.summary}
                                        </button>
                                    )}
                                    <button className="btn" onClick={() => toggleRead(readingNewsletter.id)}>
                                        {readingNewsletter.is_read ? translations.newsletter.markUnread : translations.newsletter.markRead}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showProfileModal && (
                        <ProfileModal user={user} onClose={() => setShowProfileModal(false)}
                            onUpdate={(u) => setUser(u)} onUpgrade={() => {
                                setShowProfileModal(false);
                                setShowUpgradeModal(true);
                            }} translations={translations} />
                    )}

                    {showTagManager && (
                        <TagManager tags={tags} onClose={() => setShowTagManager(false)}
                            onUpdate={fetchTags} translations={translations} language={language} />
                    )}

                    {showUpgradeModal && (
                        <div className="modal-overlay" onClick={() => setShowUpgradeModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: '520px'}}>
                                <div className="modal-header">
                                    <h2 className="modal-title">{translations.plans.upgrade}</h2>
                                    <button className="close-btn" onClick={() => setShowUpgradeModal(false)}>×</button>
                                </div>
                                <div className="modal-body">
                                    {/* Billing toggle */}
                                    <div style={{display: 'flex', justifyContent: 'center', marginBottom: '24px', gap: '0', background: '#F0F4F7', borderRadius: '8px', padding: '3px'}}>
                                        <button onClick={() => setBillingInterval('month')}
                                            style={{flex: 1, padding: '8px 16px', border: 'none', borderRadius: '6px', cursor: 'pointer', fontWeight: '600', fontSize: '13px',
                                                background: billingInterval === 'month' ? '#2C3544' : 'transparent',
                                                color: billingInterval === 'month' ? '#FFF' : '#7A8599'}}>
                                            {language === 'es' ? 'Mensual' : 'Monthly'}
                                        </button>
                                        <button onClick={() => setBillingInterval('year')}
                                            style={{flex: 1, padding: '8px 16px', border: 'none', borderRadius: '6px', cursor: 'pointer', fontWeight: '600', fontSize: '13px',
                                                background: billingInterval === 'year' ? '#2C3544' : 'transparent',
                                                color: billingInterval === 'year' ? '#FFF' : '#7A8599'}}>
                                            {language === 'es' ? 'Anual (-27%)' : 'Annual (-27%)'}
                                        </button>
                                    </div>

                                    {/* Plan cards */}
                                    <div style={{display: 'flex', flexDirection: 'column', gap: '16px'}}>
                                        {/* Free */}
                                        <div style={{padding: '16px', border: '1px solid #E8ECF0', borderRadius: '8px', opacity: user.plan === 'free' ? 0.6 : 1}}>
                                            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                                <div>
                                                    <h3 style={{margin: 0, fontSize: '16px'}}>Free</h3>
                                                    <p style={{margin: '4px 0 0', fontSize: '12px', color: '#7A8599'}}>
                                                        {language === 'es' ? 'Newsletters ilimitadas' : 'Unlimited newsletters'}
                                                    </p>
                                                </div>
                                                <div style={{textAlign: 'right'}}>
                                                    <div style={{fontSize: '20px', fontWeight: '700'}}>$0</div>
                                                    {user.plan === 'free' && <span style={{fontSize: '11px', color: '#7A8599'}}>{language === 'es' ? 'Plan actual' : 'Current'}</span>}
                                                </div>
                                            </div>
                                        </div>

                                        {/* Pro */}
                                        <div style={{padding: '16px', border: user.plan === 'pro' ? '2px solid #2BBCC0' : '1px solid #E8ECF0', borderRadius: '8px'}}>
                                            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px'}}>
                                                <div>
                                                    <h3 style={{margin: 0, fontSize: '16px'}}>Pro</h3>
                                                    <p style={{margin: '4px 0 0', fontSize: '12px', color: '#7A8599'}}>
                                                        {language === 'es' ? 'Resúmenes AI + Briefs' : 'AI Summaries + Briefs'}
                                                    </p>
                                                </div>
                                                <div style={{textAlign: 'right'}}>
                                                    <div style={{fontSize: '20px', fontWeight: '700'}}>
                                                        ${billingInterval === 'month' ? '7.99' : '69.99'}
                                                    </div>
                                                    <span style={{fontSize: '11px', color: '#7A8599'}}>
                                                        /{billingInterval === 'month' ? (language === 'es' ? 'mes' : 'mo') : (language === 'es' ? 'año' : 'yr')}
                                                    </span>
                                                </div>
                                            </div>
                                            {user.plan === 'pro' ? (
                                                <button className="btn btn-full" onClick={handleManageSubscription}>
                                                    {language === 'es' ? 'Gestionar suscripción' : 'Manage subscription'}
                                                </button>
                                            ) : user.plan === 'premium' ? null : (
                                                <button className="btn btn-primary btn-full" onClick={() => handleCheckout('pro')}>
                                                    {language === 'es' ? 'Suscribirse a Pro' : 'Subscribe to Pro'}
                                                </button>
                                            )}
                                        </div>

                                        {/* Premium */}
                                        <div style={{padding: '16px', border: user.plan === 'premium' ? '2px solid #2BBCC0' : '1px solid #E8ECF0', borderRadius: '8px'}}>
                                            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px'}}>
                                                <div>
                                                    <h3 style={{margin: 0, fontSize: '16px'}}>Premium</h3>
                                                    <p style={{margin: '4px 0 0', fontSize: '12px', color: '#7A8599'}}>
                                                        {language === 'es' ? 'Todo de Pro + Reports' : 'Everything in Pro + Reports'}
                                                    </p>
                                                </div>
                                                <div style={{textAlign: 'right'}}>
                                                    <div style={{fontSize: '20px', fontWeight: '700'}}>
                                                        ${billingInterval === 'month' ? '9.99' : '89.99'}
                                                    </div>
                                                    <span style={{fontSize: '11px', color: '#7A8599'}}>
                                                        /{billingInterval === 'month' ? (language === 'es' ? 'mes' : 'mo') : (language === 'es' ? 'año' : 'yr')}
                                                    </span>
                                                </div>
                                            </div>
                                            {user.plan === 'premium' ? (
                                                <button className="btn btn-full" onClick={handleManageSubscription}>
                                                    {language === 'es' ? 'Gestionar suscripción' : 'Manage subscription'}
                                                </button>
                                            ) : (
                                                <button className="btn btn-primary btn-full" onClick={() => handleCheckout('premium')}>
                                                    {language === 'es' ? 'Suscribirse a Premium' : 'Subscribe to Premium'}
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showBatchResult && (
                        <div className="modal-overlay" onClick={() => setShowBatchResult(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: '800px'}}>
                                <div className="modal-header">
                                    <h2 className="modal-title">
                                        {showBatchResult.type === 'brief' ? '📝 Brief Ejecutivo' : '📊 Reporte Completo'}
                                    </h2>
                                    <button className="close-btn" onClick={() => setShowBatchResult(null)}>×</button>
                                </div>
                                <div className="modal-body">
                                    <div style={{whiteSpace: 'pre-wrap', lineHeight: '1.8'}}>
                                        {showBatchResult.content}
                                    </div>
                                </div>
                                <div className="modal-footer">
                                    {showBatchResult.id && (
                                        <>
                                            <button className="btn" onClick={() => {
                                                const newName = prompt('Nuevo nombre:', showBatchResult.name);
                                                if (newName) {
                                                    renameReport(showBatchResult.id, newName);
                                                    setShowBatchResult({...showBatchResult, name: newName});
                                                }
                                            }}>
                                                ✏️ Renombrar
                                            </button>
                                            <button className="btn" onClick={() => {
                                                if (confirm('¿Eliminar reporte?')) {
                                                    deleteReport(showBatchResult.id);
                                                    setShowBatchResult(null);
                                                }
                                            }}>
                                                🗑️ Eliminar
                                            </button>
                                        </>
                                    )}
                                    <button className="btn" onClick={() => {
                                        const blob = new Blob([showBatchResult.content], { type: 'text/plain' });
                                        const url = URL.createObjectURL(blob);
                                        const a = document.createElement('a');
                                        a.href = url;
                                        a.download = `${showBatchResult.type}-${Date.now()}.txt`;
                                        a.click();
                                        URL.revokeObjectURL(url);
                                    }}>
                                        📥 Descargar
                                    </button>
                                    <button className="btn btn-primary" onClick={() => setShowBatchResult(null)}>
                                        Cerrar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ProfileModal({ user, onClose, onUpdate, onUpgrade, translations }) {
            const [formData, setFormData] = useState({ name: user.name, email: user.email, newPassword: '' });
            const handleSubmit = async (e) => {
                e.preventDefault();
                alert('Profile update coming soon!');
                onClose();
            };
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <h2 className="modal-title">{translations.profile.title}</h2>
                            <button className="close-btn" onClick={onClose}>×</button>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <div className="modal-body">
                                <div className="form-group">
                                    <label className="form-label">{translations.profile.name}</label>
                                    <input type="text" className="form-input" value={formData.name}
                                        onChange={(e) => setFormData({...formData, name: e.target.value})} />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">{translations.profile.email}</label>
                                    <input type="email" className="form-input" value={formData.email}
                                        onChange={(e) => setFormData({...formData, email: e.target.value})} />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">{translations.profile.newPassword}</label>
                                    <input type="password" className="form-input" value={formData.newPassword}
                                        onChange={(e) => setFormData({...formData, newPassword: e.target.value})}
                                        placeholder="Dejar en blanco para no cambiar" />
                                </div>
                                <div className="form-group" style={{marginBottom: 0}}>
                                    <label className="form-label">{translations.profile.plan}</label>
                                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px', background: '#F8FAFB', borderRadius: '6px'}}>
                                        <span style={{fontWeight: '600'}}>{translations.plans[user.plan]}</span>
                                        <button type="button" className="btn btn-small" onClick={onUpgrade}>
                                            {translations.profile.changePlan}
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn" onClick={onClose}>
                                    {translations.profile.cancel}
                                </button>
                                <button type="submit" className="btn btn-primary">
                                    {translations.profile.save}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function TagManager({ tags, onClose, onUpdate, translations, language }) {
            const [newTag, setNewTag] = useState({ name: '', color: '#2C3544' });
            const colors = ['#2C3544', '#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899', '#6B7280'];

            const t = {
                es: { name: 'Nombre', color: 'Color', create: 'Crear Etiqueta', existing: 'Etiquetas existentes', delete: 'Eliminar', confirmDelete: '¿Eliminar etiqueta?' },
                en: { name: 'Name', color: 'Color', create: 'Create Tag', existing: 'Existing tags', delete: 'Delete', confirmDelete: 'Delete tag?' }
            };
            const txt = t[language] || t.es;

            const createTag = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch(`${API_URL}/tags`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(newTag)
                    });
                    if (res.ok) {
                        setNewTag({ name: '', color: '#2C3544' });
                        onUpdate();
                    }
                } catch (e) { console.error('Error:', e); }
            };
            const deleteTag = async (id) => {
                if (!confirm(txt.confirmDelete)) return;
                try {
                    const res = await fetch(`${API_URL}/tags/${id}`, { method: 'DELETE', credentials: 'include' });
                    if (res.ok) onUpdate();
                } catch (e) { console.error('Error:', e); }
            };
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <h2 className="modal-title">{translations.nav.tags}</h2>
                            <button className="close-btn" onClick={onClose}>×</button>
                        </div>
                        <div className="modal-body">
                            <form onSubmit={createTag} style={{marginBottom: '24px'}}>
                                <div className="form-group">
                                    <label className="form-label">{txt.name}</label>
                                    <input type="text" className="form-input" value={newTag.name}
                                        onChange={(e) => setNewTag({...newTag, name: e.target.value})} required />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">{txt.color}</label>
                                    <div style={{display: 'flex', gap: '8px', flexWrap: 'wrap'}}>
                                        {colors.map(color => (
                                            <button key={color} type="button" onClick={() => setNewTag({...newTag, color})}
                                                style={{
                                                    width: '40px', height: '40px', borderRadius: '50%', background: color,
                                                    border: newTag.color === color ? '3px solid #2C3544' : '1px solid #E8ECF0',
                                                    cursor: 'pointer'
                                                }} />
                                        ))}
                                    </div>
                                </div>
                                <button type="submit" className="btn btn-primary btn-full">{txt.create}</button>
                            </form>
                            {tags.length > 0 && (
                                <div>
                                    <h3 style={{marginBottom: '12px', fontSize: '14px', fontWeight: '600'}}>
                                        {txt.existing}
                                    </h3>
                                    <div style={{display: 'flex', flexDirection: 'column', gap: '8px'}}>
                                        {tags.map(tag => (
                                            <div key={tag.id} style={{display: 'flex', alignItems: 'center', gap: '12px', padding: '12px', background: '#F8FAFB', borderRadius: '6px'}}>
                                                <span style={{width: '24px', height: '24px', borderRadius: '50%', background: tag.color}} />
                                                <span style={{flex: 1, fontWeight: '500'}}>{tag.name}</span>
                                                <button className="btn btn-small" onClick={() => deleteTag(tag.id)}>{txt.delete}</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
