                                        <button type="button" className="btn btn-small" onClick={onUpgrade}>
                                            {translations.profile.changePlan}
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn" onClick={onClose}>
                                    {translations.profile.cancel}
                                </button>
                                <button type="submit" className="btn btn-primary">
                                    {translations.profile.save}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function TagManager({ tags, onClose, onUpdate, translations, language }) {
            const [newTag, setNewTag] = useState({ name: '', color: '#000000' });
            const colors = ['#000000', '#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899', '#6B7280'];

            const t = {
                es: { name: 'Nombre', color: 'Color', create: 'Crear Etiqueta', existing: 'Etiquetas existentes', delete: 'Eliminar', confirmDelete: '¿Eliminar etiqueta?' },
                en: { name: 'Name', color: 'Color', create: 'Create Tag', existing: 'Existing tags', delete: 'Delete', confirmDelete: 'Delete tag?' }
            };
            const txt = t[language] || t.es;

            const createTag = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch(`${API_URL}/tags`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(newTag)
                    });
                    if (res.ok) {
                        setNewTag({ name: '', color: '#000000' });
                        onUpdate();
                    }
                } catch (e) { console.error('Error:', e); }
            };
            const deleteTag = async (id) => {
                if (!confirm(txt.confirmDelete)) return;
                try {
                    const res = await fetch(`${API_URL}/tags/${id}`, { method: 'DELETE', credentials: 'include' });
                    if (res.ok) onUpdate();
                } catch (e) { console.error('Error:', e); }
            };
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <h2 className="modal-title">{translations.nav.tags}</h2>
                            <button className="close-btn" onClick={onClose}>×</button>
                        </div>
                        <div className="modal-body">
                            <form onSubmit={createTag} style={{marginBottom: '24px'}}>
                                <div className="form-group">
                                    <label className="form-label">{txt.name}</label>
                                    <input type="text" className="form-input" value={newTag.name}
                                        onChange={(e) => setNewTag({...newTag, name: e.target.value})} required />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">{txt.color}</label>
                                    <div style={{display: 'flex', gap: '8px', flexWrap: 'wrap'}}>
                                        {colors.map(color => (
                                            <button key={color} type="button" onClick={() => setNewTag({...newTag, color})}
                                                style={{
                                                    width: '40px', height: '40px', borderRadius: '50%', background: color,
                                                    border: newTag.color === color ? '3px solid #000' : '1px solid #E5E5E5',
                                                    cursor: 'pointer'
                                                }} />
                                        ))}
                                    </div>
                                </div>
                                <button type="submit" className="btn btn-primary btn-full">{txt.create}</button>
                            </form>
                            {tags.length > 0 && (
                                <div>
                                    <h3 style={{marginBottom: '12px', fontSize: '14px', fontWeight: '600'}}>
                                        {txt.existing}
                                    </h3>
                                    <div style={{display: 'flex', flexDirection: 'column', gap: '8px'}}>
                                        {tags.map(tag => (
                                            <div key={tag.id} style={{display: 'flex', alignItems: 'center', gap: '12px', padding: '12px', background: '#F8F8F8', borderRadius: '6px'}}>
                                                <span style={{width: '24px', height: '24px', borderRadius: '50%', background: tag.color}} />
                                                <span style={{flex: 1, fontWeight: '500'}}>{tag.name}</span>
                                                <button className="btn btn-small" onClick={() => deleteTag(tag.id)}>{txt.delete}</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
