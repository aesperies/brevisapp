<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFE5D4">
    <meta name="apple-mobile-web-app-capable" content="true">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" data-inline-manifest="true">
    <title>BREVIS — AI Newsletter Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* LIGHT MODE */
            --bg-main: #FFE5D4;
            --bg-cream: #FFF6E0;
            --bg-mint: #B5EAD7;
            --bg-pink: #FFCED1;
            --bg-blue: #C5DEFF;
            --bg-yellow: #FFD23F;
            --bg-lilac: #E4D4FC;
            --ink: #1A1A1A;
            --text-muted: #555555;
            --red: #E63946;
            --white: #FFFFFF;
        }

        [data-theme="dark"] {
            --bg-main: #1A1A1A;
            --bg-cream: #2A2A2A;
            --bg-mint: #3D5A4D;
            --bg-pink: #5A3D40;
            --bg-blue: #3D4A5A;
            --bg-yellow: #FFD23F;
            --bg-lilac: #463D5A;
            --ink: #FFF6E0;
            --text-muted: #AAAAAA;
            --red: #E63946;
            --white: #1A1A1A;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-main);
            color: var(--ink);
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-weight: 700;
            line-height: 1.2;
        }

        h1 { font-size: 40px; font-weight: 800; }
        h2 { font-size: 32px; font-weight: 700; }
        h3 { font-size: 24px; font-weight: 700; }
        h4 { font-size: 20px; font-weight: 600; }

        code, pre, .monospace {
            font-family: 'Space Mono', monospace;
            font-weight: 400;
        }

        #app {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* ============ AUTH VIEWS ============ */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background-color: var(--bg-cream);
            border: 3px solid var(--ink);
            border-radius: 20px;
            padding: 48px;
            box-shadow: 4px 4px 0 var(--ink);
            position: relative;
        }

        .auth-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
        }

        .br-logo {
            width: 48px;
            height: 48px;
        }

        .br-wordmark {
            font-family: 'Bricolage Grotesque';
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .auth-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            background-color: transparent;
        }

        .auth-tab {
            flex: 1;
            padding: 12px 16px;
            border: 3px solid var(--ink);
            background-color: transparent;
            font-family: 'Inter';
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .auth-tab:hover {
            transform: translate(-2px, -2px);
            box-shadow: 3px 3px 0 var(--ink);
        }

        .auth-tab.active {
            background-color: var(--bg-yellow);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-family: 'Space Mono';
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 3px solid var(--ink);
            background-color: var(--bg-cream);
            font-family: 'Inter';
            font-size: 14px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            box-shadow: 4px 4px 0 var(--ink);
            transform: translate(-2px, -2px);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            padding: 14px 24px;
            border: 3px solid var(--ink);
            font-family: 'Inter';
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--bg-yellow);
            width: 100%;
            box-shadow: 5px 5px 0 var(--red);
        }

        .btn-primary:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0 var(--red);
        }

        .btn-primary:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 var(--red);
        }

        .forgot-link {
            color: var(--ink);
            font-size: 13px;
            text-decoration: none;
            border-bottom: 2px solid var(--ink);
            cursor: pointer;
        }

        .forgot-link:hover {
            opacity: 0.7;
        }

        .plan-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 24px 0;
        }

        .plan-card {
            padding: 20px;
            border: 3px solid var(--ink);
            border-radius: 12px;
            background-color: var(--bg-cream);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .plan-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .plan-card.selected {
            background-color: var(--bg-yellow);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .plan-name {
            font-family: 'Bricolage Grotesque';
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .plan-price {
            font-family: 'Space Mono';
            font-size: 14px;
            color: var(--text-muted);
        }

        /* ============ SIDEBAR NAVIGATION ============ */
        .sidebar {
            width: 280px;
            background-color: var(--bg-cream);
            border-right: 3px solid var(--ink);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 24px 0;
        }

        .sidebar-logo-section {
            padding: 0 20px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-br {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }

        .sidebar-brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .sidebar-wordmark {
            font-family: 'Bricolage Grotesque';
            font-size: 18px;
            font-weight: 800;
        }

        .plan-badge {
            display: inline-block;
            background-color: var(--bg-yellow);
            border: 2px solid var(--ink);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: 'Space Mono';
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            width: fit-content;
        }

        .new-newsletter-btn {
            margin: 0 20px 24px 20px;
            width: calc(100% - 40px);
            background-color: var(--bg-yellow);
            box-shadow: 3px 3px 0 var(--ink);
        }

        .nav-section {
            padding: 0 20px;
            margin-bottom: 32px;
        }

        .nav-section-title {
            font-family: 'Space Mono';
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .nav-item {
            padding: 12px 14px;
            margin-bottom: 8px;
            border: 3px solid transparent;
            border-left: 3px solid var(--ink);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 14px;
        }

        .nav-item:hover {
            background-color: var(--bg-mint);
            border-left-color: var(--ink);
        }

        .nav-item.active {
            background-color: var(--bg-mint);
            border: 3px solid var(--ink);
            border-left: 3px solid var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
        }

        .count-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            height: 24px;
            background-color: var(--bg-yellow);
            border: 2px solid var(--ink);
            border-radius: 6px;
            font-family: 'Space Mono';
            font-size: 12px;
            font-weight: 700;
        }

        .tags-section .nav-section-title {
            margin-top: 20px;
        }

        .tag-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background-color: var(--bg-cream);
            border: 2px solid var(--ink);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            margin-right: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .tag-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .sidebar-bottom {
            margin-top: auto;
            padding: 20px;
            border-top: 3px solid var(--ink);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toggle-group {
            display: flex;
            gap: 8px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid var(--ink);
            background-color: var(--bg-cream);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background-color: var(--bg-yellow);
        }

        .sidebar-icons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: 2px solid var(--ink);
            background-color: var(--bg-cream);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 16px;
        }

        .icon-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 2px 2px 0 var(--ink);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--bg-pink), var(--bg-mint));
            border: 2px solid var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--ink);
        }

        /* ============ MAIN CONTENT AREA ============ */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
            overflow: hidden;
        }

        .top-bar {
            padding: 20px 24px;
            display: flex;
            gap: 16px;
            align-items: center;
            border-bottom: 3px solid var(--ink);
            background-color: var(--bg-main);
            flex-shrink: 0;
        }

        .search-container {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 3px solid var(--ink);
            background-color: var(--bg-cream);
            border-radius: 8px;
            font-family: 'Inter';
            font-size: 14px;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 4px 4px 0 var(--ink);
            transform: translate(-2px, -2px);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: var(--text-muted);
        }

        .top-bar-actions {
            display: flex;
            gap: 12px;
        }

        .filter-dropdown, .view-toggle, .selection-mode {
            padding: 12px 16px;
            border: 3px solid var(--ink);
            background-color: var(--bg-cream);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter';
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .filter-dropdown:hover, .view-toggle:hover, .selection-mode:hover {
            transform: translate(-2px, -2px);
            box-shadow: 3px 3px 0 var(--ink);
        }

        .bulk-actions-bar {
            display: none;
            position: fixed;
            top: 80px;
            left: 280px;
            right: 0;
            height: 60px;
            background-color: var(--bg-yellow);
            border: 3px solid var(--ink);
            border-bottom: 3px solid var(--ink);
            padding: 12px 24px;
            gap: 16px;
            align-items: center;
            z-index: 100;
            box-shadow: 6px 6px 0 var(--ink);
        }

        .bulk-actions-bar.active {
            display: flex;
        }

        .bulk-count {
            font-weight: 700;
            margin-right: 16px;
            border-right: 2px solid var(--ink);
            padding-right: 16px;
        }

        /* ============ NEWSLETTER CARDS ============ */
        /* --- LIST MODE (default) — clean monochrome --- */
        .newsletter-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-content: start;
        }

        .newsletter-card {
            background-color: var(--bg-cream);
            border: none;
            border-bottom: 1px solid rgba(26,26,26,0.08);
            border-radius: 0;
            padding: 14px 18px;
            box-shadow: none;
            transition: background 0.12s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        /* Unread accent — subtle yellow left border */
        .newsletter-card:not(.read) {
            border-left: 3px solid var(--yellow);
            padding-left: 15px;
        }

        .newsletter-card:hover {
            background-color: rgba(26,26,26,0.03);
            transform: none;
            box-shadow: none;
        }

        .newsletter-card.read {
            opacity: 0.55;
        }

        /* List mode: top row = sender + date + tags, then title, then summary excerpt */
        .newsletter-list .newsletter-card .newsletter-header {
            display: flex; align-items: center; gap: 8px; min-width: 0;
        }
        .newsletter-list .newsletter-card .newsletter-sender { font-size: 13px; font-weight: 700; }
        .newsletter-list .newsletter-card .newsletter-date { font-size: 12px; opacity: 0.5; }
        .newsletter-list .newsletter-card .newsletter-title {
            font-size: 15px; font-weight: 600; margin: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .newsletter-list .newsletter-card .newsletter-tags { flex: 0 0 auto; }
        .newsletter-list .newsletter-card .ai-summary-box {
            display: none;
        }
        .newsletter-list .newsletter-card .newsletter-actions {
            display: none;
        }
        .newsletter-list .newsletter-card .newsletter-badges {
            margin-left: auto;
        }

        /* --- CARD MODE (toggled via class) --- */
        .newsletter-list.card-mode {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            padding: 20px;
        }
        .newsletter-list.card-mode .newsletter-card {
            background-color: var(--bg-cream);
            border: 2px solid rgba(26,26,26,0.12);
            border-left: 2px solid rgba(26,26,26,0.12);
            border-radius: 14px;
            padding: 20px;
            gap: 12px;
            box-shadow: 2px 2px 0 rgba(26,26,26,0.06);
        }
        .newsletter-list.card-mode .newsletter-card:not(.read) {
            border-left: 3px solid var(--yellow);
        }
        .newsletter-list.card-mode .newsletter-card:hover {
            box-shadow: 4px 4px 0 rgba(26,26,26,0.08);
            transform: translate(-1px, -1px);
        }
        .newsletter-list.card-mode .newsletter-card .ai-summary-box {
            background: rgba(26,26,26,0.03); border-radius: 10px; padding: 12px;
            border: 1px solid rgba(26,26,26,0.06);
        }
        .newsletter-list.card-mode .newsletter-card .ai-summary-label { display: block; }
        .newsletter-list.card-mode .newsletter-card .ai-summary-text {
            -webkit-line-clamp: unset; display: block;
        }
        .newsletter-list.card-mode .newsletter-card .newsletter-title {
            white-space: normal; font-size: inherit;
        }
        .newsletter-list.card-mode .newsletter-card .newsletter-actions {
            display: flex; flex-direction: row;
        }
        .newsletter-list.card-mode .newsletter-card .newsletter-header { min-width: 0; }

        /* Selection checkbox */
        .select-checkbox {
            width: 20px; height: 20px; border: 2px solid var(--ink); border-radius: 6px;
            background: white; display: flex; align-items: center; justify-content: center;
            font-size: 13px; flex-shrink: 0; cursor: pointer;
        }
        .select-checkbox.checked { background: var(--yellow); }

        /* Active tag highlight */
        .tag-item.active-tag { background: var(--yellow); border-radius: 8px; font-weight: 700; }

        /* Collapsible summary toggle */
        .summary-toggle { width: 100%; }
        .summary-toggle-btn {
            display: flex; align-items: center; gap: 6px;
            background: none; border: none; cursor: pointer; padding: 4px 0;
            font-size: 12px; font-weight: 600; color: var(--text-muted);
            font-family: inherit;
        }
        .summary-toggle-btn:hover { color: var(--ink); }
        .summary-chevron {
            display: inline-block; transition: transform 0.15s; font-size: 11px;
        }
        .summary-chevron.open { transform: rotate(90deg); }
        .summary-toggle-label { letter-spacing: 0.02em; }
        .summary-toggle-body {
            padding: 10px 0 4px 2px;
            font-size: 13px; line-height: 1.55; color: var(--text-muted);
        }
        .summary-toggle-body ul {
            margin: 0; padding-left: 18px; list-style: disc;
        }
        .summary-toggle-body li {
            margin-bottom: 4px;
        }
        .summary-toggle-body p {
            margin: 0;
        }
        /* In card mode, summary toggle gets a subtle background */
        .card-mode .summary-toggle-body {
            background: rgba(26,26,26,0.03); border-radius: 10px;
            padding: 12px; border: 1px solid rgba(26,26,26,0.06);
        }

        .newsletter-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .newsletter-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .newsletter-sender {
            font-family: 'Space Mono';
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .newsletter-date {
            font-family: 'Space Mono';
            font-size: 12px;
            color: var(--text-muted);
        }

        .newsletter-badges {
            display: flex;
            gap: 8px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            border: 2px solid var(--ink);
            border-radius: 6px;
            font-family: 'Space Mono';
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-new {
            background-color: var(--red);
            color: var(--bg-yellow);
        }

        .newsletter-title {
            font-family: 'Bricolage Grotesque';
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
            word-break: break-word;
        }

        .newsletter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag-pill {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            background-color: rgba(255, 255, 255, 0.3);
            border: 2px solid var(--ink);
            border-radius: 6px;
            font-family: 'Space Mono';
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .ai-summary-box {
            background-color: rgba(255, 255, 255, 0.3);
            border: 2px solid var(--ink);
            padding: 16px;
            border-radius: 10px;
        }

        .ai-summary-label {
            font-family: 'Space Mono';
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ai-summary-text {
            font-size: 13px;
            line-height: 1.5;
            color: var(--ink);
        }

        .newsletter-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border: 2px solid var(--ink);
            background-color: var(--bg-cream);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 2px 2px 0 var(--ink);
        }

        .action-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 0 0 0 var(--ink);
        }

        .action-menu {
            position: relative;
        }

        .action-menu-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background-color: var(--bg-cream);
            border: 3px solid var(--ink);
            border-radius: 8px;
            box-shadow: 4px 4px 0 var(--ink);
            min-width: 180px;
            z-index: 200;
            display: none;
        }

        .action-menu-dropdown.active {
            display: block;
        }

        .action-menu-item {
            padding: 12px 16px;

        // Normalize a newsletter row from the API (snake_case) into the
        // shape the UI expects (camelCase + friendly date).
        function normalizeNewsletter(n) {
            const raw = n.date_added || n.created_at || null;
            let date = '';
            if (raw) {
                const d = new Date(raw);
                const diffMs = Date.now() - d.getTime();
                const mins = Math.round(diffMs / 60000);
                const hrs = Math.round(diffMs / 3600000);
                const days = Math.round(diffMs / 86400000);
                if (mins < 60) date = mins + 'm ago';
                else if (hrs < 24) date = hrs + 'h ago';
                else if (days < 30) date = days + 'd ago';
                else date = d.toLocaleDateString();
            }
            return {
                id: n.id,
                sender: n.sender || '',
                title: n.title || '',
                date,
                tags: Array.isArray(n.tags) ? n.tags.map(t => typeof t === 'string' ? t : (t && t.name) || '').filter(Boolean) : [],
                summary: n.summary || '',
                content: n.content || '',
                url: n.url || null,
                isRead: !!n.is_read,
                isUnread: !n.is_read,
            };
        }

        // Format an AI summary: strip markdown bold/italic asterisks,
        // split into bullet points on sentence boundaries or existing line breaks.
        function formatSummaryHTML(raw) {
            if (!raw) return '';
            let s = raw
                .replace(/\*\*([^*]+)\*\*/g, '$1')   // **bold** → plain
                .replace(/\*([^*]+)\*/g, '$1')         // *italic* → plain
                .replace(/__([^_]+)__/g, '$1')         // __bold__ → plain
                .replace(/_([^_]+)_/g, '$1')           // _italic_ → plain
                .trim();
            // Split into bullet points: on existing newlines, or on ". " followed by uppercase
            let parts = s.split(/\n+/).map(l => l.trim()).filter(Boolean);
            if (parts.length <= 1) {
                // Try splitting on sentence boundaries for long single-line summaries
                parts = s.split(/(?<=\.)\s+(?=[A-Z])/).filter(p => p.trim().length > 10);
            }
            if (parts.length <= 1) return '<p>' + s + '</p>';
            return '<ul>' + parts.map(p => '<li>' + p.replace(/^[-•]\s*/, '') + '</li>').join('') + '</ul>';
        }

        // Collapsible summary toggle component
        function SummaryToggle({ summary }) {
            const [open, setOpen] = useState(false);
            if (!summary) return null;
            return (
                <div className="summary-toggle" onClick={(e) => e.stopPropagation()}>
                    <button
                        className="summary-toggle-btn"

                        <span className={`summary-chevron ${open ? 'open' : ''}`}>▸</span>
                        <span className="summary-toggle-label">✦ AI Summary</span>
                    </button>
                    {open && (
                        <div
                            className="summary-toggle-body"
                            dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(formatSummaryHTML(summary)) }}
                        />
                    )}
                </div>
            );
        }

                                    <div
                                        className="reader-text"
                                        dangerouslySetInnerHTML={{
                                            __html: DOMPurify.sanitize(selectedNewsletter.content)
                                        }}
                                    />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* IMPORT MODAL */}
                    {activeModal === 'import' && (
                        <div className="modal-overlay active" onClick={() => setActiveModal(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <button className="modal-close-btn" onClick={() => setActiveModal(null)}>✕</button>
                                <h2 className="modal-title">{t('importNewsletter')}</h2>

                                <div className="modal-tabs">
                                    <button className="modal-tab active">URL</button>
                                    <button className="modal-tab">PDF</button>
                                    <button className="modal-tab">{t('manual')}</button>
                                </div>

                                <form className="modal-form" onSubmit={(e) => { e.preventDefault(); setActiveModal(null); }}>
                                    <div className="form-group">
                                        <label className="form-label">{t('url')}</label>
                                        <input type="url" className="form-input" placeholder="https://..." required />
                                    </div>
                                    <button type="submit" className="btn btn-primary">Import</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* KNOWLEDGE GRAPH MODAL */}
                    {activeModal === 'graph' && (
                        <div className="modal-overlay active" onClick={() => setActiveModal(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '1000px', maxHeight: '90vh' }}>
                                <button className="modal-close-btn" onClick={() => setActiveModal(null)}>✕</button>
                                <h2 className="modal-title">{t('knowledgeGraph')}</h2>

                                <div className="modal-tabs">
                                    <button className="modal-tab active">Browse</button>
                                    <button className="modal-tab">Query</button>
                                </div>

                                <div className="graph-container" style={{ height: '400px', background: 'linear-gradient(135deg, var(--bg-cream), var(--bg-blue))', border: '3px solid var(--ink)', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                    <div style={{ textAlign: 'center', color: 'var(--text-muted)' }}>
                                        <div style={{ fontSize: '48px', marginBottom: '12px' }}>🕸️</div>
                                        <div style={{ fontSize: '16px', fontWeight: 600, marginBottom: '8px' }}>Knowledge Graph is building</div>
                                        <div style={{ fontSize: '13px', maxWidth: '300px' }}>Your graph grows automatically as Brevis processes newsletters. Keep reading — connections will appear here soon.</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* KB MODAL */}
                    {activeModal === 'kb' && (
                        <div className="modal-overlay active" onClick={() => setActiveModal(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '900px' }}>
                                <button className="modal-close-btn" onClick={() => setActiveModal(null)}>✕</button>
                                <h2 className="modal-title">{t('knowledgeBases')}</h2>

                                <div style={{ padding: '40px', textAlign: 'center', color: 'var(--text-muted)' }}>
                                    <div style={{ fontSize: '48px', marginBottom: '12px' }}>📚</div>
                                    <div style={{ fontSize: '16px', fontWeight: 600, marginBottom: '8px' }}>No Knowledge Bases yet</div>
                                    <div style={{ fontSize: '13px' }}>Knowledge bases are auto-created from your newsletters as you read. The more you use Brevis, the smarter it gets.</div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* UPGRADE PLAN MODAL */}
                    {activeModal === 'upgrade' && (
                        <div className="modal-overlay active" onClick={() => setActiveModal(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <button className="modal-close-btn" onClick={() => setActiveModal(null)}>✕</button>
                                <h2 className="modal-title">{t('upgradePlan')}</h2>

                                <div className="plan-cards">
                                    {[
                                        { id: 'free', name: 'Free', price: '$0', features: ['5 newsletters', 'Basic summaries'] },
                                        { id: 'standard', name: 'Standard', price: '$12/mo', features: ['Unlimited newsletters', 'AI summaries', 'Tags & folders'] },
                                        { id: 'premium', name: 'Premium', price: '$29/mo', features: ['Everything in Standard', 'Knowledge Graph', 'Custom AI rules'] },
                                    ].map((plan) => {
                                        const isCurrent = user && user.plan && user.plan.toLowerCase() === plan.id;
                                        return (
                                            <div key={plan.name} className="upgrade-plan-card" style={isCurrent ? { border: '3px solid var(--yellow)', boxShadow: '5px 5px 0 var(--yellow)' } : {}}>
                                                <h4 className="plan-card-name">{plan.name}</h4>
                                                <div className="plan-card-price">{plan.price}</div>
                                                <div className="plan-features">
                                                    {plan.features.map((feature) => (
                                                        <div key={feature} className="feature-item">
                                                            <span className="feature-check">✓</span>
                                                            <span>{feature}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                                {isCurrent ? (
                                                    <button
                                                        className="btn"
                                                        style={{ marginTop: '16px', width: '100%' }}
                                                        onClick={async () => {
                                                            try {
                                                                const res = await fetch('/api/stripe/portal', { method: 'POST', credentials: 'include' });
                                                                const data = await res.json();
                                                                if (data.url) window.location.href = data.url;
                                                                else alert(data.error || 'Could not open billing portal');
                                                            } catch (e) { alert('Error: ' + e.message); }
                                                        }}
                                                    >
                                                        Manage Plan
                                                    </button>
                                                ) : plan.id === 'free' ? (
                                                    <div style={{ marginTop: '16px', textAlign: 'center', fontSize: '13px', color: 'var(--text-muted)' }}>Free forever</div>
                                                ) : (
                                                    <button
                                                        className="btn btn-primary"
                                                        style={{ marginTop: '16px', width: '100%' }}
                                                        onClick={async () => {
                                                            try {
                                                                const res = await fetch('/api/stripe/checkout', {
                                                                    method: 'POST',
                                                                    headers: { 'Content-Type': 'application/json' },
                                                                    credentials: 'include',
                                                                    body: JSON.stringify({ plan: plan.id, interval: 'month' }),
                                                                });
                                                                const data = await res.json();
                                                                if (data.url) window.location.href = data.url;
                                                                else alert(data.error || 'Could not start checkout');
                                                            } catch (e) { alert('Error: ' + e.message); }
                                                        }}
                                                    >
                                                        {t('upgrade') || 'Upgrade'}
                                                    </button>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SETTINGS MODAL */}
                    {activeModal === 'settings' && (
                        <div className="modal-overlay active" onClick={() => setActiveModal(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <button className="modal-close-btn" onClick={() => setActiveModal(null)}>✕</button>
                                <h2 className="modal-title">{t('profileSettings')}</h2>

                                <form className="modal-form" onSubmit={async (e) => {
                                    e.preventDefault();
                                    // Could wire to PUT /api/auth/profile if it exists
                                    setActiveModal(null);
                                }}>
                                    <div className="form-group">
                                        <label className="form-label">{t('name')}</label>
                                        <input type="text" className="form-input" defaultValue={(user && user.name) || ''} />
                                    </div>

                                    <div className="form-group">
                                        <label className="form-label">{t('email')}</label>
                                        <input type="email" className="form-input" defaultValue={(user && user.email) || ''} readOnly style={{ opacity: 0.7 }} />
                                    </div>

                                    {user && user.email_code && (
                                        <div className="form-group">
                                            <label className="form-label">Your forwarding address</label>
                                            <div className="form-input" style={{ background: 'var(--yellow)', fontFamily: "'Space Mono', monospace", fontSize: '13px', cursor: 'pointer' }}
                                                 onClick={() => { navigator.clipboard.writeText(user.email_code + '@newsletters.brevisapp.com'); alert('Copied!'); }}>
                                                {user.email_code}@newsletters.brevisapp.com
                                            </div>
                                            <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginTop: '4px' }}>Click to copy. Forward any newsletter here to add it to Brevis.</div>
                                        </div>
                                    )}

                                    <div className="form-group">
                                        <label className="form-label">{t('kindleEmail')}</label>
                                        <input type="email" className="form-input" defaultValue={(user && user.kindle_email) || ''} placeholder="your-name@kindle.com" />
                                    </div>

                                    <div className="form-group">
                                        <label className="form-label">{t('language')}</label>
                                        <select className="form-input" value={language} onChange={(e) => setLanguage(e.target.value)}>
                                            <option value="en">English</option>
                                            <option value="es">Español</option>
                                        </select>
                                    </div>

                                    <div className="form-group">
                                        <label className="form-label">Plan</label>
                                        <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                                            <div className="plan-badge" style={{ margin: 0 }}>{(user && user.plan) ? user.plan.toUpperCase() : 'FREE'}</div>
                                            <button type="button" className="btn" onClick={() => setActiveModal('upgrade')} style={{ fontSize: '12px' }}>
                                                Change Plan
                                            </button>
                                        </div>
                                    </div>

                                    <button type="submit" className="btn btn-primary">
                                        {t('save') || 'Save'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* FILTER MODAL */}
                    {activeModal === 'filter' && (
                        <div className="modal-overlay active" onClick={() => setActiveModal(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <button className="modal-close-btn" onClick={() => setActiveModal(null)}>✕</button>
                                <h2 className="modal-title">Filter Options</h2>

                                <form className="modal-form">
                                    <div className="form-group">
                                        <label className="form-label">By Tags</label>
                                        {tags.map(tag => (
                                            <label key={tag.name} style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '8px', cursor: 'pointer' }}>
                                                <input
                                                    type="checkbox"
                                                    checked={filterTags.includes(tag.name)}
                                                    onChange={() => setFilterTags(prev =>
                                                        prev.includes(tag.name)
                                                            ? prev.filter(t => t !== tag.name)
                                                            : [...prev, tag.name]
                                                    )}
                                                />
                                                <div className="tag-dot" style={{ backgroundColor: tag.color, width: '10px', height: '10px' }}></div>
                                                {tag.name}
                                            </label>
                                        ))}
                                    </div>

                                    <div style={{ display: 'flex', gap: '8px' }}>
                                        <button type="button" className="btn btn-primary" onClick={() => setActiveModal(null)} style={{ flex: 1 }}>
                                            Apply Filters
                                        </button>
                                        {filterTags.length > 0 && (
                                            <button type="button" className="btn" onClick={() => { setFilterTags([]); setActiveModal(null); }}>
                                                Clear
                                            </button>
                                        )}
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </>
            );
        }

        // ERROR BOUNDARY — catches any crash in the component tree so the
        // user sees something instead of a blank page, and logs to console.
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { err: null, info: null };
            }
            static getDerivedStateFromError(err) { return { err }; }
            componentDidCatch(err, info) {
                console.error('[brevis] crash caught by ErrorBoundary:', err);
                console.error('[brevis] component stack:', info && info.componentStack);
                this.setState({ info });
            }
            render() {
                if (this.state.err) {
                    return (
                        <div style={{
                            minHeight: '100vh',
                            padding: '40px 24px',
                            background: '#FFE5D4',
                            fontFamily: "'Inter', system-ui, sans-serif",
                            color: '#1A1A1A'
                        }}>
                            <div style={{ maxWidth: '640px', margin: '0 auto' }}>
                                <div style={{
                                    fontFamily: "'Bricolage Grotesque', 'Inter', system-ui, sans-serif",
                                    fontWeight: 800,
                                    fontSize: '48px',
                                    letterSpacing: '-0.03em',
                                    marginBottom: '8px'
                                }}>brv.</div>
                                <div style={{ fontSize: '20px', fontWeight: 700, marginBottom: '16px' }}>
                                    Something crashed while loading the app.
                                </div>
                                <div style={{
                                    background: '#FFCED1',
                                    border: '3px solid #1A1A1A',
                                    borderRadius: '12px',
                                    padding: '16px',
                                    fontSize: '13px',
                                    fontFamily: "'Space Mono', ui-monospace, monospace",
                                    whiteSpace: 'pre-wrap',
                                    wordBreak: 'break-word',
                                    marginBottom: '16px'
                                }}>
                                    {String(this.state.err && this.state.err.message || this.state.err)}
                                </div>
                                <button
                                    onClick={() => window.location.reload()}
                                    style={{
                                        background: '#FFD23F',
                                        border: '3px solid #1A1A1A',
                                        borderRadius: '12px',
                                        padding: '12px 24px',
                                        fontSize: '14px',
                                        fontWeight: 700,
                                        cursor: 'pointer',
                                        boxShadow: '4px 4px 0 #1A1A1A',
                                        marginRight: '12px'
                                    }}
                                >Reload</button>
                                <a href="/" style={{
                                    display: 'inline-block',
                                    padding: '12px 24px',
                                    border: '3px solid #1A1A1A',
                                    borderRadius: '12px',
                                    textDecoration: 'none',
                                    color: '#1A1A1A',
                                    fontWeight: 700
                                }}>Back to site</a>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // RENDER
        function Root() {
            // null = checking, false = show auth, true = show app
            const [isLoggedIn, setIsLoggedIn] = useState(null);
            const [authError, setAuthError] = useState(null);

            useEffect(() => {
                console.log('[brevis] Root mounted, checking /api/auth/me...');
                fetch('/api/auth/me', { credentials: 'include' })
                    .then(res => {
                        console.log('[brevis] /api/auth/me status:', res.status);
                        setIsLoggedIn(res.ok);
                    })
                    .catch(err => {
                        console.error('[brevis] /api/auth/me failed:', err);
                        setAuthError(err.message);
                        setIsLoggedIn(false);
                    });
            }, []);

            if (isLoggedIn === null) {
                return (
                    <div style={{
                        minHeight: '100vh',
                        display: 'flex',
                        flexDirection: 'column',
                        alignItems: 'center',
                        justifyContent: 'center',
                        gap: '12px',
                        background: '#FFE5D4',
                        fontFamily: "'Bricolage Grotesque', 'Inter', system-ui, sans-serif",
                        color: '#1A1A1A'
                    }}>
                        <div style={{ fontWeight: 800, fontSize: '48px', letterSpacing: '-0.03em' }}>brv.</div>
                        <div style={{ fontSize: '14px', fontWeight: 500, opacity: 0.6 }}>loading…</div>
                    </div>
                );
            }

            return isLoggedIn
                ? <App />
                : <AuthView onSuccess={() => setIsLoggedIn(true)} />;
        }

        const rootEl = document.getElementById('app');
        if (!rootEl) {
            document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif">Mount point #app missing.</div>';
        } else {
            try {
                const root = ReactDOM.createRoot(rootEl);
                root.render(<ErrorBoundary><Root /></ErrorBoundary>);
                console.log('[brevis] React mounted');
            } catch (e) {
                console.error('[brevis] React mount failed:', e);
                // Use textContent (not innerHTML) for error message to prevent XSS
                // if e.message contains attacker-controlled HTML.
                rootEl.innerHTML = '<div style="padding:40px;font-family:sans-serif;background:#FFE5D4;min-height:100vh"><h1>brv.</h1><p></p></div>';
                const msgEl = rootEl.querySelector('p');
                if (msgEl) msgEl.textContent = 'React failed to mount: ' + (e && e.message ? e.message : 'unknown error');
            }
        }
    </script>
</body>
</html>
