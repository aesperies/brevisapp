            }[language];

            const handleCreateProject = () => {
                if (!newProjectName.trim()) return;
                createProject(newProjectName.trim());
                setNewProjectName('');
                setShowNewProjectInput(false);
            };

            const handleAddTemplate = () => {
                if (!newTemplateName.trim() || !newTemplateContent.trim() || !editingProject) return;
                const newTemplate = {
                    id: Date.now(),
                    name: newTemplateName.trim(),
                    content: newTemplateContent.trim()
                };
                updateProject(editingProject.id, {
                    templates: [...editingProject.templates, newTemplate]
                });
                setEditingProject({...editingProject, templates: [...editingProject.templates, newTemplate]});
                setNewTemplateName('');
                setNewTemplateContent('');
                setShowTemplateForm(false);
            };

            const handleUpdateTemplate = () => {
                if (!editingTemplate || !newTemplateName.trim() || !newTemplateContent.trim()) return;
                const updatedTemplates = editingProject.templates.map(t =>
                    t.id === editingTemplate.id ? {...t, name: newTemplateName, content: newTemplateContent} : t
                );
                updateProject(editingProject.id, { templates: updatedTemplates });
                setEditingProject({...editingProject, templates: updatedTemplates});
                setEditingTemplate(null);
                setNewTemplateName('');
                setNewTemplateContent('');
                setShowTemplateForm(false);
            };

            const handleDeleteTemplate = (templateId) => {
                const updatedTemplates = editingProject.templates.filter(t => t.id !== templateId);
                updateProject(editingProject.id, { templates: updatedTemplates });
                setEditingProject({...editingProject, templates: updatedTemplates});
            };

            const handleToggleReport = (reportId) => {
                const current = editingProject.attachedReports || [];
                const updated = current.includes(reportId)
                    ? current.filter(id => id !== reportId)
                    : [...current, reportId];
                updateProject(editingProject.id, { attachedReports: updated });
                setEditingProject({...editingProject, attachedReports: updated});
            };

            const handleAddLink = () => {
                if (!newLinkUrl.trim() || !editingProject) return;
                const newLink = {
                    id: Date.now(),
                    url: newLinkUrl.trim(),
                    title: newLinkTitle.trim() || newLinkUrl.trim()
                };
                const updatedLinks = [...(editingProject.attachedLinks || []), newLink];
                updateProject(editingProject.id, { attachedLinks: updatedLinks });
                setEditingProject({...editingProject, attachedLinks: updatedLinks});
                setNewLinkUrl('');
                setNewLinkTitle('');
            };

            const handleDeleteLink = (linkId) => {
                const updatedLinks = editingProject.attachedLinks.filter(l => l.id !== linkId);
                updateProject(editingProject.id, { attachedLinks: updatedLinks });
                setEditingProject({...editingProject, attachedLinks: updatedLinks});
            };

            const handleFileUpload = async (files) => {
                if (!files?.length || !editingProject) return;
                setUploadingFile(true);
                try {
                    const newFiles = [];
                    for (const file of files) {
                        const formData = new FormData();
                        formData.append('file', file);
                        const res = await fetch(`${API_URL}/news-builder/upload-file`, {
                            method: 'POST',
                            credentials: 'include',
                            body: formData
                        });
                        const data = await res.json();
                        if (res.ok) {
                            newFiles.push({
                                id: Date.now() + Math.random(),
                                name: data.name || file.name,
                                content: data.content,
                                type: file.type
                            });
                        } else {
                            showToast(data.error || `Error: ${file.name}`, 'error');
                        }
                    }
                    if (newFiles.length > 0) {
                        const updatedFiles = [...(editingProject.attachedFiles || []), ...newFiles];
                        updateProject(editingProject.id, { attachedFiles: updatedFiles });
                        setEditingProject({...editingProject, attachedFiles: updatedFiles});
                        showToast(language === 'es' ? `${newFiles.length} archivo(s) adjuntado(s)` : `${newFiles.length} file(s) attached`);
                    }
                } catch (err) {
                    console.error(err);
                    showToast(language === 'es' ? 'Error al subir archivo' : 'Error uploading file', 'error');
                } finally {
                    setUploadingFile(false);
                    if (fileInputRef.current) fileInputRef.current.value = '';
                }
            };

            const handleDeleteFile = (fileId) => {
                const updatedFiles = (editingProject.attachedFiles || []).filter(f => f.id !== fileId);
                updateProject(editingProject.id, { attachedFiles: updatedFiles });
                setEditingProject({...editingProject, attachedFiles: updatedFiles});
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setDragOver(false);
                const files = Array.from(e.dataTransfer.files);
                handleFileUpload(files);
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setDragOver(true);
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                setDragOver(false);
            };

            const handleWordUpload = async (e) => {
                const file = e.target.files?.[0];
                if (!file || !editingProject) return;

                setUploadingWord(true);
                try {
                    const formData = new FormData();
                    formData.append('file', file);

                    const res = await fetch(`${API_URL}/news-builder/upload-word`, {
                        method: 'POST',
                        credentials: 'include',
                        body: formData
                    });
                    const data = await res.json();
                    if (res.ok && data.content) {
                        const newTemplate = {
                            id: Date.now(),
                            name: data.name || file.name.replace(/\.(docx?|doc)$/i, ''),
                            content: data.content
                        };
                        updateProject(editingProject.id, {
                            templates: [...editingProject.templates, newTemplate]
                        });
                        setEditingProject({...editingProject, templates: [...editingProject.templates, newTemplate]});
                        showToast(language === 'es' ? 'Plantilla agregada desde Word' : 'Template added from Word');
                    } else {
                        showToast(data.error || 'Error', 'error');
                    }
                } catch (err) {
                    console.error(err);
                    showToast(language === 'es' ? 'Error al procesar archivo' : 'Error processing file', 'error');
                } finally {
                    setUploadingWord(false);
                    if (wordInputRef.current) wordInputRef.current.value = '';
                }
            };

            const handleGenerateFromProject = async () => {
                if (!selectedTemplateForGenerate || !editingProject) return;
                const selectedTemplate = editingProject.templates.find(t => t.id === selectedTemplateForGenerate);
                if (!selectedTemplate) return;

                const reportContents = (editingProject.attachedReports || [])
                    .map(id => savedReports.find(r => r.id === id))
                    .filter(Boolean)
                    .map(r => ({ name: r.name, content: r.content }));

                const fileContents = (editingProject.attachedFiles || [])
                    .map(f => ({ name: f.name, content: f.content }));

                const urls = (editingProject.attachedLinks || []).map(l => l.url);

                setGenerating(true);
                try {
                    const res = await fetch(`${API_URL}/news-builder/generate-from-project`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({
                            template: selectedTemplate.content,
                            reportContents: [...reportContents, ...fileContents],
                            urls
                        })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setGeneratedContent(data.content);
                        showToast(txt.generated);
                    } else {
                        showToast(data.error || (language === 'es' ? 'Error al generar' : 'Failed to generate'), 'error');
                    }
                } catch (e) {
                    console.error(e);
                    showToast(language === 'es' ? 'Error al generar' : 'Failed to generate', 'error');
                } finally {
                    setGenerating(false);
                }
            };

            const handleGenerateFromTemplate = async () => {
                if (!template.trim() || selectedReports.length === 0) return;
                setGenerating(true);
                try {
                    const res = await fetch(`${API_URL}/news-builder/generate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ template, reportIds: selectedReports })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setGeneratedContent(data.content);
                        showToast(txt.generated);
                    }
                } catch (e) {
                    console.error(e);
                } finally {
                    setGenerating(false);
                }
            };

            // Project editing view
            if (editingProject) {
                return (
                    <div className="modal-overlay" onClick={onClose}>
                        <div className="modal" style={{maxWidth: 750, maxHeight: '90vh'}} onClick={e => e.stopPropagation()}>
                            <div className="modal-header">
                                <div style={{display: 'flex', alignItems: 'center', gap: 12}}>
                                    <button className="btn btn-small" onClick={() => { setEditingProject(null); setGeneratedContent(''); }}>
                                        {txt.back}
                                    </button>
                                    <h2 style={{margin: 0}}>{editingProject.name}</h2>
                                </div>
                                <button className="modal-close" onClick={onClose}><LucideIcon name="x" size={20} /></button>
                            </div>
                            <div className="modal-body" style={{padding: 16, overflowY: 'auto', maxHeight: 'calc(90vh - 120px)'}}>
                                {/* Templates Section */}
                                <div style={{marginBottom: 24}}>
                                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12}}>
                                        <h3 style={{margin: 0, fontSize: 16}}>{txt.templates}</h3>
                                        <div style={{display: 'flex', gap: 8}}>
                                            <input
                                                type="file"
                                                ref={wordInputRef}
                                                accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                                                style={{display: 'none'}}
                                                onChange={handleWordUpload}
                                            />
                                            <button className="btn btn-small" onClick={() => wordInputRef.current?.click()} disabled={uploadingWord}>
                                                <LucideIcon name="upload" size={14} style={{marginRight: 4}} />
                                                {uploadingWord ? txt.uploadingWord : txt.uploadWord}
                                            </button>
                                            <button className="btn btn-small" onClick={() => { setShowTemplateForm(true); setEditingTemplate(null); setNewTemplateName(''); setNewTemplateContent(''); }}>
                                                {txt.addTemplate}
                                            </button>
                                        </div>
                                    </div>
                                    {showTemplateForm && (
                                        <div style={{background: 'var(--bg-secondary)', padding: 12, borderRadius: 8, marginBottom: 12}}>
                                            <input
                                                className="form-input"
                                                placeholder={txt.templateName}
                                                value={newTemplateName}
                                                onChange={e => setNewTemplateName(e.target.value)}
                                                style={{marginBottom: 8}}
                                            />
                                            <textarea
                                                className="form-textarea"
                                                placeholder={txt.templateContent}
                                                value={newTemplateContent}
                                                onChange={e => setNewTemplateContent(e.target.value)}
                                                style={{minHeight: 100, marginBottom: 8}}
                                            />
                                            <div style={{display: 'flex', gap: 8}}>
                                                <button className="btn btn-primary btn-small" onClick={editingTemplate ? handleUpdateTemplate : handleAddTemplate}>
                                                    {txt.save}
                                                </button>
                                                <button className="btn btn-small" onClick={() => { setShowTemplateForm(false); setEditingTemplate(null); }}>
                                                    {txt.cancel}
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                    {editingProject.templates.length === 0 ? (
                                        <p style={{color: 'var(--text-secondary)', fontSize: 14}}>{txt.noTemplates}</p>
                                    ) : (
                                        editingProject.templates.map(t => (
                                            <div key={t.id} style={{display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px', background: selectedTemplateForGenerate === t.id ? 'var(--accent-light)' : 'var(--bg-secondary)', borderRadius: 6, marginBottom: 6, cursor: 'pointer', border: selectedTemplateForGenerate === t.id ? '2px solid var(--accent)' : '2px solid transparent'}}
                                                onClick={() => setSelectedTemplateForGenerate(t.id)}>
                                                <LucideIcon name="file-text" size={16} />
                                                <span style={{flex: 1}}>{t.name}</span>
                                                <button className="btn btn-small" onClick={(e) => { e.stopPropagation(); setEditingTemplate(t); setNewTemplateName(t.name); setNewTemplateContent(t.content); setShowTemplateForm(true); }}>
                                                    {txt.edit}
                                                </button>
                                                <button className="btn btn-small" onClick={(e) => { e.stopPropagation(); handleDeleteTemplate(t.id); }}>
                                                    {txt.delete}
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {/* Attached Reports Section */}
                                <div style={{marginBottom: 24}}>
                                    <h3 style={{margin: '0 0 12px', fontSize: 16}}>{txt.attachedReports}</h3>
                                    {savedReports.length === 0 ? (
                                        <p style={{color: 'var(--text-secondary)', fontSize: 14}}>{txt.noSavedReports}</p>
                                    ) : (
                                        <div style={{display: 'flex', flexWrap: 'wrap', gap: 8}}>
                                            {savedReports.map(r => (
                                                <div key={r.id}
                                                    style={{padding: '6px 12px', background: (editingProject.attachedReports || []).includes(r.id) ? 'var(--accent)' : 'var(--bg-secondary)', color: (editingProject.attachedReports || []).includes(r.id) ? 'white' : 'var(--text-primary)', borderRadius: 20, cursor: 'pointer', fontSize: 13}}
                                                    onClick={() => handleToggleReport(r.id)}>
                                                    {r.name}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* Attached Files Section */}
                                <div style={{marginBottom: 24}}>
                                    <h3 style={{margin: '0 0 12px', fontSize: 16}}>{txt.attachedFiles}</h3>
                                    <div
                                        onDrop={handleDrop}
                                        onDragOver={handleDragOver}
                                        onDragLeave={handleDragLeave}
                                        onClick={() => fileInputRef.current?.click()}
                                        style={{
                                            border: `2px dashed ${dragOver ? 'var(--accent)' : 'var(--border-color)'}`,
                                            borderRadius: 8,
                                            padding: '20px',
                                            textAlign: 'center',
                                            cursor: 'pointer',
                                            background: dragOver ? 'var(--accent-light)' : 'var(--bg-secondary)',
                                            transition: 'all 0.2s',
                                            marginBottom: 12
                                        }}>
                                        <input
                                            ref={fileInputRef}
                                            type="file"
                                            multiple
                                            accept=".pdf,.doc,.docx,.txt,.md,.jpg,.jpeg,.png,.gif"
                                            onChange={(e) => handleFileUpload(Array.from(e.target.files))}
                                            style={{display: 'none'}}
                                        />
                                        <LucideIcon name="upload" size={24} style={{marginBottom: 8, color: 'var(--text-secondary)'}} />
                                        <p style={{margin: 0, fontSize: 13, color: 'var(--text-secondary)'}}>
                                            {uploadingFile ? txt.uploading : txt.dropFiles}
                                        </p>
                                    </div>
                                    {(editingProject.attachedFiles || []).map(file => (
                                        <div key={file.id} style={{display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px', background: 'var(--bg-secondary)', borderRadius: 6, marginBottom: 6}}>
                                            <LucideIcon name="file" size={14} />
                                            <span style={{flex: 1, fontSize: 13, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>{file.name}</span>
                                            <button className="btn btn-small" onClick={() => handleDeleteFile(file.id)}><LucideIcon name="x" size={14} /></button>
                                        </div>
                                    ))}
                                </div>

                                {/* Attached Links Section */}
                                <div style={{marginBottom: 24}}>
                                    <h3 style={{margin: '0 0 12px', fontSize: 16}}>{txt.attachedLinks}</h3>
                                    <div style={{display: 'flex', gap: 8, marginBottom: 12}}>
                                        <input
                                            className="form-input"
                                            placeholder={txt.linkUrl}
                                            value={newLinkUrl}
                                            onChange={e => setNewLinkUrl(e.target.value)}
                                            style={{flex: 2}}
                                        />
                                        <input
                                            className="form-input"
                                            placeholder={txt.linkTitle}
                                            value={newLinkTitle}
                                            onChange={e => setNewLinkTitle(e.target.value)}
                                            style={{flex: 1}}
                                        />
                                        <button className="btn btn-primary btn-small" onClick={handleAddLink}>{txt.add}</button>
                                    </div>
                                    {(editingProject.attachedLinks || []).map(link => (
                                        <div key={link.id} style={{display: 'flex', alignItems: 'center', gap: 8, padding: '8px 12px', background: 'var(--bg-secondary)', borderRadius: 6, marginBottom: 6}}>
                                            <LucideIcon name="link" size={14} />
                                            <span style={{flex: 1, fontSize: 13, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>{link.title}</span>
                                            <button className="btn btn-small" onClick={() => handleDeleteLink(link.id)}><LucideIcon name="x" size={14} /></button>
                                        </div>
                                    ))}
                                </div>

                                {/* Generate Button */}
                                <div style={{borderTop: '1px solid var(--border-color)', paddingTop: 16}}>
                                    {!selectedTemplateForGenerate && editingProject.templates.length > 0 && (
                                        <p style={{color: 'var(--text-secondary)', fontSize: 13, marginBottom: 12}}>{txt.selectTemplate}</p>
                                    )}
                                    <button
                                        className="btn btn-primary"
                                        onClick={handleGenerateFromProject}
                                        disabled={generating || !selectedTemplateForGenerate}
                                        style={{width: '100%'}}>
                                        {generating ? txt.generating : txt.generate}
                                    </button>
                                </div>

                                {/* Generated Content */}
                                {generatedContent && (
                                    <div style={{marginTop: 16, padding: 16, background: 'var(--bg-secondary)', borderRadius: 8, maxHeight: 300, overflowY: 'auto'}}>
                                        <div dangerouslySetInnerHTML={{__html: DOMPurify.sanitize(generatedContent)}} />
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" style={{maxWidth: 700, maxHeight: '85vh'}} onClick={e => e.stopPropagation()}>
                        <div className="modal-header">
                            <h2>{language === 'es' ? 'News Builder' : 'News Builder'}</h2>
                            <button className="modal-close" onClick={onClose}><LucideIcon name="x" size={20} /></button>
                        </div>
                        <div className="modal-body" style={{padding: 0}}>
                            <div style={{display: 'flex', borderBottom: '1px solid var(--border-color)'}}>
                                <button
                                    style={{flex: 1, padding: '12px', background: activeTab === 'projects' ? 'var(--bg-secondary)' : 'transparent', border: 'none', cursor: 'pointer', color: 'var(--text-primary)', fontWeight: activeTab === 'projects' ? 600 : 400}}
                                    onClick={() => setActiveTab('projects')}>
                                    {txt.projects}
                                </button>
                                <button
                                    style={{flex: 1, padding: '12px', background: activeTab === 'reports' ? 'var(--bg-secondary)' : 'transparent', border: 'none', cursor: 'pointer', color: 'var(--text-primary)', fontWeight: activeTab === 'reports' ? 600 : 400}}
                                    onClick={() => setActiveTab('reports')}>
                                    {txt.savedReports}
                                </button>
                                <button
                                    style={{flex: 1, padding: '12px', background: activeTab === 'template' ? 'var(--bg-secondary)' : 'transparent', border: 'none', cursor: 'pointer', color: 'var(--text-primary)', fontWeight: activeTab === 'template' ? 600 : 400}}
                                    onClick={() => setActiveTab('template')}>
                                    {txt.createFromTemplate}
                                </button>
                            </div>

                            {activeTab === 'projects' && (
                                <div style={{padding: 16}}>
                                    <div style={{marginBottom: 16}}>
                                        {showNewProjectInput ? (
                                            <div style={{display: 'flex', gap: 8}}>
                                                <input
                                                    className="form-input"
                                                    placeholder={txt.projectName}
                                                    value={newProjectName}
                                                    onChange={e => setNewProjectName(e.target.value)}
                                                    onKeyDown={e => e.key === 'Enter' && handleCreateProject()}
                                                    autoFocus
                                                    style={{flex: 1}}
                                                />
                                                <button className="btn btn-primary btn-small" onClick={handleCreateProject}>{txt.create}</button>
                                                <button className="btn btn-small" onClick={() => { setShowNewProjectInput(false); setNewProjectName(''); }}>{txt.cancel}</button>
                                            </div>
                                        ) : (
                                            <button className="btn btn-primary" onClick={() => setShowNewProjectInput(true)}>
                                                {txt.newProject}
                                            </button>
                                        )}
                                    </div>
                                    <div style={{maxHeight: 350, overflowY: 'auto'}}>
                                        {projects.length === 0 ? (
                                            <p style={{color: 'var(--text-secondary)', textAlign: 'center', padding: 20}}>{txt.noProjects}</p>
                                        ) : (
                                            projects.map(project => (
                                                <div key={project.id} style={{display: 'flex', alignItems: 'center', padding: '12px', marginBottom: 8, background: 'var(--bg-secondary)', borderRadius: 8, cursor: 'pointer'}}
                                                    onClick={() => setEditingProject(project)}>
                                                    <div style={{flex: 1}}>
                                                        <div style={{fontWeight: 500}}>{project.name}</div>
                                                        <div style={{fontSize: 12, color: 'var(--text-secondary)', marginTop: 4}}>
                                                            {project.templates?.length || 0} {language === 'es' ? 'plantillas' : 'templates'} · {project.attachedReports?.length || 0} {language === 'es' ? 'reportes' : 'reports'} · {project.attachedLinks?.length || 0} links
                                                        </div>
                                                    </div>
                                                    <button className="btn btn-small" onClick={(e) => { e.stopPropagation(); deleteProject(project.id); }}>
                                                        <LucideIcon name="trash-2" size={14} />
                                                    </button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'reports' && (
                                <div style={{padding: 16, maxHeight: 400, overflowY: 'auto'}}>
                                    {savedReports.length === 0 ? (
                                        <p style={{color: 'var(--text-secondary)', textAlign: 'center', padding: 20}}>
                                            {txt.noSavedReports}
                                        </p>
                                    ) : (
                                        savedReports.map(report => (
                                            <div key={report.id} style={{padding: '12px', marginBottom: 8, background: 'var(--bg-secondary)', borderRadius: 8, cursor: 'pointer', border: selectedReports.includes(report.id) ? '2px solid var(--accent)' : '2px solid transparent'}}
                                                onClick={() => setSelectedReports(prev => prev.includes(report.id) ? prev.filter(id => id !== report.id) : [...prev, report.id])}>
                                                <div style={{fontWeight: 500}}>{report.name}</div>
                                                <div style={{fontSize: 12, color: 'var(--text-secondary)'}}>{new Date(report.date).toLocaleDateString()}</div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            )}

                            {activeTab === 'template' && (
                                <div style={{padding: 16}}>
                                    <div className="form-group">
                                        <label className="form-label">{txt.pasteTemplate}</label>
                                        <textarea
                                            className="form-textarea"
                                            value={template}
                                            onChange={e => setTemplate(e.target.value)}
                                            placeholder={txt.pasteHint}
                                            style={{minHeight: 150}}
                                        />
                                    </div>
                                    {selectedReports.length > 0 && (
                                        <p style={{fontSize: 13, color: 'var(--text-secondary)', marginBottom: 12}}>
                                            {selectedReports.length} {txt.reportsSelected}
                                        </p>
                                    )}
                                    <button className="btn btn-primary" onClick={handleGenerateFromTemplate} disabled={generating || !template.trim() || selectedReports.length === 0}>
                                        {generating ? txt.generating : txt.generate}
                                    </button>

                                    {generatedContent && (
                                        <div style={{marginTop: 16, padding: 16, background: 'var(--bg-secondary)', borderRadius: 8, maxHeight: 200, overflowY: 'auto'}}>
                                            <div dangerouslySetInnerHTML={{__html: DOMPurify.sanitize(generatedContent)}} />
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ErrorBoundary><App /></ErrorBoundary>, document.getElementById('root'));
    </script>
</body>
</html>
