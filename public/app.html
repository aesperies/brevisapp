<html lang="es">
<head>

    <meta name="description" content="Organize, summarize, and get the most out of your newsletters with AI. Designed for professionals who value their time.">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <style>
        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F9F9F9;
            --bg-card: #FFFFFF;
            --bg-hover: #F5F5F5;
            --text-primary: #000000;
            --text-secondary: #666666;
            --text-muted: #767676;
            --text-body: #333333;
            --border: #E5E5E5;
            --border-light: #F0F0F0;
            --accent: #2BBCC0;
            --accent-bg: rgba(43,188,192,0.08);
            --accent-bg-light: rgba(43,188,192,0.1);
            --btn-dark: #000000;
            --btn-dark-hover: #333333;
            --shadow: rgba(0,0,0,0.06);
            --shadow-md: rgba(0,0,0,0.08);
            --shadow-lg: rgba(0,0,0,0.1);
            --overlay: rgba(0,0,0,0.5);
            --skeleton-from: #F0F0F0;
            --skeleton-mid: #E5E5E5;
        }
        [data-theme="dark"] {
            --bg-primary: #121212;
            --bg-secondary: #1E1E1E;
            --bg-card: #2A2A2A;
            --bg-hover: #333333;
            --text-primary: #FFFFFF;
            --text-secondary: #B3B3B3;
            --text-muted: #949494;
            --text-body: #E0E0E0;
            --border: #383838;
            --border-light: #2A2A2A;
            --accent: #2BBCC0;
            --accent-bg: rgba(43,188,192,0.12);
            --accent-bg-light: rgba(43,188,192,0.15);
            --btn-dark: #FFFFFF;
            --btn-dark-hover: #E0E0E0;
            --shadow: rgba(0,0,0,0.4);
            --shadow-md: rgba(0,0,0,0.5);
            --shadow-lg: rgba(0,0,0,0.6);
            --overlay: rgba(0,0,0,0.7);
            --skeleton-from: #2A2A2A;
            --skeleton-mid: #383838;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s, color 0.3s;
        }
        .app-layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 20px 0;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
        }
        .sidebar-logo {
            padding: 0 24px 32px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-mark {
            width: 32px;
            height: 32px;
            background: var(--text-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: var(--bg-primary);
            letter-spacing: -0.5px;
        }
        .logo-text { font-size: 20px; font-weight: 600; color: var(--text-primary); letter-spacing: 0.08em; }
        .sidebar-section { margin-bottom: 24px; }
        .sidebar-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding: 0 20px;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 24px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-body);
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            border-left: 3px solid transparent;
            font-family: inherit;
            transition: all 0.2s;
        }
        .sidebar-item:hover { background: var(--bg-hover); }
        .sidebar-item.active {
            background: var(--accent-bg);
            color: var(--text-primary);
            border-left-color: var(--accent);
            font-weight: 500;
        }
        .sidebar-item-icon { font-size: 16px; width: 20px; text-align: center; }
        .sidebar-item-label { flex: 1; }
        .sidebar-item-count {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--border);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }
        .sidebar-item.active .sidebar-item-count { background: var(--text-primary); color: var(--bg-primary); }
        .sidebar-tag-item { padding-left: 52px; }
        .sidebar-report-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-body);
        }
        .sidebar-report-item:hover { background: var(--bg-hover); }
        .main-content {
            flex: 1;
            margin-left: 260px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 48px;
        }
        .header {
            padding: 32px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
        }
        .tagline { font-size: 16px; color: var(--text-secondary); }
        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }
        .plan-badge {
            padding: 4px 12px;
            background: var(--text-primary);
            color: var(--bg-primary);
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .plan-badge.pro, .plan-badge.standard { background: var(--accent); }
        .user-name-button {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            color: var(--text-primary);
        }
        .user-name-button:hover { background: var(--bg-hover); }
        .user-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--shadow-md);
            min-width: 220px;
            z-index: 1000;
        }
        .user-dropdown-info {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        .user-dropdown-email { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .user-dropdown-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .user-dropdown-item:last-child { border-bottom: none; border-top: 1px solid var(--border); }
        .user-dropdown-item:hover { background: var(--bg-hover); }
        .lang-toggle {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            color: var(--text-primary);
        }
        .btn {
            padding: 12px 24px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: var(--bg-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--btn-dark); color: var(--bg-primary); border-color: var(--btn-dark); }
        .btn-primary:hover { background: var(--btn-dark-hover); }
        .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .sidebar-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 6px; }
        .close-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .newsletter-title:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
        .user-name-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
        .tag-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .btn-small { padding: 8px 16px; font-size: 13px; }
        .btn-full { width: 100%; }
        .email-display {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        .email-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .email-code { font-size: 16px; font-weight: 600; font-family: 'Monaco', monospace; color: var(--text-primary); }
        .nav {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
        }
        .search-box { flex: 1; }
        .search-input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .search-input:focus { outline: none; border-color: var(--accent); }
        .selection-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .selection-info { font-weight: 500; }
        .selection-actions { display: flex; gap: 8px; }
        .newsletter-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px 24px;
            margin-bottom: 16px;
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }
        .newsletter-card:hover { box-shadow: 0 2px 8px var(--shadow); }
        .newsletter-card.read .newsletter-title { color: var(--text-muted); }
        .newsletter-card-content { flex: 1; min-width: 0; }
        .newsletter-card-actions {
            display: flex;
            flex-direction: row;
            gap: 6px;
            flex-shrink: 0;
            align-items: flex-start;
        }
        .newsletter-card.selecting { padding-left: 60px; }
        .newsletter-checkbox {
            position: absolute;
            left: 20px;
            top: 24px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .newsletter-title { font-family: 'Instrument Serif', serif; font-size: 19px; font-weight: 400; line-height: 1.3; margin-bottom: 4px; cursor: pointer; color: var(--text-primary); transition: color 0.2s ease; }
        .newsletter-title:hover { color: var(--accent); text-decoration: none; }
        .newsletter-meta { font-size: 12px; color: var(--text-secondary); }
        .newsletter-tag {
            padding: 2px 8px;
            border: 1px solid;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 500;
        }
        .newsletter-content {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 6px;
            line-height: 1.5;
            max-height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .summary-box {
            background: var(--bg-secondary);
            border-left: 3px solid var(--accent);
            padding: 12px 16px;
            margin: 12px 0;
            border-radius: 4px;
        }
        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .summary-label {
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }
        .summary-toggle {
            background: none;
            border: none;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0;
        }
        .summary-content {
            font-size: 13px;
            line-height: 1.6;
            margin-top: 8px;
        }
        .summary-content ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .summary-content li {
            position: relative;
            padding-left: 16px;
        }
        .summary-content li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: 700;
        }
        .summary-content.collapsed {
            display: none;
        }
        .badge {
            padding: 2px 6px;
            background: var(--accent);
            color: #FFF;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .tag-dropdown {
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 0;
            min-width: 180px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 -4px 20px var(--shadow-lg);
        }
        .tag-dropdown::-webkit-scrollbar {
            width: 6px;
        }
        .tag-dropdown::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        .tag-dropdown::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }
        .tag-dropdown::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
        .tag-dropdown-item {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            transition: background 0.15s;
        }
        .tag-dropdown-item:hover { background: var(--bg-hover); }
        .tag-color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .tag-dropdown-empty {
            padding: 12px 14px;
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
        }
        .actions-dropdown {
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 0;
            min-width: 180px;
            z-index: 1000;
            box-shadow: 0 -4px 20px var(--shadow-lg);
        }
        .actions-dropdown-item {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            transition: background 0.15s;
        }
        .actions-dropdown-item:hover { background: var(--bg-hover); }
        .actions-dropdown-item.danger:hover { background: #FEE; color: #C00; }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal {
            background: var(--bg-card);
            border-radius: 8px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-title { font-family: 'Instrument Serif', serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .close-btn:hover { background: var(--bg-hover); }
        .modal-body { padding: 24px; overflow-y: auto; flex: 1; }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .modal-meta { font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; }
        .modal-content { line-height: 1.8; white-space: pre-wrap; }
        .newsletter-iframe {
            width: 100%;
            min-height: 400px;
            border: none;
            background: #fff;
        }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        .form-input:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
        .form-textarea { resize: vertical; min-height: 100px; }
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .empty-text { color: var(--text-secondary); font-size: 14px; }
        .footer { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }
        .upgrade-banner {
            background: linear-gradient(135deg, #2C3544 0%, #3D5A6E 100%);
            color: #FFF;
            padding: 20px 24px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .upgrade-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
        .upgrade-subtitle { font-size: 13px; opacity: 0.9; }
        .btn-upgrade { background: var(--accent); color: #FFF; border: none; font-weight: 600; }
        .plan-indicator {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 24px;
        }
        .plan-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .plan-progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .plan-progress-bar { height: 100%; background: #4CAF50; transition: width 0.3s; }
        .plan-progress-bar.warning { background: #FF9800; }
        .plan-progress-bar.danger { background: #F44336; }
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-box {
            max-width: 400px;
            width: 100%;
            padding: 48px 32px;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 24px var(--shadow);
            background: var(--bg-card);
        }
        /* Landing Page */
        .landing { background: var(--bg-primary); color: var(--text-primary); }
        .landing-hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 24px;
        }
        .landing-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 32px;
            background: var(--bg-primary);
            backdrop-filter: blur(12px);
            z-index: 100;
        }
        .landing-nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .landing-nav-mark {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .landing-hero-logo {
            margin-bottom: 32px;
        }
        .landing-nav-text {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--text-primary);
        }
        .landing-badge {
            display: inline-block;
            padding: 6px 16px;
            background: var(--accent-bg-light);
            color: var(--accent);
            border-radius: 20px;

                    credentials: 'include',

                        data.code

                            padding: '40px', textAlign: 'center'
                        }
                    },
                        React.createElement('h2', { style: { marginBottom: '16px' } }, 'Something went wrong'),
                        React.createElement('p', {
                            style: { color: '#666', marginBottom: '24px', maxWidth: '400px' }
                        }, 'The app encountered an error. Please reload the page.'),
                        React.createElement('button', {
                            onClick: () => window.location.reload(),
                            style: {
                                padding: '12px 24px', background: '#000', color: '#fff',
                                border: 'none', borderRadius: '8px', cursor: 'pointer',
                                fontFamily: 'inherit', fontSize: '14px'
                            }
                        }, 'Reload')
                    );
                }
                return this.props.children;
            }
        }

        // Clean email subject prefixes (FWD, RE, etc.)
        function cleanTitle(title) {
            if (!title) return '';
            return title
                .replace(/^(fwd?|re|rv|fw|aw|wg|tr|r|enc|env):\s*/gi, '')
                .replace(/^\[.*?\]\s*/, '')
                .trim();
        }

        // Strip HTML tags for plain text preview
        function formatSummary(text) {
            if (!text || typeof text !== 'string') return null;
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            const bullets = lines.filter(l => /^[-•–—*]\s/.test(l) || /^\d+[.)]\s/.test(l));
            if (bullets.length >= 2) {
                return React.createElement('ul', null,
                    bullets.map((b, i) => React.createElement('li', { key: i },
                        b.replace(/^[-•–—*]\s+/, '').replace(/^\d+[.)]\s+/, '')
                    ))
                );
            }
            return text;
        }

        function stripHtml(html) {
            if (!html) return '';
            return html
                .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '')
                .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
                .replace(/<[^>]+>/g, ' ')
                .replace(/&nbsp;/g, ' ')
                .replace(/&amp;/g, '&')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/&quot;/g, '"')
                .replace(/\s+/g, ' ')
                .trim()
                .substring(0, 300);
        }

        function LucideIcon({ name, size = 16, color, strokeWidth = 2, style = {} }) {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current && window.lucide) {
                    ref.current.innerHTML = '';
                    const el = document.createElement('i');
                    el.setAttribute('data-lucide', name);
                    el.style.width = size + 'px';
                    el.style.height = size + 'px';
                    ref.current.appendChild(el);
                    lucide.createIcons({ nodes: [el], attrs: { width: size, height: size, 'stroke-width': strokeWidth } });
                    if (color) {
                        const svg = ref.current.querySelector('svg');
                        if (svg) svg.style.stroke = color;
                    }
                }
            }, [name, size, color, strokeWidth]);
            return React.createElement('span', {
                ref,
                style: { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: size, height: size, ...style }
            });
        }

        function useTheme() {
            const [theme, setThemeState] = useState(() => {
                return document.documentElement.getAttribute('data-theme') || 'light';
            });
            const setTheme = useCallback((newTheme) => {
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('brevis_theme', newTheme);
                setThemeState(newTheme);
            }, []);
            const toggleTheme = useCallback(() => {
                setTheme(theme === 'dark' ? 'light' : 'dark');
            }, [theme, setTheme]);
            useEffect(() => {
                const mq = window.matchMedia('(prefers-color-scheme: dark)');
                const handler = (e) => {
                    if (!localStorage.getItem('brevis_theme')) {
                        const t = e.matches ? 'dark' : 'light';
                        document.documentElement.setAttribute('data-theme', t);
                        setThemeState(t);
                    }
                };
                mq.addEventListener('change', handler);
                return () => mq.removeEventListener('change', handler);
            }, []);
            return { theme, toggleTheme };
        }

        function BookmarkletSave() {
            const [status, setStatus] = useState('saving');
            const [message, setMessage] = useState('');

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const dataStr = params.get('data');
                if (!dataStr) { setStatus('error'); setMessage('No data received.'); return; }
                try {
                    const payload = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(dataStr)))));
                    fetch(`${API_URL}/newsletters`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({
                            title: payload.title || 'Saved from web',
                            source: payload.source || 'Web',
                            content: payload.content || '',
                            url: payload.url || ''
                        })
                    }).then(res => {
                        if (res.ok) {
                            setStatus('success');
                            setMessage('Saved!');
                            setTimeout(() => window.close(), 2000);
                        } else {
                            res.json().then(d => { setStatus('error'); setMessage(d.error || 'Failed to save.'); });
                        }
                    }).catch(() => { setStatus('error'); setMessage('Connection error. Are you logged in?'); });
                } catch (e) { setStatus('error'); setMessage('Invalid data.'); }
            }, []);

            return (
                <div style={{display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', fontFamily: 'Inter, sans-serif'}}>
                    <div style={{textAlign: 'center', padding: '40px'}}>
                        <div style={{fontSize: '40px', marginBottom: '16px'}}>
                            {status === 'saving' ? '...' : status === 'success' ? '✓' : '✗'}
                        </div>
                        <div style={{fontSize: '16px', fontWeight: 600, color: 'var(--text-primary)', marginBottom: '8px'}}>
                            {status === 'saving' ? 'Saving to BREVIS...' : message}
                        </div>
                        {status === 'success' && (
                            <div style={{fontSize: '13px', color: 'var(--text-muted)'}}>This window will close automatically.</div>
                        )}
                        {status === 'error' && (
                            <button onClick={() => window.close()}
                                style={{marginTop: '12px', padding: '8px 20px', border: '1px solid var(--border)', borderRadius: '6px', background: 'var(--bg-primary)', cursor: 'pointer', fontFamily: 'inherit'}}>
                                Close
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            const [hasAccess, setHasAccess] = useState(localStorage.getItem('brevis_access') === 'true');
            const [language, setLanguage] = useState('es');
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            // Update document lang attribute when language changes
            useEffect(() => {
                document.documentElement.lang = language;
            }, [language]);

            useEffect(() => { if (hasAccess) checkAuth(); else setLoading(false); }, [hasAccess]);

            // Detect ?verified=true from email verification redirect
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('verified') === 'true') {
                    showToast(language === 'es' ? 'Email verificado correctamente' : 'Email verified successfully', 'success');
                    window.history.replaceState({}, '', window.location.pathname);
                    checkAuth();
                }
            }, []);

            // Handle auth expiry (JWT expired mid-session)
            useEffect(() => {
                const handleExpired = () => {
                    setUser(null);
                    showToast(language === 'es' ? 'Sesion expirada. Inicia sesion de nuevo.' : 'Session expired. Please log in again.', 'error');
                };
                window.addEventListener('auth:expired', handleExpired);
                return () => window.removeEventListener('auth:expired', handleExpired);
            }, [language]);

            // Refresh user data when tab regains focus (e.g. after verifying email in another tab)
            useEffect(() => {
                const onVisible = () => {
                    if (document.visibilityState === 'visible' && hasAccess) checkAuth();
                };
                document.addEventListener('visibilitychange', onVisible);
                return () => document.removeEventListener('visibilitychange', onVisible);
            }, [hasAccess]);

            const checkAuth = async () => {
                try {
                    const res = await fetch(`${API_URL}/auth/me`, { credentials: 'include' });
                    if (res.ok) setUser((await res.json()).user);
                } catch (e) {
                    console.error('Auth error:', e);
                } finally {
                    setLoading(false);
                }
            };

            if (window.location.pathname === '/bookmarklet-save') return <><ToastContainer /><BookmarkletSave /></>;
            if (window.location.pathname === '/reset-password') return <><ToastContainer /><ResetPassword /></>;
            if (!hasAccess) return <><ToastContainer /><LandingPage onAccess={() => setHasAccess(true)} /></>;
            if (loading) return <><ToastContainer /><div className="auth-container" style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh'}}>
                <div className="skeleton-line long" style={{width:'120px',height:'20px'}}></div>
            </div></>;
            if (!user) return <><ToastContainer /><Auth onLogin={checkAuth} language={language} setLanguage={setLanguage} /></>;
            return <><ToastContainer /><Dashboard user={user} setUser={setUser} language={language} setLanguage={setLanguage} /></>;
        }

                if (password !== confirm) { setError('Passwords do not match'); return; }
                setStatus('loading');
                setError('');
                try {
                    const res = await fetch(`${API_URL}/auth/reset-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, password })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setStatus('success');
                    } else {
                        setError(data.error || 'Error');
                        setStatus('idle');
                    }
                } catch (e) { setError('Connection error'); setStatus('idle'); }
            };

            if (!token) return (
                <div className="auth-container">
                    <div className="auth-box" style={{textAlign: 'center'}}>
                        <p>Invalid reset link.</p>

            );

            return (
                <div className="auth-container">
                    <div className="auth-box">

                            </div>
                            <div className="form-group">

                                <input type="password" className="form-input" value={confirm}

                            </div>
                            {error && <div style={{color: '#EF4444', fontSize: '13px', marginBottom: '12px'}}>{error}</div>}
                            <button type="submit" className="btn btn-primary btn-full" disabled={status === 'loading'}>
                                {status === 'loading' ? '...' : 'Reset password'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

                localStorage.setItem('brevis_saved_reports', JSON.stringify(updated));
            };

            const deleteReport = (id) => {
                const updated = savedReports.filter(r => r.id !== id);
                setSavedReports(updated);
                localStorage.setItem('brevis_saved_reports', JSON.stringify(updated));
            };

            const renameReport = (id, newName) => {
                const updated = savedReports.map(r => r.id === id ? {...r, name: newName} : r);
                setSavedReports(updated);
                localStorage.setItem('brevis_saved_reports', JSON.stringify(updated));
            };

            // Projects CRUD functions
            const loadProjects = () => {
                try {
                    const saved = localStorage.getItem('brevis_projects');
                    if (saved) setProjects(JSON.parse(saved));
                } catch (e) { console.error('Error loading projects:', e); }
            };

            const createProject = (name) => {
                const newProject = {
                    id: Date.now(),
                    name: name,
                    createdAt: new Date().toISOString(),
                    templates: [],
                    attachedReports: [],
                    attachedLinks: [],
                    attachedFiles: []
                };
                const updated = [...projects, newProject];
                setProjects(updated);
                localStorage.setItem('brevis_projects', JSON.stringify(updated));
                return newProject;
            };

            const updateProject = (projectId, updates) => {
                const updated = projects.map(p => p.id === projectId ? {...p, ...updates} : p);
                setProjects(updated);
                localStorage.setItem('brevis_projects', JSON.stringify(updated));
            };

            const deleteProject = (projectId) => {
                const updated = projects.filter(p => p.id !== projectId);
                setProjects(updated);
                localStorage.setItem('brevis_projects', JSON.stringify(updated));
            };

            // Sidebar order functions
            const saveSidebarOrder = (newOrder) => {
                setSidebarOrder(newOrder);
                localStorage.setItem('brevis_sidebar_order', JSON.stringify(newOrder));
            };

            const resetSidebarOrder = () => {
                const defaultOrder = ['logo', 'bookmarklet', 'main', 'tags', 'subscriptions', 'reports', 'create'];
                saveSidebarOrder(defaultOrder);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch(`${API_URL}/newsletters`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(formData)
                    });
                    if (res.ok) {
                        fetchNewsletters();
                        setFormData({ title: '', sender: '', content: '', url: '' });
                        setShowAddForm(false);
                        showToast(language === 'es' ? 'Newsletter añadido' : 'Newsletter added');
                    }
                } catch (e) { console.error('Error:', e); }
            };

            const handleImportUrl = async (e) => {
                e.preventDefault();
                setImportLoading(true);
                setImportError('');
                try {
                    const res = await fetch(`${API_URL}/import/url`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ url: importUrl })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        setImportError(data.error === 'linkedin_not_supported'
                            ? translations.import_.linkedinHint
                            : (data.error || translations.import_.error));
                        return;
                    }
                    fetchNewsletters();
                    setImportUrl('');
                    setShowAddForm(false);
                    showToast(language === 'es' ? 'Importado correctamente' : 'Imported successfully');
                } catch (e) {
                    setImportError(translations.import_.error);
                } finally {
                    setImportLoading(false);
                }
            };

            const handlePdfUpload = async (e) => {
                e.preventDefault();
                if (!pdfFile) return;
                setPdfLoading(true);
                setPdfError('');
                try {
                    const formData = new FormData();
                    formData.append('file', pdfFile);
                    const res = await fetch(`${API_URL}/newsletters/upload-pdf`, {
                        method: 'POST',
                        credentials: 'include',
                        body: formData
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        setPdfError(data.error || (language === 'es' ? 'Error al procesar PDF' : 'Error processing PDF'));
                        return;
                    }
                    fetchNewsletters();
                    setPdfFile(null);
                    setShowAddForm(false);
                    showToast(language === 'es' ? 'PDF importado correctamente' : 'PDF imported successfully');
                } catch (err) {
                    setPdfError(language === 'es' ? 'Error al subir el archivo' : 'Error uploading file');
                } finally {
                    setPdfLoading(false);
                }
            };

            const toggleRead = async (id) => {
                const newsletter = newsletters.find(n => n.id === id);
                try {
                    const res = await fetch(`${API_URL}/newsletters/${id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ is_read: newsletter.is_read ? 0 : 1 })
                    });
                    if (res.ok) {
                        const newReadState = newsletter.is_read ? 0 : 1;
                        setNewsletters(newsletters.map(n => n.id === id ? { ...n, is_read: newReadState } : n));
                        if (readingNewsletter?.id === id) {
                            setReadingNewsletter({...readingNewsletter, is_read: newReadState});
                        }
                    }
                } catch (e) { console.error('Error:', e); }
            };

            const deleteNewsletter = async (id) => {
                setConfirmModal({
                    title: language === 'es' ? 'Eliminar newsletter' : 'Delete newsletter',
                    message: language === 'es' ? '¿Estás seguro de que quieres eliminar esta newsletter?' : 'Are you sure you want to delete this newsletter?',
                    confirmText: language === 'es' ? 'Eliminar' : 'Delete',
                    cancelText: language === 'es' ? 'Cancelar' : 'Cancel',
                    danger: true,
                    onConfirm: async () => {
                        setConfirmModal(null);
                        try {
                            const res = await fetch(`${API_URL}/newsletters/${id}`, {
                                method: 'DELETE',
                                credentials: 'include'
                            });
                            if (res.ok) {
                                setNewsletters(newsletters.filter(n => n.id !== id));
                                if (readingNewsletter?.id === id) setReadingNewsletter(null);
                                setShowActionsMenuFor(null);
                            }
                        } catch (e) { console.error('Error:', e); }
                    }
                });
            };

            const sendToKindle = async (id) => {
                try {
                    const res = await fetch(`${API_URL}/newsletters/${id}/kindle`, {
                        method: 'POST',
                        credentials: 'include'
                    });
                    if (res.ok) {
                        showToast(language === 'es' ? '¡Enviado a tu Kindle!' : 'Sent to your Kindle!');
                        setShowActionsMenuFor(null);
                    } else {
                        const error = await res.json();
                        showToast(error.error || 'Error sending to Kindle', 'error');
                    }
                } catch (e) {
                    console.error('Error:', e);
                    showToast('Error sending to Kindle', 'error');
                }
            };

            const readAloud = async (id) => {
                const newsletter = newsletters.find(n => n.id === id);
                if (!newsletter) return;

                try {
                    const res = await fetch(`${API_URL}/newsletters/${id}/audio`, {
                        method: 'POST',
                        credentials: 'include'
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.audioUrl) {
                            window.open(data.audioUrl, '_blank');
                        }
                        setShowActionsMenuFor(null);
                    } else {
                        const error = await res.json();
                        showToast(error.error || 'Error generating audio', 'error');
                    }
                } catch (e) {
                    console.error('Error:', e);
                    showToast('Error generating audio', 'error');
                }
            };

            const generateSummary = async (id) => {
                if (user.plan === 'free') {
                    setShowUpgradeModal(true);
                    return;
                }
                setGeneratingSummary(prev => ({...prev, [id]: true}));
                try {
                    const res = await apiFetch(`/newsletters/${id}/summary`, {
                        method: 'POST'
                    });
                    const data = await res.json();
                    setNewsletters(newsletters.map(n => n.id === id ? { ...n, summary: data.summary } : n));
                    if (readingNewsletter?.id === id) {
                        setReadingNewsletter({...readingNewsletter, summary: data.summary});
                    }
                } catch (e) {
                    if (e.status === 403) {
                        setShowUpgradeModal(true);
                        return;
                    }
                    if (e.code !== 'AUTH_EXPIRED' && e.code !== 'RATE_LIMITED') {
                        showToast(e.message || 'Error generating summary', 'error');
                    }
                } finally {
                    setGeneratingSummary(prev => ({...prev, [id]: false}));
                }
            };

            const generateBrief = async () => {
                if (selectedNewsletters.length === 0) return;
                if (user.plan === 'free') {
                    setShowUpgradeModal(true);
                    return;
                }

                setPromptModal({
                    title: language === 'es' ? 'Generar Brief' : 'Generate Brief',
                    placeholder: language === 'es'
                        ? 'ej: preparar una reunión, investigar un tema, tomar una decisión...'
                        : 'e.g., prepare a meeting, research a topic, make a decision...',
                    confirmText: language === 'es' ? 'Generar' : 'Generate',
                    cancelText: language === 'es' ? 'Cancelar' : 'Cancel',
                    onConfirm: async (purpose) => {
                        setPromptModal(null);
                        setGeneratingBatch(true);
                        try {
                            const res = await apiFetch('/newsletters/brief', {
                                method: 'POST',
                                body: JSON.stringify({ newsletter_ids: selectedNewsletters, purpose })
                            });
                            const data = await res.json();
                            const result = { type: 'brief', content: data.brief, purpose };
                            setShowBatchResult(result);
                            saveReport(result);
                            setSelectionMode(false);
                            setSelectedNewsletters([]);
                        } catch (e) {
                            console.error('Brief error:', e);
                            showToast(e.message, 'error');
                        } finally {
                            setGeneratingBatch(false);
                        }
                    }
                });
            };

            const generateReport = async () => {
                if (selectedNewsletters.length === 0) return;
                if (user.plan !== 'premium') {
                    setShowUpgradeModal(true);
                    return;
                }

                setPromptModal({
                    title: language === 'es' ? 'Generar Reporte' : 'Generate Report',
                    placeholder: language === 'es'
                        ? 'ej: presentar a mi equipo, escribir un artículo, análisis de mercado...'
                        : 'e.g., present to my team, write an article, market analysis...',
                    confirmText: language === 'es' ? 'Generar' : 'Generate',
                    cancelText: language === 'es' ? 'Cancelar' : 'Cancel',
                    onConfirm: async (purpose) => {
                        setPromptModal(null);
                        setGeneratingBatch(true);
                        try {
                            const res = await apiFetch('/newsletters/report', {
                                method: 'POST',
                                body: JSON.stringify({ newsletter_ids: selectedNewsletters, purpose })
                            });
                            const data = await res.json();
                            const result = { type: 'report', content: data.report, purpose };
                            setShowBatchResult(result);
                            saveReport(result);
                            setSelectionMode(false);
                            setSelectedNewsletters([]);
                        } catch (e) {
                            console.error('Report error:', e);
                            showToast(e.message, 'error');
                        } finally {
                            setGeneratingBatch(false);
                        }
                    }
                });
            };

            const addTagToNewsletter = async (newsletterId, tagId) => {
                try {
                    const res = await apiFetch(`/newsletters/${newsletterId}/tags/${tagId}`, {
                        method: 'POST'
                    });
                    const updated = await res.json();
                    setNewsletters(newsletters.map(n => n.id === newsletterId ? updated : n));
                    if (readingNewsletter?.id === newsletterId) setReadingNewsletter(updated);
                } catch (e) { console.error('Error:', e); }
            };

            const removeTagFromNewsletter = async (newsletterId, tagId) => {
                try {
                    const res = await apiFetch(`/newsletters/${newsletterId}/tags/${tagId}`, {
                        method: 'DELETE'
                    });
                    const updated = await res.json();
                    setNewsletters(newsletters.map(n => n.id === newsletterId ? updated : n));
                    if (readingNewsletter?.id === newsletterId) setReadingNewsletter(updated);
                } catch (e) { console.error('Error:', e); }
            };

            // Bulk actions
            const bulkMarkAsRead = async (markRead = true) => {
                const readValue = markRead ? 1 : 0;
                try {
                    await Promise.all(selectedNewsletters.map(id =>
                        apiFetch(`/newsletters/${id}`, {
                            method: 'PATCH',
                            body: JSON.stringify({ is_read: readValue })
                        })
                    ));
                    setNewsletters(newsletters.map(n =>
                        selectedNewsletters.includes(n.id) ? { ...n, is_read: readValue } : n
                    ));
                    setSelectedNewsletters([]);
                    setSelectionMode(false);
                    showToast(language === 'es' ? 'Newsletters actualizadas' : 'Newsletters updated', 'success');
                } catch (e) {
                    console.error('Bulk mark as read error:', e);
                    showToast(language === 'es' ? 'Error al actualizar' : 'Update failed', 'error');
                }
            };

            const bulkDelete = () => {
                setConfirmModal({
                    title: language === 'es' ? 'Eliminar newsletters' : 'Delete newsletters',
                    message: language === 'es'
                        ? `¿Estás seguro de que quieres eliminar ${selectedNewsletters.length} newsletters?`
                        : `Are you sure you want to delete ${selectedNewsletters.length} newsletters?`,
                    confirmText: language === 'es' ? 'Eliminar' : 'Delete',
                    cancelText: language === 'es' ? 'Cancelar' : 'Cancel',
                    danger: true,
                    onConfirm: async () => {
                        setConfirmModal(null);
                        try {
                            await Promise.all(selectedNewsletters.map(id =>
                                apiFetch(`/newsletters/${id}`, {
                                    method: 'DELETE'
                                })
                            ));
                            setNewsletters(newsletters.filter(n => !selectedNewsletters.includes(n.id)));
                            setSelectedNewsletters([]);
                            setSelectionMode(false);
                            showToast(language === 'es' ? 'Newsletters eliminadas' : 'Newsletters deleted', 'success');
                        } catch (e) {
                            console.error('Bulk delete error:', e);
                            showToast(language === 'es' ? 'Error al eliminar' : 'Delete failed', 'error');
                        }
                    }
                });
            };

            const bulkAddTag = async (tagId) => {
                try {
                    await Promise.all(selectedNewsletters.map(id =>
                        apiFetch(`/newsletters/${id}/tags/${tagId}`, {
                            method: 'POST'
                        })
                    ));
                    fetchNewsletters(); // Refresh to get updated tags
                    setSelectedNewsletters([]);
                    setSelectionMode(false);
                    showToast(language === 'es' ? 'Etiqueta añadida' : 'Tag added', 'success');
                } catch (e) {
                    console.error('Bulk add tag error:', e);
                    showToast(language === 'es' ? 'Error al añadir etiqueta' : 'Failed to add tag', 'error');
                }
            };

            // Select all visible newsletters
            const selectAllVisible = () => {
                const visibleIds = filteredNewsletters.map(n => n.id);
                if (selectedNewsletters.length === visibleIds.length) {
                    setSelectedNewsletters([]);
                } else {
                    setSelectedNewsletters(visibleIds);
                }
            };

            const logout = async () => {
                try {
                    await fetch(`${API_URL}/auth/logout`, { method: 'POST', credentials: 'include' });
                    setUser(null);
                } catch (e) { console.error('Error:', e); }
            };

            const getFilteredNewsletters = () => {
                let filtered = newsletters;
                if (sidebarView === 'unread') filtered = filtered.filter(n => !n.is_read);
                else if (sidebarView === 'read') filtered = filtered.filter(n => n.is_read);
                else if (sidebarView.startsWith('tag:')) {
                    const tagId = parseInt(sidebarView.split(':')[1]);
                    filtered = filtered.filter(n => n.tags && n.tags.some(t => t.id === tagId));
                }
                if (searchTerm) {
                    const term = searchTerm.toLowerCase();
                    filtered = filtered.filter(n =>
                        (n.title || '').toLowerCase().includes(term) ||
                        (n.sender || '').toLowerCase().includes(term)
                    );
                }
                return filtered;
            };

            const filteredNewsletters = getFilteredNewsletters();

            return (
                <div className="app-layout">
                    {sidebarOpen && <div className="sidebar-overlay active" onClick={() => setSidebarOpen(false)}></div>}
                    <div className={`sidebar ${sidebarOpen ? 'sidebar-open' : ''}`}>
                        {sidebarOpen && (
                            <button onClick={() => setSidebarOpen(false)}
                                aria-label="Close sidebar"
                                style={{position: 'absolute', top: '12px', right: '12px', background: 'none', border: 'none', fontSize: '20px', cursor: 'pointer', color: 'var(--text-muted)', zIndex: 10, display: 'none'}}
                                className="mobile-sidebar-close">
                                ✕
                            </button>
                        )}
                        {/* Sidebar sections rendered based on sidebarOrder */}
                        {(() => {
                            const handleDragStart = (e, sectionId) => {
                                setDraggedSection(sectionId);
                                e.dataTransfer.effectAllowed = 'move';
                            };
                            const handleDragOver = (e, sectionId) => {
                                e.preventDefault();
                                if (draggedSection && draggedSection !== sectionId) {
                                    const newOrder = [...sidebarOrder];
                                    const draggedIdx = newOrder.indexOf(draggedSection);
                                    const targetIdx = newOrder.indexOf(sectionId);
                                    newOrder.splice(draggedIdx, 1);
                                    newOrder.splice(targetIdx, 0, draggedSection);
                                    saveSidebarOrder(newOrder);
                                }
                            };
                            const handleDragEnd = () => {
                                setDraggedSection(null);
                            };

                            const sectionRenderers = {
                                logo: () => (
                                    <div key="logo" className="sidebar-logo"
                                        draggable={editingSidebarOrder}
                                        onDragStart={e => handleDragStart(e, 'logo')}
                                        onDragOver={e => handleDragOver(e, 'logo')}
                                        onDragEnd={handleDragEnd}
                                        style={{cursor: editingSidebarOrder ? 'grab' : 'default', opacity: draggedSection === 'logo' ? 0.5 : 1}}>
                                        {editingSidebarOrder && <span style={{position: 'absolute', left: 4, top: '50%', transform: 'translateY(-50%)', color: 'var(--text-secondary)'}}><LucideIcon name="grip-vertical" size={14} /></span>}
                                        <div className="logo-container">
                                            <img src="./logo-v2-3-light.svg" alt="brevis" style={{height: '38px'}} />
                                        </div>
                                    </div>
                                ),
                                bookmarklet: () => (
                                    <div key="bookmarklet" className="sidebar-section"
                                        draggable={editingSidebarOrder}
                                        onDragStart={e => handleDragStart(e, 'bookmarklet')}
                                        onDragOver={e => handleDragOver(e, 'bookmarklet')}
                                        onDragEnd={handleDragEnd}
                                        style={{cursor: editingSidebarOrder ? 'grab' : 'default', opacity: draggedSection === 'bookmarklet' ? 0.5 : 1, position: 'relative'}}>
                                        {editingSidebarOrder && <span style={{position: 'absolute', left: 4, top: 8, color: 'var(--text-secondary)'}}><LucideIcon name="grip-vertical" size={14} /></span>}
                                        <div className="sidebar-title">{translations.import_.bookmarklet}</div>
                                        <button className="sidebar-item" onClick={() => setShowBookmarkletModal(true)}>
                                            <span className="sidebar-item-icon">
                                                <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                                            </span>
                                            <span className="sidebar-item-label">{language === 'es' ? 'Configurar' : 'Setup'}</span>
                                        </button>
                                    </div>
                                ),
                                main: () => (
                                    <div key="main" className="sidebar-section"
                                        draggable={editingSidebarOrder}
                                        onDragStart={e => handleDragStart(e, 'main')}
                                        onDragOver={e => handleDragOver(e, 'main')}
                                        onDragEnd={handleDragEnd}
                                        style={{cursor: editingSidebarOrder ? 'grab' : 'default', opacity: draggedSection === 'main' ? 0.5 : 1, position: 'relative'}}>
                                        {editingSidebarOrder && <span style={{position: 'absolute', left: 4, top: 8, color: 'var(--text-secondary)'}}><LucideIcon name="grip-vertical" size={14} /></span>}
                                        <div className="sidebar-title">{translations.sidebar.main}</div>
                                        <button className={`sidebar-item ${sidebarView === 'all' ? 'active' : ''}`}
                                            onClick={() => { setSidebarView('all'); setSidebarOpen(false); }}>
                                            <span className="sidebar-item-icon"><LucideIcon name="mail" size={16} /></span>
                                            <span className="sidebar-item-label">{translations.sidebar.all}</span>
                                            <span className="sidebar-item-count">{newsletters.length}</span>
                                        </button>
                                        <button className={`sidebar-item ${sidebarView === 'unread' ? 'active' : ''}`}
                                            onClick={() => { setSidebarView('unread'); setSidebarOpen(false); }}>
                                            <span className="sidebar-item-icon"><LucideIcon name="circle" size={16} /></span>
                                            <span className="sidebar-item-label">{translations.sidebar.unread}</span>
                                            <span className="sidebar-item-count">{newsletters.filter(n => !n.is_read).length}</span>
                                        </button>
                                        <button className={`sidebar-item ${sidebarView === 'read' ? 'active' : ''}`}
                                            onClick={() => { setSidebarView('read'); setSidebarOpen(false); }}>
                                            <span className="sidebar-item-icon"><LucideIcon name="check" size={16} /></span>
                                            <span className="sidebar-item-label">{translations.sidebar.read}</span>
                                            <span className="sidebar-item-count">{newsletters.filter(n => n.is_read).length}</span>
                                        </button>
                                    </div>
                                ),
                                tags: () => tags.length > 0 ? (
                                    <div key="tags" className="sidebar-section"
                                        draggable={editingSidebarOrder}
                                        onDragStart={e => handleDragStart(e, 'tags')}
                                        onDragOver={e => handleDragOver(e, 'tags')}
                                        onDragEnd={handleDragEnd}
                                        style={{cursor: editingSidebarOrder ? 'grab' : 'default', opacity: draggedSection === 'tags' ? 0.5 : 1, position: 'relative'}}>
                                        {editingSidebarOrder && <span style={{position: 'absolute', left: 4, top: 8, color: 'var(--text-secondary)'}}><LucideIcon name="grip-vertical" size={14} /></span>}
                                        <div className="sidebar-title">{translations.sidebar.tags}</div>
                                        {tags.map(tag => (
                                            <button key={tag.id}
                                                className={`sidebar-item sidebar-tag-item ${sidebarView === `tag:${tag.id}` ? 'active' : ''}`}
                                                onClick={() => { setSidebarView(`tag:${tag.id}`); setSidebarOpen(false); }}>
                                                <span className="sidebar-item-icon" style={{color: tag.color}}>●</span>
                                                <span className="sidebar-item-label">{tag.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                ) : null,
                                subscriptions: () => (
                                    <div key="subscriptions" className="sidebar-section"
                                        draggable={editingSidebarOrder}
                                        onDragStart={e => handleDragStart(e, 'subscriptions')}
                                        onDragOver={e => handleDragOver(e, 'subscriptions')}
                                        onDragEnd={handleDragEnd}
                                        style={{cursor: editingSidebarOrder ? 'grab' : 'default', opacity: draggedSection === 'subscriptions' ? 0.5 : 1, position: 'relative'}}>
                                        {editingSidebarOrder && <span style={{position: 'absolute', left: 4, top: 8, color: 'var(--text-secondary)'}}><LucideIcon name="grip-vertical" size={14} /></span>}
                                        <div className="sidebar-title">{language === 'es' ? 'Suscripciones' : 'Subscriptions'}</div>
                                        <button className="sidebar-item" onClick={() => setShowSubscriptions(true)}>
                                            <span className="sidebar-item-icon">
                                                <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M6 5c7.18 0 13 5.82 13 13M6 11c3.87 0 7 3.13 7 7M6 17h.01"/></svg>
                                            </span>
                                            <span className="sidebar-item-label">{language === 'es' ? 'Gestionar feeds' : 'Manage feeds'}</span>
                                            {subscriptions.length > 0 && <span className="sidebar-item-count">{subscriptions.length}</span>}
                                        </button>
                                    </div>
                                ),
                                reports: () => savedReports.length > 0 ? (
                                    <div key="reports" className="sidebar-section"
                                        draggable={editingSidebarOrder}
                                        onDragStart={e => handleDragStart(e, 'reports')}
                                        onDragOver={e => handleDragOver(e, 'reports')}
                                        onDragEnd={handleDragEnd}
                                        style={{cursor: editingSidebarOrder ? 'grab' : 'default', opacity: draggedSection === 'reports' ? 0.5 : 1, position: 'relative'}}>
                                        {editingSidebarOrder && <span style={{position: 'absolute', left: 4, top: 8, color: 'var(--text-secondary)'}}><LucideIcon name="grip-vertical" size={14} /></span>}
                                        <div className="sidebar-title">{translations.sidebar.reports}</div>
                                        {savedReports.map(report => (
                                            <div key={report.id} className="sidebar-report-item"
                                                onClick={() => setShowBatchResult(report)}>
                                                <span>{report.type === 'brief' ? React.createElement(LucideIcon, {name: 'file-text', size: 14}) : React.createElement(LucideIcon, {name: 'bar-chart-3', size: 14})}</span>
                                                <span style={{flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>
                                                    {report.name}
                                                </span>
                                            </div>

                                </div>
                            </div>
                        )}
                        <div className="reader-body">

                                newsletter.content.includes('<') ? (
                                    <iframe
                                        className="newsletter-iframe"
                                        srcDoc={`<!DOCTYPE html><html><head><meta charset="utf-8"><base target="_blank"><style>${iframeStyles}</style></head><body>${newsletter.content}</body></html>`}
                                        sandbox="allow-same-origin allow-popups"
                                        title="Newsletter content"
                                        style={{minHeight: '500px'}}
                                        onLoad={(e) => {
                                            const iframe = e.target;
                                            const resizeIframe = () => {
                                                const h = iframe.contentDocument?.body?.scrollHeight;
                                                if (h) iframe.style.height = h + 40 + 'px';
                                            };
                                            resizeIframe();
                                            const imgs = iframe.contentDocument?.querySelectorAll('img');
                                            if (imgs) imgs.forEach(img => img.addEventListener('load', resizeIframe));
                                            if (iframe.contentDocument?.body) {
                                                new ResizeObserver(resizeIframe).observe(iframe.contentDocument.body);
                                            }
                                        }}
                                    />
                                ) : (
                                    <div style={{whiteSpace: 'pre-wrap'}}>{newsletter.content}</div>
                                )
                            ) : (
                                <div style={{color: 'var(--text-muted)', textAlign: 'center', padding: '40px'}}>
                                    {language === 'es' ? 'Sin contenido disponible' : 'No content available'}

                            )}
                        </div>
                    </div>
                </div>
            );
